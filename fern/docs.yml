# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json
#
# The Zasp documentation site. Validate with `npm run docs:check`.
#
# The two getting-started guides have one source each:
#   - the User guide is docs/getting-started/user.md, used here as a page;
#   - the Administrator guide is docs/getting-started/administrator.md.
#     See the ADMIN-GUIDE-SOURCE comment in that file.

instances:
  - url: zasp.docs.buildwithfern.com

title: Zasp

colors:
  accent-primary:
    light: "#174EA6"
    dark: "#8AB4F8"

tabs:
  docs:
    display-name: Documentation
    icon: book-open
    skip-slug: true
  api:
    display-name: API Reference
    icon: code
    slug: api

navigation:
  - tab: docs
    layout:
      - section: Get started
        skip-slug: true
        contents:
          - page: Introduction
            path: ./docs/pages/introduction.mdx
            slug: introduction
          - page: Quickstart
            path: ./docs/pages/getting-started/quickstart.mdx
            slug: quickstart
          - page: Administrator guide
            path: ../docs/getting-started/administrator.md
            slug: administrator-guide
          - page: User guide
            path: ../docs/getting-started/user.md
            slug: user-guide

      - section: Concepts
        slug: concepts
        contents:
          - page: Agentless discovery and signals
            path: ./docs/pages/concepts/agentless-discovery.mdx
            slug: agentless-discovery
          - page: Inventory model
            path: ./docs/pages/concepts/inventory-model.mdx
            slug: inventory-model
          - page: Findings and frameworks
            path: ./docs/pages/concepts/findings-and-frameworks.mdx
            slug: findings-and-frameworks
          - page: MCP governance
            path: ./docs/pages/concepts/mcp-governance.mdx
            slug: mcp-governance
          - page: Red team
            path: ./docs/pages/concepts/red-team.mdx
            slug: red-team
          - page: Guardrails and the hosted gateway
            path: ./docs/pages/concepts/guardrails-and-gateway.mdx
            slug: guardrails-and-gateway
          - page: Remediation and approvals
            path: ./docs/pages/concepts/remediation-and-approvals.mdx
            slug: remediation-and-approvals
          - page: Compliance
            path: ./docs/pages/concepts/compliance.mdx
            slug: compliance

      - section: Integrations
        slug: integrations
        contents:
          - page: Overview
            path: ./docs/pages/integrations/overview.mdx
            slug: overview
          - page: AWS
            path: ./docs/pages/integrations/aws.mdx
            slug: aws
          - page: Kubernetes
            path: ./docs/pages/integrations/kubernetes.mdx
            slug: kubernetes
          - page: GitHub
            path: ./docs/pages/integrations/github.mdx
            slug: github
          - page: Okta
            path: ./docs/pages/integrations/okta.mdx
            slug: okta
          - page: Microsoft and Azure
            path: ./docs/pages/integrations/microsoft.mdx
            slug: microsoft
          - page: Salesforce
            path: ./docs/pages/integrations/salesforce.mdx
            slug: salesforce
          - page: Google Cloud
            path: ./docs/pages/integrations/google-cloud.mdx
            slug: google-cloud
          - page: SaaS platforms
            path: ./docs/pages/integrations/saas-platforms.mdx
            slug: saas-platforms

      - section: Guides
        slug: guides
        contents:
          - page: Call the guardrail decision API
            path: ./docs/pages/guides/decision-api.mdx
            slug: decision-api
          - page: Route an agent through the hosted gateway
            path: ./docs/pages/guides/hosted-gateway.mdx
            slug: hosted-gateway
          - page: API tokens and SDKs
            path: ./docs/pages/guides/api-tokens-and-sdks.mdx
            slug: api-tokens-and-sdks

  - tab: api
    layout:
      - section: Overview
        skip-slug: true
        contents:
          - page: Using the API
            path: ./docs/pages/api/overview.mdx
            slug: overview
      - api: API Reference
        skip-slug: true
        paginated: true
        # A deployment has its own address, so the reference has no server to
        # send a request to. The request examples are shown; the explorer is not.
        playground:
          hidden: true
        layout:
          - section: Inventory
            contents:
