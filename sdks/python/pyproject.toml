[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zasp"
version = "0.1.0"
description = "Python client for the Zasp API, generated by Fern from openapi/openapi.yaml."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=1.9.2",
    "pydantic-core>=2.18.2",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zasp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
