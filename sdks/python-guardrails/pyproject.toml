[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zasp-guardrails"
version = "0.1.0"
description = "Check Zasp runtime policy at Python tool dispatch."
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
delegation = ["cryptography>=43"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zasp_guardrails = ["py.typed"]
