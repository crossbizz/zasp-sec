{{- if and .Values.product.enabled .Values.deploymentAdmin.enabled (not .Values.deploymentAdmin.existingSecret) }}
{{- $password := required "deploymentAdmin.enabled requires secrets.deploymentAdminPassword or deploymentAdmin.existingSecret" .Values.secrets.deploymentAdminPassword }}
{{- if not (regexMatch "^[!-~]{32,256}$" $password) }}{{ fail "secrets.deploymentAdminPassword must contain 32 to 256 printable non-space characters" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zasp.consoleSecret" . }}
  labels: {{- include "zasp.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
