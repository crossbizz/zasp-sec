{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets -}}
{{- $hint := "is required; run `./zasp --profile kubernetes secrets init` or see the comment in values.yaml" -}}
{{- if and .Values.securityAgent.planner (not $s.plannerApiKey) -}}
{{- fail "securityAgent.planner needs secrets.plannerApiKey" -}}
{{- end -}}
{{- if and $s.awsExternalId (ne (len $s.awsExternalId) 48) -}}
{{- fail "secrets.awsExternalId must be exactly 48 characters (openssl rand -hex 24)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zasp.secretName" . }}
  labels: {{- include "zasp.labels" . | nindent 4 }}
type: Opaque
data:
  stytch-project-id: {{ required (printf "secrets.stytchProjectId %s" $hint) $s.stytchProjectId | b64enc }}
  stytch-secret: {{ required (printf "secrets.stytchSecret %s" $hint) $s.stytchSecret | b64enc }}
  stytch-public-token: {{ required (printf "secrets.stytchPublicToken %s" $hint) $s.stytchPublicToken | b64enc }}
  planner-api-key: {{ $s.plannerApiKey | b64enc | quote }}
  {{- if .Values.database.external.enabled }}
  operator-dsn: {{ required "secrets.operatorDsn is required with database.external.enabled" $s.operatorDsn | b64enc }}
  service-password: {{ required "secrets.servicePassword is required with database.external.enabled" $s.servicePassword | b64enc }}
  {{- end }}
  workflow-signing-key: {{ required (printf "secrets.workflowSigningKey %s" $hint) $s.workflowSigningKey | b64enc }}
  token-reveal-key: {{ required (printf "secrets.tokenRevealKey %s" $hint) $s.tokenRevealKey | b64enc }}
  stytch-webhook-secret: {{ required (printf "secrets.stytchWebhookSecret %s" $hint) $s.stytchWebhookSecret | b64enc }}
  # Raw bytes: the values already hold base64.
  forward.seed: {{ required (printf "secrets.forwardSeedBase64 %s" $hint) $s.forwardSeedBase64 }}
  compensation.seed: {{ required (printf "secrets.compensationSeedBase64 %s" $hint) $s.compensationSeedBase64 }}
  approval-delivery.key: {{ required (printf "secrets.approvalDeliveryKeyBase64 %s" $hint) $s.approvalDeliveryKeyBase64 }}
  openfga-token: {{ required (printf "secrets.openfgaToken %s" $hint) $s.openfgaToken | b64enc }}
  neo4j-admin-password: {{ required (printf "secrets.neo4jAdminPassword %s" $hint) $s.neo4jAdminPassword | b64enc }}
  neo4j-worker-password: {{ required (printf "secrets.neo4jWorkerPassword %s" $hint) $s.neo4jWorkerPassword | b64enc }}
  neo4j-auth: {{ printf "neo4j/%s" $s.neo4jAdminPassword | b64enc }}
  aws-external-id: {{ required (printf "secrets.awsExternalId %s" $hint) $s.awsExternalId | b64enc }}
  red-team-adapter.token: {{ required (printf "secrets.redTeamAdapterToken %s" $hint) $s.redTeamAdapterToken | b64enc }}
  red-team-adapter-ca.pem: {{ required (printf "secrets.redTeamAdapterCaPem %s" $hint) $s.redTeamAdapterCaPem | b64enc }}
  gateway-signing.key: {{ required (printf "secrets.gatewaySigningKey %s" $hint) $s.gatewaySigningKey | b64enc }}
  gateway-policy-keys.json: {{ required (printf "secrets.gatewayPolicyKeysJson %s" $hint) $s.gatewayPolicyKeysJson | b64enc }}
  front-tls.crt: {{ required (printf "secrets.frontTlsCertificate %s" $hint) $s.frontTlsCertificate | b64enc }}
  front-tls.key: {{ required (printf "secrets.frontTlsKey %s" $hint) $s.frontTlsKey | b64enc }}
  neo4j-tls.crt: {{ required (printf "secrets.neo4jTlsCertificate %s" $hint) $s.neo4jTlsCertificate | b64enc }}
  neo4j-tls.key: {{ required (printf "secrets.neo4jTlsKey %s" $hint) $s.neo4jTlsKey | b64enc }}
  neo4j-tls-ca.crt: {{ required (printf "secrets.neo4jTlsCa %s" $hint) $s.neo4jTlsCa | b64enc }}
{{- end }}
