{{- if and .Values.nango.enabled (not .Values.nango.existingSecret) }}
{{- $service := required "nango.enabled requires secrets.nangoServiceKey or nango.existingSecret" .Values.secrets.nangoServiceKey }}
{{- $admin := required "nango.enabled requires secrets.nangoAdminKey or nango.existingSecret" .Values.secrets.nangoAdminKey }}
{{- $encryption := required "nango.enabled requires secrets.nangoEncryptionKey or nango.existingSecret" .Values.secrets.nangoEncryptionKey }}
{{- if or (lt (len $service) 32) (gt (len $service) 4096) (not (regexMatch "^[!-~]+$" $service)) }}{{ fail "secrets.nangoServiceKey must be 32 to 4096 printable non-space characters" }}{{ end }}
{{- if or (lt (len $admin) 32) (gt (len $admin) 4096) (not (regexMatch "^[!-~]+$" $admin)) (eq $admin $service) }}{{ fail "secrets.nangoAdminKey must be an independent 32 to 4096 character printable non-space key" }}{{ end }}
{{- if or (not (regexMatch "^[A-Za-z0-9+/]{43}=$" $encryption)) (ne ($encryption | b64dec | b64enc) $encryption) }}{{ fail "secrets.nangoEncryptionKey must be 32 bytes encoded as standard base64" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zasp.nangoSecret" . }}
  labels: {{- include "zasp.labels" . | nindent 4 }}
type: Opaque
data:
  service-key: {{ $service | b64enc | quote }}
  admin-key: {{ $admin | b64enc | quote }}
  encryption-key: {{ $encryption | b64enc | quote }}
{{- end }}
