apiVersion: v1
kind: Service
metadata:
  name: {{ include "zasp.name" . }}
  labels: {{- include "zasp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{ toJson . }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "zasp.selector" . | nindent 4 }}
  ports:
    - { name: https, port: {{ .Values.service.port }}, targetPort: https }
{{- if .Values.networkPolicy.enabled }}
---
# Everything in the pod except the TLS front is for the pod itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zasp.name" . }}
  labels: {{- include "zasp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "zasp.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8443 }
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zasp.name" . }}
  labels: {{- include "zasp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toJson . }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts: [{{ include "zasp.host" . | quote }}]
      secretName: {{ required "ingress.tlsSecretName is required when ingress.enabled is true" .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ include "zasp.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "zasp.name" . }}, port: { name: https } } }
{{- end }}
