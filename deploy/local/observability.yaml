apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      labels:
        app.kubernetes.io/part-of: zasp
        app.kubernetes.io/component: observability
        zasp.dev/environment: local
      name: otel-collector-config
      namespace: zasp-local
    data:
      config.yaml: |
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 0.0.0.0:4318
        processors:
          memory_limiter:
            check_interval: 1s
            limit_mib: 48
            spike_limit_mib: 8
          batch:
            send_batch_size: 1
            send_batch_max_size: 1
            timeout: 1s
        exporters:
          file:
            path: /sink/traces.json
            format: json
            append: false
            flush_interval: 100ms
        service:
          telemetry:
            logs:
              level: error
            metrics:
              level: none
          extensions: [health_check]
          pipelines:
            traces:
              receivers: [otlp]
              processors: [memory_limiter, batch]
              exporters: [file]
      span.json: |
        {"resourceSpans":[{"resource":{"attributes":[{"key":"service.namespace","value":{"stringValue":"agentsec"}},{"key":"service.name","value":{"stringValue":"agentsec-api"}},{"key":"service.version","value":{"stringValue":"m1-30c"}},{"key":"deployment.environment.name","value":{"stringValue":"development"}},{"key":"organization.id","value":{"stringValue":"pid_10000000-0000-4000-8000-000000000001"}},{"key":"workspace.id","value":{"stringValue":"pid_20000000-0000-4000-8000-000000000002"}},{"key":"environment.id","value":{"stringValue":"pid_30000000-0000-4000-8000-000000000003"}}]},"scopeSpans":[{"scope":{"name":"zasp.m1-30c.proof","version":"1.0.0"},"spans":[{"traceId":"10000000000040008000000000000001","spanId":"2000000000000001","name":"m1-30c-local-observability","kind":3,"startTimeUnixNano":"1786932000000000000","endTimeUnixNano":"1786932001000000000","flags":1,"status":{"code":1}}]}]}]}
      response.json: '{"partialSuccess":{}}'
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: zasp
        app.kubernetes.io/component: observability
        zasp.dev/environment: local
      name: otel-collector
      namespace: zasp-local
    spec:
      progressDeadlineSeconds: 180
      replicas: 1
      revisionHistoryLimit: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: otel-collector
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app.kubernetes.io/name: otel-collector
            app.kubernetes.io/part-of: zasp
            app.kubernetes.io/component: observability
            zasp.dev/environment: local
        spec:
          automountServiceAccountToken: false
          containers:
            - args:
                - '--config=/conf/config.yaml'
              image: otel/opentelemetry-collector-contrib:0.158.0@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
              imagePullPolicy: IfNotPresent
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: health
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
              name: otel-collector
              ports:
                - containerPort: 4318
                  name: otlp-http
                  protocol: TCP
                - containerPort: 13133
                  name: health
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: health
                  scheme: HTTP
                periodSeconds: 2
                successThreshold: 1
                timeoutSeconds: 1
              resources:
                limits:
                  cpu: 250m
                  memory: 256Mi
                requests:
                  cpu: 25m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsGroup: 10001
                runAsNonRoot: true
                runAsUser: 10001
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /
                  port: health
                  scheme: HTTP
                periodSeconds: 2
                successThreshold: 1
                timeoutSeconds: 1
              volumeMounts:
                - mountPath: /conf
                  name: config
                  readOnly: true
                - mountPath: /sink
                  name: sink
                  readOnly: false
                - mountPath: /tmp
                  name: collector-tmp
                  readOnly: false
            - command:
                - sh
                - '-ec'
                - while true; do sleep 3600; done
              image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1@sha256:a9155b13325b2abef48e71de77bb8ac015412a566829f621d06bfae5c699b1b9
              imagePullPolicy: IfNotPresent
              name: sink-reader
              resources:
                limits:
                  cpu: 25m
                  memory: 16Mi
                requests:
                  cpu: 5m
                  memory: 8Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
              volumeMounts:
                - mountPath: /sink
                  name: sink
                  readOnly: true
          dnsPolicy: ClusterFirst
          enableServiceLinks: false
          hostIPC: false
          hostNetwork: false
          hostPID: false
          restartPolicy: Always
          securityContext:
            fsGroup: 10001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 10
          volumes:
            - configMap:
                defaultMode: 292
                name: otel-collector-config
              name: config
            - emptyDir:
                sizeLimit: 64Ki
              name: sink
            - emptyDir:
                sizeLimit: 32Mi
              name: collector-tmp
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: zasp
        app.kubernetes.io/component: observability
        zasp.dev/environment: local
      name: otel-collector
      namespace: zasp-local
    spec:
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: otlp-http
          port: 4318
          protocol: TCP
          targetPort: otlp-http
      selector:
        app.kubernetes.io/name: otel-collector
      sessionAffinity: None
      type: ClusterIP
