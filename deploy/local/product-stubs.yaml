apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      labels:
        app.kubernetes.io/part-of: zasp
        zasp.dev/environment: local
      name: zasp-local
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app.kubernetes.io/name: agentsec-api
        app.kubernetes.io/part-of: zasp
        zasp.dev/environment: local
      name: agentsec-api
      namespace: zasp-local
    spec:
      progressDeadlineSeconds: 120
      replicas: 1
      revisionHistoryLimit: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: agentsec-api
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agentsec-api
            app.kubernetes.io/part-of: zasp
            zasp.dev/environment: local
        spec:
          automountServiceAccountToken: false
          containers:
            - image: zasp-local/agentsec-api:m1-30a
              imagePullPolicy: Never
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /healthz
                  port: health
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
              name: agentsec-api
              ports:
                - containerPort: 8081
                  name: health
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /readyz
                  port: health
                  scheme: HTTP
                periodSeconds: 2
                successThreshold: 1
                timeoutSeconds: 1
              resources:
                limits:
                  cpu: 100m
                  memory: 64Mi
                requests:
                  cpu: 10m
                  memory: 16Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
              startupProbe:
                failureThreshold: 30
                httpGet:
                  path: /healthz
                  port: health
                  scheme: HTTP
                periodSeconds: 1
                successThreshold: 1
                timeoutSeconds: 1
          dnsPolicy: ClusterFirst
          enableServiceLinks: false
          restartPolicy: Always
          securityContext:
            fsGroup: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 10
