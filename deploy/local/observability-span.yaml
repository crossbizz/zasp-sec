apiVersion: v1
kind: List
items:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      labels:
        app.kubernetes.io/name: otel-test-span
        app.kubernetes.io/part-of: zasp
        app.kubernetes.io/component: observability
        zasp.dev/environment: local
      name: otel-test-span
      namespace: zasp-local
    spec:
      activeDeadlineSeconds: 30
      backoffLimit: 0
      completions: 1
      parallelism: 1
      podReplacementPolicy: Failed
      template:
        metadata:
          labels:
            app.kubernetes.io/name: otel-test-span
            app.kubernetes.io/part-of: zasp
            app.kubernetes.io/component: observability
            zasp.dev/environment: local
        spec:
          automountServiceAccountToken: false
          containers:
            - command:
                - sh
                - '-ec'
                - 'body=$(wget -q -t 1 -T 5 --header=''Content-Type: application/json'' --post-file=/fixture/span.json -O - http://otel-collector.zasp-local.svc.cluster.local:4318/v1/traces); [ "$body" = "$(cat /fixture/response.json)" ]; printf ''otel-test-span-sent\n'''
              image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1@sha256:a9155b13325b2abef48e71de77bb8ac015412a566829f621d06bfae5c699b1b9
              imagePullPolicy: IfNotPresent
              name: span-generator
              resources:
                limits:
                  cpu: 50m
                  memory: 32Mi
                requests:
                  cpu: 5m
                  memory: 8Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
              volumeMounts:
                - mountPath: /fixture
                  name: fixture
                  readOnly: true
                - mountPath: /tmp
                  name: job-tmp
                  readOnly: false
          dnsPolicy: ClusterFirst
          enableServiceLinks: false
          hostIPC: false
          hostNetwork: false
          hostPID: false
          restartPolicy: Never
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 5
          volumes:
            - configMap:
                defaultMode: 292
                items:
                  - key: span.json
                    path: span.json
                  - key: response.json
                    path: response.json
                name: otel-collector-config
              name: fixture
            - emptyDir:
                sizeLimit: 8Mi
              name: job-tmp
