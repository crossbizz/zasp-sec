apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      labels:
        app.kubernetes.io/part-of: zasp
        app.kubernetes.io/component: graph
        zasp.dev/environment: local
      name: zasp-local-neo4j
    spec:
      accessModes:
        - ReadWriteOnce
      capacity:
        storage: 1Gi
      claimRef:
        apiVersion: v1
        kind: PersistentVolumeClaim
        name: neo4j-data
        namespace: zasp-local
      hostPath:
        path: /var/lib/zasp/m1-30b/neo4j-data
        type: Directory
      nodeAffinity:
        required:
          nodeSelectorTerms:
            - matchExpressions:
                - key: zasp.dev/graph-node
                  operator: In
                  values:
                    - m1-30b
      persistentVolumeReclaimPolicy: Retain
      storageClassName: zasp-local-neo4j
      volumeMode: Filesystem
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      labels:
        app.kubernetes.io/part-of: zasp
        app.kubernetes.io/component: graph
        zasp.dev/environment: local
      name: neo4j-data
      namespace: zasp-local
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: zasp-local-neo4j
      volumeMode: Filesystem
      volumeName: zasp-local-neo4j
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/part-of: zasp
        app.kubernetes.io/component: graph
        zasp.dev/environment: local
      name: neo4j
      namespace: zasp-local
    spec:
      progressDeadlineSeconds: 180
      replicas: 1
      revisionHistoryLimit: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: neo4j
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app.kubernetes.io/name: neo4j
            app.kubernetes.io/part-of: zasp
            app.kubernetes.io/component: graph
            zasp.dev/environment: local
        spec:
          automountServiceAccountToken: false
          containers:
            - env:
                - name: NEO4J_AUTH
                  value: none
                - name: NEO4J_db_tx__log_preallocate
                  value: 'false'
                - name: NEO4J_db_tx__log_rotation_size
                  value: 128K
              image: neo4j:5.26.28-community@sha256:ff32db30b2baff97971e441b46bfd9c832c1b62c970398ef579244c06b21d357
              imagePullPolicy: IfNotPresent
              livenessProbe:
                failureThreshold: 3
                periodSeconds: 10
                successThreshold: 1
                tcpSocket:
                  port: http
                timeoutSeconds: 1
              name: neo4j
              ports:
                - containerPort: 7474
                  name: http
                  protocol: TCP
                - containerPort: 7687
                  name: bolt
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                periodSeconds: 2
                successThreshold: 1
                tcpSocket:
                  port: http
                timeoutSeconds: 1
              resources:
                limits:
                  cpu: '2'
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: false
                runAsGroup: 7474
                runAsNonRoot: true
                runAsUser: 7474
              startupProbe:
                failureThreshold: 60
                periodSeconds: 2
                successThreshold: 1
                tcpSocket:
                  port: http
                timeoutSeconds: 1
              volumeMounts:
                - mountPath: /data
                  name: data
                  readOnly: false
                - mountPath: /logs
                  name: logs
                  readOnly: false
          dnsPolicy: ClusterFirst
          enableServiceLinks: false
          restartPolicy: Always
          securityContext:
            fsGroup: 7474
            runAsGroup: 7474
            runAsNonRoot: true
            runAsUser: 7474
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 30
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: neo4j-data
                readOnly: false
            - emptyDir:
                sizeLimit: 256Mi
              name: logs
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/part-of: zasp
        app.kubernetes.io/component: graph
        zasp.dev/environment: local
      name: neo4j
      namespace: zasp-local
    spec:
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: http
          port: 7474
          protocol: TCP
          targetPort: http
        - name: bolt
          port: 7687
          protocol: TCP
          targetPort: bolt
      selector:
        app.kubernetes.io/name: neo4j
      sessionAffinity: None
      type: ClusterIP
  - apiVersion: batch/v1
    kind: Job
    metadata:
      labels:
        app.kubernetes.io/name: neo4j-health
        app.kubernetes.io/part-of: zasp
        app.kubernetes.io/component: graph
        zasp.dev/environment: local
      name: neo4j-health
      namespace: zasp-local
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: neo4j-health
            app.kubernetes.io/part-of: zasp
            app.kubernetes.io/component: graph
            zasp.dev/environment: local
        spec:
          automountServiceAccountToken: false
          containers:
            - command:
                - sh
                - '-ec'
                - attempt=0; until wget -q -T 1 -O /dev/null http://neo4j.zasp-local.svc.cluster.local:7474/; do attempt=$((attempt + 1)); [ "$attempt" -ge 90 ] && exit 1; sleep 2; done; printf 'neo4j-health-ready\n'
              image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1@sha256:a9155b13325b2abef48e71de77bb8ac015412a566829f621d06bfae5c699b1b9
              imagePullPolicy: IfNotPresent
              name: health
              resources:
                limits:
                  cpu: 50m
                  memory: 32Mi
                requests:
                  cpu: 5m
                  memory: 8Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
          dnsPolicy: ClusterFirst
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 5
