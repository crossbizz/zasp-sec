{{- if and (ne .Values.profile "customer_edge") .Values.optionalEgress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-optional-openrouter-egress
  labels: { app.kubernetes.io/part-of: zasp }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: agentsec-api } }
  policyTypes: [Egress]
  egress:
    {{- range .Values.network.securityAgentPlannerEgressCIDRs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 443 }]
    {{- end }}
{{- end }}
