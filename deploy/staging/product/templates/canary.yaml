{{- if and (ne .Values.profile "customer_edge") .Values.canary.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: production-readonly-canary
  labels: { app.kubernetes.io/name: production-readonly-canary, app.kubernetes.io/part-of: zasp }
spec:
  schedule: {{ .Values.canary.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      ttlSecondsAfterFinished: 600
      template:
        metadata: { labels: { app.kubernetes.io/name: production-readonly-canary, app.kubernetes.io/part-of: zasp } }
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Values.serviceAccounts.canary }}
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: synthetic
              image: {{ required "global.productImages.web must be an immutable digest" .Values.global.productImages.web | quote }}
              imagePullPolicy: IfNotPresent
              command: ["node", "-e"]
              args:
                - |
                  const origin=process.env.ZASP_PUBLIC_ORIGIN,token=process.env.ZASP_CANARY_READ_TOKEN;
                  const required=['strict-transport-security','content-security-policy','x-frame-options','x-content-type-options','referrer-policy','permissions-policy'];
                  const start=Date.now();
                  const web=await fetch(origin+'/sign-in',{redirect:'manual',signal:AbortSignal.timeout(5000)});
                  if(web.status!==200||required.some(name=>!web.headers.has(name)))process.exit(1);
                  const api=await fetch(origin+'/api/v1/home/summary',{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(5000)});
                  if(api.status!==200||!api.headers.has('x-correlation-id')||!api.headers.has('traceparent'))process.exit(1);
                  console.log(JSON.stringify({event:'readonly_canary',ok:true,duration_ms:Date.now()-start,correlation_id:api.headers.get('x-correlation-id')}));
              env:
                - { name: ZASP_PUBLIC_ORIGIN, value: {{ .Values.global.publicOrigin | quote }} }
                - name: ZASP_CANARY_READ_TOKEN
                  valueFrom: { secretKeyRef: { name: zasp-canary-secrets, key: ZASP_CANARY_READ_TOKEN } }
              resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
{{- end }}
