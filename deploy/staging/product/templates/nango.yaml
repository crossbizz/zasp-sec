{{- if ne .Values.profile "customer_edge" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nango
  labels: { app.kubernetes.io/name: nango, app.kubernetes.io/part-of: zasp }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nango-migrate
  labels: { app.kubernetes.io/name: nango-migrate, app.kubernetes.io/part-of: zasp }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-22"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nango-migrate
  labels: { app.kubernetes.io/name: nango-migrate, app.kubernetes.io/part-of: zasp }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata: { labels: { app.kubernetes.io/name: nango-migrate, app.kubernetes.io/part-of: zasp } }
    spec:
      restartPolicy: Never
      serviceAccountName: nango-migrate
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ required "global.images.nango must be an immutable digest" .Values.global.images.nango | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              node --input-type=module --eval 'const values = [process.env.NANGO_DATABASE_URL, process.env.RECORDS_DATABASE_URL]; let url; try { url = new URL(values[0]); } catch {} const keys = url ? [...url.searchParams.keys()] : []; if (!url || values.some((value) => value !== values[0]) || !["postgres:", "postgresql:"].includes(url.protocol) || !url.username || !url.password || !url.hostname || url.port !== "5432" || url.pathname.length < 2 || url.hash || keys.length !== 1 || keys[0] !== "sslmode" || url.searchParams.get("sslmode") !== "verify-full") process.exit(64);'
              exec node packages/server/dist/migrate.js
          env:
            - { name: NANGO_CLOUD, value: "false" }
            - name: NANGO_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ required "nango.storageSecretName is required" .Values.nango.storageSecretName | quote }}, key: database-url } }
            - { name: NANGO_DB_APPLICATION_NAME, value: "zasp-production-nango-migrate" }
            - { name: NANGO_DB_POOL_MAX, value: "4" }
            - { name: NANGO_DB_POOL_MIN, value: "0" }
            - { name: NANGO_DB_SCHEMA, value: "nango" }
            - { name: NANGO_DB_SSL, value: "true" }
            - name: NANGO_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ required "nango.storageSecretName is required" .Values.nango.storageSecretName | quote }}, key: encryption-key } }
            - { name: NANGO_ENTERPRISE, value: "false" }
            - { name: NANGO_LOGS_ENABLED, value: "false" }
            - { name: NANGO_TELEMETRY_SDK, value: "false" }
            - { name: RECORDS_DATABASE_POOL_MAX, value: "4" }
            - { name: RECORDS_DATABASE_POOL_MIN, value: "0" }
            - { name: RECORDS_DATABASE_SCHEMA, value: "nango_records" }
            - { name: RECORDS_DATABASE_SSL, value: "true" }
            - name: RECORDS_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ required "nango.storageSecretName is required" .Values.nango.storageSecretName | quote }}, key: database-url } }
          resources: { requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi }, limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nango
  labels: { app.kubernetes.io/name: nango, app.kubernetes.io/part-of: zasp }
spec:
  replicas: {{ .Values.nango.replicas }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app.kubernetes.io/name: nango } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nango, app.kubernetes.io/part-of: zasp }
    spec:
      serviceAccountName: nango
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.global.terminationGracePeriodSeconds }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app.kubernetes.io/name: nango } } }
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/name: nango } } }
      containers:
        - name: nango
          image: {{ required "global.images.nango must be an immutable digest" .Values.global.images.nango | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              node --input-type=module --eval 'const values = [process.env.NANGO_DATABASE_URL, process.env.RECORDS_DATABASE_URL]; let url; try { url = new URL(values[0]); } catch {} const keys = url ? [...url.searchParams.keys()] : []; if (!url || values.some((value) => value !== values[0]) || !["postgres:", "postgresql:"].includes(url.protocol) || !url.username || !url.password || !url.hostname || url.port !== "5432" || url.pathname.length < 2 || url.hash || keys.length !== 1 || keys[0] !== "sslmode" || url.searchParams.get("sslmode") !== "verify-full") process.exit(64);'
              exec node packages/server/dist/server.js
          ports: [{ name: http, containerPort: 3003, protocol: TCP }]
          env:
            - { name: CSP_REPORT_ONLY, value: "true" }
            - { name: FLAG_AUTH_ROLES_ENABLED, value: "false" }
            - { name: FLAG_SERVE_CONNECT_UI, value: "false" }
            - { name: NANGO_CLOUD, value: "false" }
            - name: NANGO_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ required "nango.storageSecretName is required" .Values.nango.storageSecretName | quote }}, key: database-url } }
            - { name: NANGO_DB_APPLICATION_NAME, value: "zasp-production-nango" }
            - { name: NANGO_DB_POOL_MAX, value: "20" }
            - { name: NANGO_DB_POOL_MIN, value: "0" }
            - { name: NANGO_DB_SCHEMA, value: "nango" }
            - { name: NANGO_DB_SSL, value: "true" }
            - name: NANGO_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ required "nango.storageSecretName is required" .Values.nango.storageSecretName | quote }}, key: encryption-key } }
            - { name: NANGO_ENTERPRISE, value: "false" }
            - { name: NANGO_LOGS_ENABLED, value: "false" }
            - { name: NANGO_MIGRATE_AT_START, value: "false" }
            - { name: NANGO_SERVER_URL, value: "http://nango.{{ .Release.Namespace }}.svc.cluster.local:3003" }
            - { name: NANGO_PUBLIC_SERVER_URL, value: "http://nango.{{ .Release.Namespace }}.svc.cluster.local:3003" }
            - { name: NANGO_TELEMETRY_SDK, value: "false" }
            - { name: RECORDS_DATABASE_POOL_MAX, value: "20" }
            - { name: RECORDS_DATABASE_POOL_MIN, value: "0" }
            - { name: RECORDS_DATABASE_SCHEMA, value: "nango_records" }
            - { name: RECORDS_DATABASE_SSL, value: "true" }
            - name: RECORDS_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ required "nango.storageSecretName is required" .Values.nango.storageSecretName | quote }}, key: database-url } }
            - { name: SERVER_PORT, value: "3003" }
          startupProbe: { httpGet: { path: /ready, port: http, scheme: HTTP }, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 1 }
          readinessProbe: { httpGet: { path: /ready, port: http, scheme: HTTP }, failureThreshold: 3, periodSeconds: 5, timeoutSeconds: 2 }
          livenessProbe: { httpGet: { path: /health, port: http, scheme: HTTP }, failureThreshold: 3, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 10"] } } }
          resources: { requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi }, limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: nango
  labels: { app.kubernetes.io/name: nango, app.kubernetes.io/part-of: zasp }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: nango }
  ports: [{ name: http, port: 3003, targetPort: http, protocol: TCP }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nango
  labels: { app.kubernetes.io/name: nango, app.kubernetes.io/part-of: zasp }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: nango } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nango-private
  labels: { app.kubernetes.io/name: nango, app.kubernetes.io/part-of: zasp }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: nango } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: agentsec-api } } }]
      ports: [{ protocol: TCP, port: 3003 }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
      {{- range $cidr := required "nango.databaseEgressCIDRs is required" .Values.nango.databaseEgressCIDRs }}
        - ipBlock: { cidr: {{ $cidr | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
      {{- range $cidr := required "nango.providerEgressCIDRs is required" .Values.nango.providerEgressCIDRs }}
        - ipBlock: { cidr: {{ $cidr | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nango-migrate-private
  labels: { app.kubernetes.io/name: nango-migrate, app.kubernetes.io/part-of: zasp }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-21"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: nango-migrate } }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
      {{- range $cidr := required "nango.databaseEgressCIDRs is required" .Values.nango.databaseEgressCIDRs }}
        - ipBlock: { cidr: {{ $cidr | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 5432 }]
{{- end }}
