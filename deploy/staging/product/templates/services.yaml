{{- if ne .Values.profile "customer_edge" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.web }}
  labels: { app.kubernetes.io/part-of: zasp }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.worker.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.worker.roleArn is required" .Values.serviceAccounts.worker.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.scheduler.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.scheduler.roleArn is required" .Values.serviceAccounts.scheduler.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.securityAgent.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.securityAgent.roleArn is required" .Values.serviceAccounts.securityAgent.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.securityAgentAction.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.securityAgentAction.roleArn is required" .Values.serviceAccounts.securityAgentAction.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.projectionSearch.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.projectionSearch.roleArn is required" .Values.serviceAccounts.projectionSearch.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.projectionRisk.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.projectionRisk.roleArn is required" .Values.serviceAccounts.projectionRisk.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.projectionGraph.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.projectionGraph.roleArn is required" .Values.serviceAccounts.projectionGraph.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.outbox.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.outbox.roleArn is required" .Values.serviceAccounts.outbox.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.api.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.api.roleArn is required" .Values.serviceAccounts.api.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.canary }}
  labels: { app.kubernetes.io/part-of: zasp }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: web, labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: zasp } }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: product, port: 3000, targetPort: product, protocol: TCP }]
---
apiVersion: v1
kind: Service
metadata:
  name: agentsec-api
  labels: { app.kubernetes.io/name: agentsec-api, app.kubernetes.io/part-of: zasp }
  annotations: { prometheus.io/scrape: "true", prometheus.io/path: "/metrics", prometheus.io/port: "8081" }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: agentsec-api }
  ports:
    - { name: product, port: 8080, targetPort: product, protocol: TCP }
    - { name: internal, port: 8081, targetPort: internal, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: agentsec-discovery-worker
  labels: { app.kubernetes.io/name: agentsec-discovery-worker, app.kubernetes.io/part-of: zasp }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: agentsec-discovery-worker }
  ports: [{ name: internal, port: 8081, targetPort: internal, protocol: TCP }]
{{- range $name := list "agentsec-discovery-scheduler" "agentsec-security-agent" "agentsec-security-agent-action" "agentsec-outbox-publisher" "agentsec-projection-risk" "agentsec-projection-graph" "agentsec-projection-search" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports: [{ name: internal, port: 8081, targetPort: internal, protocol: TCP }]
{{- end }}
{{- if .Values.recovery.canaryEnabled }}
{{- range $identity := list
  (dict "key" "recoveryBackupOutbox" "role" .Values.serviceAccounts.recoveryBackupOutbox.roleArn)
  (dict "key" "recoveryRestoreOutbox" "role" .Values.serviceAccounts.recoveryRestoreOutbox.roleArn)
  (dict "key" "recoveryBackup" "role" .Values.serviceAccounts.recoveryBackup.roleArn)
  (dict "key" "recoveryRestore" "role" .Values.serviceAccounts.recoveryRestore.roleArn)
}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ index $.Values.serviceAccounts .key "name" }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required (printf "serviceAccounts.%s.roleArn is required" .key) .role | quote }}
automountServiceAccountToken: false
{{- end }}
{{- range $name := list "agentsec-recovery-backup-outbox" "agentsec-recovery-restore-outbox" "agentsec-recovery-backup" "agentsec-recovery-restore" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports: [{ name: internal, port: 8081, targetPort: internal, protocol: TCP }]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: agentsec-recovery-namespace-operator, labels: { app.kubernetes.io/part-of: zasp } }
rules:
  - { apiGroups: [""], resources: [serviceaccounts], verbs: [create, get] }
  - { apiGroups: [batch], resources: [jobs], verbs: [create, get] }
  - { apiGroups: [""], resources: [pods], verbs: [list] }
  - { apiGroups: [""], resources: [secrets], verbs: [create, get] }
  - { apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [create, get] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: agentsec-recovery-controller, labels: { app.kubernetes.io/part-of: zasp } }
rules:
  - { apiGroups: [""], resources: [namespaces], verbs: [create, get, delete] }
  - { apiGroups: [rbac.authorization.k8s.io], resources: [rolebindings], verbs: [create, get] }
  - { apiGroups: [rbac.authorization.k8s.io], resources: [clusterroles], resourceNames: [agentsec-recovery-namespace-operator], verbs: [bind] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: agentsec-recovery-controller, labels: { app.kubernetes.io/part-of: zasp } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agentsec-recovery-controller }
subjects:
  - { kind: ServiceAccount, name: {{ .Values.serviceAccounts.recoveryRestore.name }}, namespace: {{ .Release.Namespace | quote }} }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: agentsec-recovery-namespace-fence, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, DELETE]
        resources: [namespaces]
        scope: Cluster
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [rolebindings]
        scope: Namespaced
  matchConditions:
    - name: exact-recovery-controller
      expression: request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:{{ .Values.serviceAccounts.recoveryRestore.name }}'
  validations:
    - expression: >-
        request.resource.resource != 'namespaces' ||
        ((request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name).matches('^zasp-recovery-[a-f0-9]{32}$') &&
        (request.operation == 'DELETE' ? oldObject.metadata.labels['app.kubernetes.io/managed-by'] : object.metadata.labels['app.kubernetes.io/managed-by']) == 'agentsec-recovery' &&
        (request.operation == 'DELETE' ? oldObject.metadata.labels['zasp.io/recovery-id'] : object.metadata.labels['zasp.io/recovery-id']).matches('^pid_[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') &&
        (request.operation == 'DELETE' ? oldObject.metadata.labels['zasp.io/recovery-scope'] : object.metadata.labels['zasp.io/recovery-scope']).matches('^[a-f0-9]{16}$'))
      message: recovery namespace authority rejected
    - expression: >-
        request.resource.resource != 'rolebindings' ||
        (request.namespace.matches('^zasp-recovery-[a-f0-9]{32}$') &&
        object.metadata.name == 'agentsec-recovery-controller' &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'agentsec-recovery' &&
        object.metadata.labels['zasp.io/recovery-id'].matches('^pid_[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') &&
        object.metadata.labels['zasp.io/recovery-scope'].matches('^[a-f0-9]{16}$') &&
        object.roleRef.apiGroup == 'rbac.authorization.k8s.io' && object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'agentsec-recovery-namespace-operator' &&
        object.subjects.size() == 1 && object.subjects[0].apiGroup == 'rbac.authorization.k8s.io' && object.subjects[0].kind == 'User' && object.subjects[0].name == 'system:serviceaccount:{{ .Release.Namespace }}:{{ .Values.serviceAccounts.recoveryRestore.name }}')
      message: recovery namespace binding rejected
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: agentsec-recovery-namespace-fence, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  policyName: agentsec-recovery-namespace-fence
  validationActions: [Deny]
{{- end }}
{{- end }}
