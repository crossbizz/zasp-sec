{{- if ne .Values.profile "customer_edge" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels: { app.kubernetes.io/part-of: zasp }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: web, labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: zasp } }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: product, port: 3000, targetPort: product, protocol: TCP }]
---
apiVersion: v1
kind: Service
metadata: { name: agentsec-api, labels: { app.kubernetes.io/name: agentsec-api, app.kubernetes.io/part-of: zasp } }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: agentsec-api }
  ports:
    - { name: product, port: 8080, targetPort: product, protocol: TCP }
    - { name: internal, port: 8081, targetPort: internal, protocol: TCP }
{{- range $name := list "agentsec-worker" "event-ingest" "runtime-gateway" }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }}, labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp } }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports: [{ name: internal, port: 8081, targetPort: product, protocol: TCP }]
{{- end }}
{{- end }}
