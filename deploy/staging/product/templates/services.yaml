{{- if ne .Values.profile "customer_edge" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.web }}
  labels: { app.kubernetes.io/part-of: zasp }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.worker.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.worker.roleArn is required" .Values.serviceAccounts.worker.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.scheduler.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.scheduler.roleArn is required" .Values.serviceAccounts.scheduler.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.api.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.api.roleArn is required" .Values.serviceAccounts.api.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.canary }}
  labels: { app.kubernetes.io/part-of: zasp }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: { name: web, labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: zasp } }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: product, port: 3000, targetPort: product, protocol: TCP }]
---
apiVersion: v1
kind: Service
metadata:
  name: agentsec-api
  labels: { app.kubernetes.io/name: agentsec-api, app.kubernetes.io/part-of: zasp }
  annotations: { prometheus.io/scrape: "true", prometheus.io/path: "/metrics", prometheus.io/port: "8081" }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: agentsec-api }
  ports:
    - { name: product, port: 8080, targetPort: product, protocol: TCP }
    - { name: internal, port: 8081, targetPort: internal, protocol: TCP }
{{- end }}
