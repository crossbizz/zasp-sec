{{- if eq .Values.profile "customer_edge" }}
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: runtime-gateway, labels: { app.kubernetes.io/name: runtime-gateway, app.kubernetes.io/part-of: zasp } }
automountServiceAccountToken: false
{{- if .Values.sensorAgent.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: sensor-agent, labels: { app.kubernetes.io/name: sensor-agent, app.kubernetes.io/part-of: zasp } }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sensor-agent, labels: { app.kubernetes.io/name: sensor-agent, app.kubernetes.io/part-of: zasp } }
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, create, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sensor-agent, labels: { app.kubernetes.io/name: sensor-agent, app.kubernetes.io/part-of: zasp } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sensor-agent }
subjects: [{ kind: ServiceAccount, name: sensor-agent, namespace: {{ .Release.Namespace | quote }} }]
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: runtime-gateway-cache, labels: { app.kubernetes.io/name: runtime-gateway, app.kubernetes.io/part-of: zasp } }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ required "runtimeGateway.policyCache.storageClassName is required" .Values.runtimeGateway.policyCache.storageClassName | quote }}
  resources: { requests: { storage: 32Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: runtime-gateway, labels: { app.kubernetes.io/name: runtime-gateway, app.kubernetes.io/part-of: zasp } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: runtime-gateway } }
  template:
    metadata: { labels: { app.kubernetes.io/name: runtime-gateway, app.kubernetes.io/part-of: zasp } }
    spec:
      serviceAccountName: runtime-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: materialize-config
          image: {{ required "global.productImages.runtimeGateway must be an immutable digest" .Values.global.productImages.runtimeGateway | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - cp /source/credential/credential.json /config/credential.json; cp /source/policy/policy-keys.json /config/policy-keys.json; chmod 600 /config/credential.json /config/policy-keys.json
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 32Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
          volumeMounts:
            - { name: credential-source, mountPath: /source/credential, readOnly: true }
            - { name: policy-keys-source, mountPath: /source/policy, readOnly: true }
            - { name: config, mountPath: /config }
      containers:
        - name: runtime-gateway
          image: {{ required "global.productImages.runtimeGateway must be an immutable digest" .Values.global.productImages.runtimeGateway | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: product, containerPort: 8080, protocol: TCP }, { name: internal, containerPort: 8081, protocol: TCP }]
          startupProbe: { httpGet: { path: /healthz, port: 8081 }, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 1 }
          readinessProbe: { httpGet: { path: /readyz, port: 8081 }, failureThreshold: 3, periodSeconds: 5, timeoutSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: 8081 }, failureThreshold: 3, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 10"] } } }
          resources: { requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 32Mi }, limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
          env:
            - { name: ZASP_GATEWAY_CONTROL_BASE_URL, value: {{ required "runtimeGateway.controlPlaneURL is required" .Values.runtimeGateway.controlPlaneURL | quote }} }
            - { name: ZASP_GATEWAY_ORGANIZATION_ID, value: {{ required "runtimeGateway.organizationID is required" .Values.runtimeGateway.organizationID | quote }} }
            - { name: ZASP_GATEWAY_WORKSPACE_ID, value: {{ required "runtimeGateway.workspaceID is required" .Values.runtimeGateway.workspaceID | quote }} }
            - { name: ZASP_GATEWAY_ENVIRONMENT_ID, value: {{ required "runtimeGateway.environmentID is required" .Values.runtimeGateway.environmentID | quote }} }
            - { name: ZASP_GATEWAY_DEVICE_ID, value: {{ required "runtimeGateway.deviceID is required" .Values.runtimeGateway.deviceID | quote }} }
            - { name: ZASP_GATEWAY_CREDENTIAL_ID, value: {{ required "runtimeGateway.credentialID is required" .Values.runtimeGateway.credentialID | quote }} }
            - { name: ZASP_GATEWAY_PRIVATE_KEY_FILE, value: /var/run/secrets/zasp-config/credential.json }
            - { name: ZASP_GATEWAY_POLICY_KEYS_FILE, value: /var/run/secrets/zasp-config/policy-keys.json }
            - { name: ZASP_GATEWAY_POLICY_CACHE_FILE, value: /var/lib/zasp/policy/cache.json }
            - { name: ZASP_GATEWAY_EVIDENCE_STORE_DIRECTORY, value: /var/lib/zasp/policy/evidence }
            - { name: ZASP_GATEWAY_EVIDENCE_MAX_BYTES, value: "8589934592" }
            - { name: ZASP_GATEWAY_BOOTSTRAP_FAILURE_MODE, value: closed }
            - { name: ZASP_GATEWAY_MAX_REQUEST_BYTES, value: "65536" }
            - { name: ZASP_GATEWAY_MAX_PENDING_EVENTS, value: "1024" }
            - { name: ZASP_GATEWAY_OPERATION_TIMEOUT, value: "10s" }
            - { name: ZASP_GATEWAY_SYNC_INTERVAL, value: "30s" }
            - { name: ZASP_GATEWAY_SHUTDOWN_TIMEOUT, value: "15s" }
          volumeMounts:
            - { name: config, mountPath: /var/run/secrets/zasp-config, readOnly: true }
            - { name: policy-cache, mountPath: /var/lib/zasp/policy }
      volumes:
        - name: credential-source
          secret: { secretName: {{ required "runtimeGateway.credentialSecretName is required" .Values.runtimeGateway.credentialSecretName | quote }}, defaultMode: 288 }
        - name: policy-keys-source
          secret: { secretName: {{ required "runtimeGateway.policyKeysSecretName is required" .Values.runtimeGateway.policyKeysSecretName | quote }}, defaultMode: 288 }
        - name: config
          emptyDir: { sizeLimit: 1Mi }
        - name: policy-cache
          persistentVolumeClaim: { claimName: runtime-gateway-cache }
{{- if .Values.sensorAgent.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: sensor-agent, labels: { app.kubernetes.io/name: sensor-agent, app.kubernetes.io/part-of: zasp } }
spec:
  revisionHistoryLimit: 3
  updateStrategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: sensor-agent } }
  template:
    metadata: { labels: { app.kubernetes.io/name: sensor-agent, app.kubernetes.io/part-of: zasp } }
    spec:
      serviceAccountName: sensor-agent
      automountServiceAccountToken: true
      enableServiceLinks: false
      hostNetwork: false
      terminationGracePeriodSeconds: 30
      tolerations: [{ operator: Exists }]
      securityContext: { fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: materialize-sensor-authority
          image: {{ required "global.productImages.sensorAgent must be an immutable digest" .Values.global.productImages.sensorAgent | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - cp /source/token /config/token; chown 65532:65532 /config/token /state; chmod 0600 /config/token; chmod 0700 /state
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 32Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER] }
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - { name: token-source, mountPath: /source, readOnly: true }
            - { name: token, mountPath: /config }
            - { name: state, mountPath: /state }
      containers:
        - name: sensor-agent
          image: {{ required "global.productImages.sensorAgent must be an immutable digest" .Values.global.productImages.sensorAgent | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: internal, containerPort: 8081, protocol: TCP }]
          startupProbe: { httpGet: { path: /healthz, port: internal }, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 1 }
          readinessProbe: { httpGet: { path: /readyz, port: internal }, failureThreshold: 3, periodSeconds: 5, timeoutSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: internal }, failureThreshold: 3, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 10"] } } }
          resources: { requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 16Mi }, limits: { cpu: 500m, memory: 256Mi, ephemeral-storage: 64Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
          env:
            - { name: ZASP_SENSOR_CONTROL_PLANE_URL, value: {{ required "runtimeGateway.controlPlaneURL is required" .Values.runtimeGateway.controlPlaneURL | quote }} }
            - { name: ZASP_SENSOR_TOKEN_FILE, value: /var/run/secrets/zasp-sensor/token }
            - { name: ZASP_TETRAGON_LOG_FILE, value: /var/run/cilium/tetragon/tetragon.log }
            - { name: ZASP_SENSOR_CURSOR_FILE, value: /var/lib/zasp-sensor/cursor.json }
            - name: ZASP_SENSOR_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: ZASP_SENSOR_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: ZASP_SENSOR_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: HOST_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - { name: ZASP_SENSOR_KERNEL_FILE, value: /host/proc/sys/kernel/osrelease }
            - { name: ZASP_SENSOR_BTF_FILE, value: /host/sys/kernel/btf/vmlinux }
            - { name: ZASP_TETRAGON_METRICS_URL, value: "http://$(HOST_IP):2112/metrics" }
            - { name: ZASP_SENSOR_BATCH_SIZE, value: "100" }
            - { name: ZASP_SENSOR_MAX_PROCESSES, value: "10000" }
            - { name: ZASP_SENSOR_POLL_INTERVAL, value: "1s" }
            - { name: ZASP_SENSOR_OPERATION_TIMEOUT, value: "10s" }
            - { name: ZASP_SENSOR_SHUTDOWN_TIMEOUT, value: "15s" }
            - { name: ZASP_SENSOR_LEASE_DURATION, value: "15s" }
            - { name: ZASP_SENSOR_REPORT_TTL, value: "30s" }
          volumeMounts:
            - { name: token, mountPath: /var/run/secrets/zasp-sensor, readOnly: true }
            - { name: state, mountPath: /var/lib/zasp-sensor }
            - { name: tetragon-log, mountPath: /var/run/cilium/tetragon, readOnly: true }
            - { name: kernel-proc, mountPath: /host/proc/sys/kernel, readOnly: true }
            - { name: kernel-sys, mountPath: /host/sys/kernel, readOnly: true }
      volumes:
        - name: token-source
          secret: { secretName: {{ required "sensorAgent.tokenSecretName is required" .Values.sensorAgent.tokenSecretName | quote }}, defaultMode: 288 }
        - name: token
          emptyDir: { sizeLimit: 1Mi }
        - name: state
          hostPath: { path: {{ required "sensorAgent.stateHostPath is required" .Values.sensorAgent.stateHostPath | quote }}, type: DirectoryOrCreate }
        - name: tetragon-log
          hostPath: { path: /var/run/cilium/tetragon, type: DirectoryOrCreate }
        - name: kernel-proc
          hostPath: { path: /proc/sys/kernel, type: Directory }
        - name: kernel-sys
          hostPath: { path: /sys/kernel, type: Directory }
{{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: runtime-gateway, labels: { app.kubernetes.io/name: runtime-gateway, app.kubernetes.io/part-of: zasp } }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: runtime-gateway }
  ports: [{ name: product, port: 8080, targetPort: product, protocol: TCP }, { name: internal, port: 8081, targetPort: internal, protocol: TCP }]
{{- if .Values.sensorAgent.enabled }}
---
apiVersion: v1
kind: Service
metadata: { name: sensor-agent, labels: { app.kubernetes.io/name: sensor-agent, app.kubernetes.io/part-of: zasp } }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: sensor-agent }
  ports: [{ name: internal, port: 8081, targetPort: internal, protocol: TCP }]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, labels: { app.kubernetes.io/part-of: zasp } }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: dns-egress, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [runtime-gateway, sensor-agent] }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-gateway-control-plane, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: runtime-gateway } }
  policyTypes: [Egress]
  egress:
    - to:
      {{- range $cidr := required "network.controlPlaneCIDRs is required" .Values.network.controlPlaneCIDRs }}
        - ipBlock: { cidr: {{ $cidr | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 443 }]
{{- if .Values.sensorAgent.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sensor-agent-control-plane, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: sensor-agent } }
  policyTypes: [Egress]
  egress:
    - to:
      {{- range $cidr := required "network.controlPlaneCIDRs is required" .Values.network.controlPlaneCIDRs }}
        - ipBlock: { cidr: {{ $cidr | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sensor-agent-kubernetes-api, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: sensor-agent } }
  policyTypes: [Egress]
  egress:
    - to:
      {{- range $cidr := required "network.kubernetesAPICIDRs is required" .Values.network.kubernetesAPICIDRs }}
        - ipBlock: { cidr: {{ $cidr | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sensor-agent-node-metrics, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: sensor-agent } }
  policyTypes: [Egress]
  egress:
    - to:
      {{- range $cidr := required "network.nodeCIDRs is required" .Values.network.nodeCIDRs }}
        - ipBlock: { cidr: {{ $cidr | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 2112 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: tetragon-kubernetes-api, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: tetragon } }
  policyTypes: [Egress]
  egress:
    - to:
      {{- range $cidr := required "network.kubernetesAPICIDRs is required" .Values.network.kubernetesAPICIDRs }}
        - ipBlock: { cidr: {{ $cidr | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: tetragon-node-metrics, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: tetragon } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: sensor-agent } } }]
      ports: [{ protocol: TCP, port: 2112 }]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-gateway-monitoring, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: runtime-gateway } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }} } } }]
      ports: [{ protocol: TCP, port: 8081 }]
{{- if .Values.sensorAgent.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sensor-agent-monitoring, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: sensor-agent } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }} } } }]
      ports: [{ protocol: TCP, port: 8081 }]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-gateway-local-clients, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: runtime-gateway } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
      ports: [{ protocol: TCP, port: 8080 }]
{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: runtime-gateway, labels: { app.kubernetes.io/name: runtime-gateway, app.kubernetes.io/part-of: zasp } }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: runtime-gateway, app.kubernetes.io/part-of: zasp } }
  namespaceSelector: { matchNames: [{{ .Release.Namespace | quote }}] }
  endpoints: [{ port: internal, path: /metrics, interval: 30s, scrapeTimeout: 5s }]
{{- if .Values.sensorAgent.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: sensor-agent, labels: { app.kubernetes.io/name: sensor-agent, app.kubernetes.io/part-of: zasp } }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: sensor-agent, app.kubernetes.io/part-of: zasp } }
  namespaceSelector: { matchNames: [{{ .Release.Namespace | quote }}] }
  endpoints: [{ port: internal, path: /metrics, interval: 30s, scrapeTimeout: 5s }]
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: zasp-customer-edge, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  groups:
    - name: zasp.customer-edge
      rules:
        - alert: ZaspRuntimeGatewayNotReady
          expr: agentsec_ready{namespace="{{ .Release.Namespace }}",service="runtime-gateway"} == 0 or absent(agentsec_ready{namespace="{{ .Release.Namespace }}",service="runtime-gateway"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "The customer-edge runtime gateway is not ready" }
        - alert: ZaspRuntimeGatewayEvidenceCapacityWarning
          expr: zasp_gateway_evidence_receipt_utilization_ratio{namespace="{{ .Release.Namespace }}",service="runtime-gateway"} >= 0.8
          for: 10m
          labels: { severity: warning }
          annotations: { summary: "The runtime gateway evidence store exceeds 80 percent capacity" }
        - alert: ZaspRuntimeGatewayEvidenceCapacityCritical
          expr: zasp_gateway_evidence_receipt_utilization_ratio{namespace="{{ .Release.Namespace }}",service="runtime-gateway"} >= 0.95
          for: 5m
          labels: { severity: page }
          annotations: { summary: "The runtime gateway evidence store exceeds 95 percent capacity" }
        - alert: ZaspRuntimeGatewayEvidenceDatabaseCapacityCritical
          expr: zasp_gateway_evidence_database_utilization_ratio{namespace="{{ .Release.Namespace }}",service="runtime-gateway"} >= 0.8
          for: 5m
          labels: { severity: page }
          annotations: { summary: "The runtime gateway evidence database exceeds its physical safety boundary" }
        - alert: ZaspRuntimeGatewayEvidenceVolumeFreeCritical
          expr: kubelet_volume_stats_available_bytes{namespace="{{ .Release.Namespace }}",persistentvolumeclaim="runtime-gateway-cache"} / kubelet_volume_stats_capacity_bytes{namespace="{{ .Release.Namespace }}",persistentvolumeclaim="runtime-gateway-cache"} <= 0.25
          for: 5m
          labels: { severity: page }
          annotations: { summary: "The runtime gateway evidence volume has less than 25 percent free space" }
        - alert: ZaspRuntimeGatewayEvidenceQuarantined
          expr: zasp_gateway_evidence_quarantined{namespace="{{ .Release.Namespace }}",service="runtime-gateway"} > 0
          for: 1m
          labels: { severity: page }
          annotations: { summary: "The runtime gateway has quarantined decision evidence" }
{{- if .Values.sensorAgent.enabled }}
        - alert: ZaspSensorAgentNotReady
          expr: agentsec_ready{namespace="{{ .Release.Namespace }}",service="sensor-agent"} == 0 or absent(agentsec_ready{namespace="{{ .Release.Namespace }}",service="sensor-agent"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "The customer-edge sensor adapter is not ready" }
        - alert: ZaspEdgeDaemonSetUnavailable
          expr: kube_daemonset_status_number_unavailable{namespace="{{ .Release.Namespace }}",daemonset=~"sensor-agent|zasp-tetragon"} > 0
          for: 10m
          labels: { severity: page }
          annotations: { summary: "A customer-edge sensor DaemonSet is unavailable" }
{{- end }}
{{- end }}
{{- if .Values.sensorAgent.enabled }}
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata: { name: zasp-sensitive-file }
spec:
  podSelector: {}
  containerSelector:
    matchExpressions: [{ key: name, operator: Exists }]
  kprobes:
    - call: security_file_permission
      syscall: false
      args:
        - { index: 0, type: file }
        - { index: 1, type: int }
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values: [/etc, /var/run/secrets, /run/secrets]
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata: { name: zasp-network-connect }
spec:
  podSelector: {}
  containerSelector:
    matchExpressions: [{ key: name, operator: Exists }]
  kprobes:
    - call: tcp_connect
      syscall: false
      args:
        - { index: 0, type: sock }
{{- end }}
{{- end }}
