{{- if .Values.auditExports.enabled -}}
{{- $config := .Values.auditExports -}}
{{- range $key := list "stsCIDRs" "sqsCIDRs" "s3CIDRs" -}}
{{- $cidrs := index $config $key -}}
{{- if or (not (kindIs "slice" $cidrs)) (lt (len $cidrs) 1) (gt (len $cidrs) 64) -}}{{ fail "audit export endpoint snapshots are required" }}{{- end -}}
{{- $ranges := list -}}
{{- range $cidr := $cidrs -}}
{{- if not (kindIs "string" $cidr) -}}{{ fail "audit export CIDR must be a string" }}{{- end -}}
{{- if not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/(1[6-9]|2[0-9]|3[0-2])$" $cidr) -}}{{ fail "audit export CIDR must be bounded IPv4" }}{{- end -}}
{{- $parts := splitList "/" $cidr -}}
{{- $octets := splitList "." (index $parts 0) -}}
{{- $start := int64 0 -}}
{{- range $octet := $octets -}}
{{- if or (gt (int $octet) 255) (ne (toString (int $octet)) $octet) -}}{{ fail "audit export CIDR is not canonical" }}{{- end -}}
{{- $start = add (mul $start 256) (int $octet) -}}
{{- end -}}
{{- $first := int (index $octets 0) -}}
{{- if or (eq $first 0) (eq $first 127) (ge $first 224) (and (eq $first 169) (eq (index $octets 1) "254")) -}}{{ fail "audit export CIDR is not an endpoint range" }}{{- end -}}
{{- $size := int64 1 -}}
{{- range until (int (sub 32 (int (index $parts 1)))) -}}{{- $size = mul $size 2 -}}{{- end -}}
{{- if ne (mod $start $size) 0 -}}{{ fail "audit export CIDR has host bits" }}{{- end -}}
{{- $end := sub (add $start $size) 1 -}}
{{- range $prior := $ranges -}}
{{- if and (le $start $prior.end) (ge $end $prior.start) -}}{{ fail "audit export endpoint ranges overlap" }}{{- end -}}
{{- end -}}
{{- $ranges = append $ranges (dict "start" $start "end" $end) -}}
{{- end -}}
{{- end -}}
{{- range $suffix := list "worker" "outbox" }}
{{- $name := printf "zasp-audit-export-%s" $suffix }}
{{- $cidrs := concat $config.stsCIDRs $config.sqsCIDRs }}
{{- if eq $suffix "worker" }}{{- $cidrs = concat $cidrs $config.s3CIDRs }}{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-dependencies
  labels: { app.kubernetes.io/part-of: zasp }
  annotations: { zasp.io/network-policy-boundary: native-cidr-snapshot }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: {{ required "network.postgresCIDR is required" $.Values.network.postgresCIDR | quote }} } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
      {{- range $cidr := uniq $cidrs }}
        - ipBlock: { cidr: {{ $cidr | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports: [{ name: internal, port: 8081, targetPort: internal, protocol: TCP }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/part-of: zasp }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
{{- if $.Values.monitoring.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-monitoring
  labels: { app.kubernetes.io/part-of: zasp }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $.Values.monitoring.namespace | quote }} } } }]
      ports: [{ protocol: TCP, port: 8081 }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp } }
  namespaceSelector: { matchNames: [{{ $.Release.Namespace | quote }}] }
  endpoints: [{ port: internal, path: /metrics, interval: 30s, scrapeTimeout: 5s }]
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zasp-audit-export-api-dependencies
  labels: { app.kubernetes.io/part-of: zasp }
  annotations: { zasp.io/network-policy-boundary: native-cidr-snapshot }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: agentsec-api } }
  policyTypes: [Egress]
  egress:
    - to:
      {{- range $cidr := uniq (concat $config.stsCIDRs $config.s3CIDRs) }}
        - ipBlock: { cidr: {{ $cidr | quote }} }
      {{- end }}
      ports: [{ protocol: TCP, port: 443 }]
{{- end }}
