{{- $exports := .Values.auditExports | default dict -}}
{{- if and (hasKey $exports "enabled") (not (kindIs "bool" $exports.enabled)) -}}{{ fail "auditExports.enabled must be boolean" }}{{- end -}}
{{- if $exports.enabled -}}
{{- include "zasp.auditExports.apiValidate" . -}}
{{- $_ := include "zasp.auditExports.selectedPolicy" . -}}
{{- if or (ne .Values.profile "control_plane") (not (has (toString .Values.schema.expectedVersion) (list "52" "53" "54" "55" "56" "57" "58"))) (not (has .Values.runtime.sessionSearchPhase (list "precision-consumers" "precision-intake"))) -}}
{{- fail "audit exports require schema52 through56 and a precision deployment phase" -}}
{{- end -}}
{{- if le (int .Values.global.terminationGracePeriodSeconds) 20 -}}{{ fail "audit exports require termination grace greater than shutdown20s" }}{{- end -}}
{{- $region := required "auditExports.awsRegion is required" $exports.awsRegion -}}
{{- if not (regexMatch "^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$" $region) -}}{{ fail "audit exports require a canonical AWS region" }}{{- end -}}
{{- $writer := required "auditExports.writerRoleArn is required" $exports.writerRoleArn -}}
{{- $publisher := required "auditExports.publisherRoleArn is required" $exports.publisherRoleArn -}}
{{- $rolePattern := "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$" -}}
{{- if or (not (regexMatch $rolePattern $writer)) (not (regexMatch $rolePattern $publisher)) (eq $writer $publisher) -}}{{ fail "audit export roles must be distinct explicit IAM roles" }}{{- end -}}
{{- $account := index (splitList ":" $writer) 4 -}}
{{- if or (ne (index (splitList ":" $publisher) 4) $account) (ne $exports.queueURL (printf "https://sqs.%s.amazonaws.com/%s/agentsec-audit-exports" $region $account)) -}}{{ fail "audit export queue must match role account and region" }}{{- end -}}
{{- $workerSecret := required "auditExports.workerDSNSecretArn is required" $exports.workerDSNSecretArn -}}
{{- $outboxSecret := required "auditExports.outboxDSNSecretArn is required" $exports.outboxDSNSecretArn -}}
{{- $secretPattern := printf "^arn:aws:secretsmanager:%s:%s:secret:[A-Za-z0-9/_+=.@-]{1,512}$" $region $account -}}
{{- if or (eq $workerSecret $outboxSecret) (not (regexMatch $secretPattern $workerSecret)) (not (regexMatch $secretPattern $outboxSecret)) -}}{{ fail "audit export DSN references must be distinct scoped secrets" }}{{- end -}}
{{- if or (not (kindIs "slice" $exports.policies)) (lt (len $exports.policies) 1) (gt (len $exports.policies) 64) -}}{{ fail "audit exports require explicit policy history" }}{{- end -}}
{{- $image := required "audit exports require worker image" .Values.global.productImages.agentsecWorker -}}
{{- if not (regexMatch "^[a-z0-9][a-z0-9./_-]*(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$" $image) -}}{{ fail "audit export worker image must be digest pinned" }}{{- end -}}
{{- range $worker := list (dict "suffix" "worker" "mode" "audit-export" "authority" "zasp_audit_export_worker" "role" $writer "secret" $workerSecret) (dict "suffix" "outbox" "mode" "audit-export-outbox" "authority" "zasp_audit_export_outbox" "role" $publisher "secret" $outboxSecret) }}
{{- $name := printf "zasp-audit-export-%s" $worker.suffix }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations: { eks.amazonaws.com/role-arn: {{ $worker.role | quote }} }
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $name }}-secrets
spec:
  provider: aws
  parameters:
    region: {{ $region | quote }}
    objects: |
      - objectName: {{ $worker.secret | quote }}
        objectType: secretsmanager
        objectAlias: postgres-dsn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp }
      annotations: { zasp.io/schema-version: {{ $.Values.schema.expectedVersion | quote }} }
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } } }
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } } }
      terminationGracePeriodSeconds: {{ $.Values.global.terminationGracePeriodSeconds }}
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args: ['export ZASP_POSTGRES_DSN="$(cat /var/run/secrets/zasp-export/postgres-dsn)"; exec /app/agentsec-worker']
          ports: [{ name: internal, containerPort: 8081 }]
          env:
            - { name: ZASP_WORKER_MODE, value: {{ $worker.mode | quote }} }
            - { name: ZASP_DATABASE_AUTHORITY, value: {{ $worker.authority | quote }} }
            - name: ZASP_WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: ZASP_AWS_REGION, value: {{ $region | quote }} }
            - { name: ZASP_POLL_INTERVAL, value: "1s" }
            - { name: ZASP_LEASE_DURATION, value: "300s" }
            - { name: ZASP_BATCH_SIZE, value: "1" }
            - { name: ZASP_SHUTDOWN_TIMEOUT, value: "20s" }
            - { name: ZASP_PROVIDER_TIMEOUT, value: "5s" }
            - { name: ZASP_AUDIT_EXPORT_QUEUE_URL, value: {{ $exports.queueURL | quote }} }
            - { name: ZASP_AUDIT_EXPORT_WEB_IDENTITY_TOKEN_FILE, value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token" }
            {{- if eq $worker.suffix "worker" }}
            - { name: ZASP_AUDIT_EXPORT_WRITER_ROLE_ARN, value: {{ $writer | quote }} }
            - { name: ZASP_AUDIT_EXPORT_POLICIES_JSON, value: {{ toJson $exports.policies | quote }} }
            {{- else }}
            - { name: ZASP_AUDIT_EXPORT_PUBLISHER_ROLE_ARN, value: {{ $publisher | quote }} }
            {{- end }}
          volumeMounts:
            - { name: database, mountPath: /var/run/secrets/zasp-export, readOnly: true }
            - { name: identity, mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount, readOnly: true }
          startupProbe: { httpGet: { path: /healthz, port: internal }, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 1 }
          readinessProbe: { httpGet: { path: /readyz, port: internal }, failureThreshold: 3, periodSeconds: 5, timeoutSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: internal }, failureThreshold: 3, periodSeconds: 10, timeoutSeconds: 2 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      volumes:
        - name: database
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: {{ printf "%s-secrets" $name | quote }} } }
        - name: identity
          projected:
            sources:
              - serviceAccountToken: { audience: sts.amazonaws.com, expirationSeconds: 3600, path: token }
{{- end }}
{{- end }}
