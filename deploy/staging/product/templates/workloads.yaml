{{- if ne .Values.profile "customer_edge" }}
{{- $root := . -}}
{{- $workloads := list
  (dict "name" "web" "imageKey" "web" "port" 3000 "healthPort" 3000 "readyPath" "/" "livePath" "/" "replicas" .Values.replicas.web "serviceAccount" .Values.serviceAccounts.web)
  (dict "name" "agentsec-api" "imageKey" "agentsecApi" "port" 8080 "healthPort" 8081 "readyPath" "/readyz" "livePath" "/healthz" "replicas" .Values.replicas.agentsecApi "serviceAccount" .Values.serviceAccounts.api.name)
-}}
{{- range $workloads }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels: { app.kubernetes.io/name: {{ .name }}, app.kubernetes.io/part-of: zasp }
spec:
  replicas: {{ .replicas }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app.kubernetes.io/name: {{ .name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ .name }}, app.kubernetes.io/part-of: zasp }
      annotations: { zasp.io/schema-version: {{ $root.Values.schema.expectedVersion | quote }} }
    spec:
      serviceAccountName: {{ .serviceAccount }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $root.Values.global.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app.kubernetes.io/name: {{ .name }} } } }
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/name: {{ .name }} } } }
      containers:
        - name: {{ .name }}
          image: {{ required (printf "global.productImages.%s must be an immutable digest" .imageKey) (index $root.Values.global.productImages .imageKey) | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: product, containerPort: {{ .port }}, protocol: TCP }
            {{- if ne .healthPort .port }}
            - { name: internal, containerPort: {{ .healthPort }}, protocol: TCP }
            {{- end }}
          startupProbe: { httpGet: { path: {{ .livePath }}, port: {{ .healthPort }} }, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 1 }
          readinessProbe: { httpGet: { path: {{ .readyPath }}, port: {{ .healthPort }} }, failureThreshold: 3, periodSeconds: 5, timeoutSeconds: 2 }
          livenessProbe: { httpGet: { path: {{ .livePath }}, port: {{ .healthPort }} }, failureThreshold: 3, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 10"] } } }
          resources: { requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi }, limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 256Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          env:
            - { name: ZASP_ENVIRONMENT, value: {{ $root.Values.global.environment | quote }} }
            - { name: ZASP_DEPLOYMENT_MODE, value: {{ $root.Values.global.deploymentMode | quote }} }
            - { name: ZASP_PUBLIC_ORIGIN, value: {{ required "global.publicOrigin is required" $root.Values.global.publicOrigin | quote }} }
            {{- if eq .name "agentsec-api" }}
            - { name: ZASP_PRODUCT_LISTEN_ADDRESS, value: ":8080" }
            - { name: ZASP_INTERNAL_LISTEN_ADDRESS, value: ":8081" }
            - { name: ZASP_COOKIE_SECURE, value: "true" }
            - { name: ZASP_PROVIDER_TIMEOUT, value: "5s" }
            - { name: ZASP_SHUTDOWN_TIMEOUT, value: "15s" }
            - { name: ZASP_READINESS_INTERVAL, value: "5s" }
            - { name: ZASP_READINESS_MAX_INTERVAL, value: "1m" }
            - { name: ZASP_DISCOVERY_PARSER_VERSION, value: {{ required "discovery.parserVersion is required" $root.Values.discovery.parserVersion | quote }} }
            - { name: ZASP_DISCOVERY_TOOL_VERSION, value: {{ required "discovery.toolVersion is required" $root.Values.discovery.toolVersion | quote }} }
            - { name: ZASP_TRUSTED_PROXY_CIDRS, value: {{ join "," $root.Values.global.trustedProxyCIDRs | quote }} }
            - { name: ZASP_REQUEST_RATE_PER_SECOND, value: "100" }
            - { name: ZASP_REQUEST_BURST, value: "200" }
            - { name: ZASP_REQUEST_TIMEOUT, value: "10s" }
            - { name: ZASP_EXPECTED_SCHEMA_VERSION, value: {{ $root.Values.schema.expectedVersion | quote }} }
            - { name: ZASP_DATABASE_AUTHORITY, value: "zasp_discovery_api" }
            - { name: ZASP_STYTCH_BASE_URL, value: "https://api.stytch.com" }
            - { name: ZASP_STYTCH_AUTHORIZE_URL, value: "https://api.stytch.com/v1/b2b/public/oauth/google/start" }
            - { name: ZASP_CONNECTOR_AWS_REGION, value: {{ required "connectors.awsRegion is required" $root.Values.connectors.awsRegion | quote }} }
            - { name: ZASP_CONNECTOR_ROLE_ARN, value: {{ required "connectors.roleArn is required" $root.Values.connectors.roleArn | quote }} }
            - { name: ZASP_CONNECTOR_WEB_IDENTITY_TOKEN_FILE, value: {{ required "connectors.webIdentityTokenFile is required" $root.Values.connectors.webIdentityTokenFile | quote }} }
            - { name: ZASP_CONNECTOR_KMS_KEY_ARN, value: {{ required "connectors.kmsKeyArn is required" $root.Values.connectors.kmsKeyArn | quote }} }
            - { name: ZASP_CONNECTOR_SECRET_PREFIX, value: {{ required "connectors.secretPrefix is required" $root.Values.connectors.secretPrefix | quote }} }
            - { name: ZASP_AWS_CUSTOMER_ROLE_PREFIXES, value: {{ toJson (required "connectors.awsCustomerRolePrefixes is required" $root.Values.connectors.awsCustomerRolePrefixes) | quote }} }
            - { name: ZASP_AWS_CUSTOMER_ROLE_ARNS, value: {{ toJson (required "connectors.awsCustomerRoleARNs is required" $root.Values.connectors.awsCustomerRoleARNs) | quote }} }
            - { name: ZASP_KUBERNETES_EGRESS_CIDRS, value: {{ join "," (required "network.connectorEgressCIDRs.kubernetes is required" $root.Values.network.connectorEgressCIDRs.kubernetes) | quote }} }
            - { name: ZASP_FINDING_TICKET_EGRESS_CIDRS, value: {{ join "," (required "network.findingTicketEgressCIDRs is required" $root.Values.network.findingTicketEgressCIDRs) | quote }} }
            - { name: ZASP_GITHUB_CLIENT_ID, value: {{ required "connectors.githubClientID is required" $root.Values.connectors.githubClientID | quote }} }
            - { name: ZASP_GITHUB_CLIENT_SECRET_REFERENCE, value: {{ required "connectors.githubClientSecretReference is required" $root.Values.connectors.githubClientSecretReference | quote }} }
            - { name: ZASP_GITHUB_APP_ID, value: {{ required "connectors.githubAppID is required" $root.Values.connectors.githubAppID | quote }} }
            - { name: ZASP_GITHUB_PRIVATE_KEY_REFERENCE, value: {{ required "connectors.githubPrivateKeyReference is required" $root.Values.connectors.githubPrivateKeyReference | quote }} }
            - { name: ZASP_OKTA_CLIENT_ID, value: {{ required "connectors.oktaClientID is required" $root.Values.connectors.oktaClientID | quote }} }
            - { name: ZASP_OKTA_CLIENT_SECRET_REFERENCE, value: {{ required "connectors.oktaClientSecretReference is required" $root.Values.connectors.oktaClientSecretReference | quote }} }
            {{- end }}
            {{- if $root.Values.global.organizationID }}
            - { name: ZASP_ORGANIZATION_ID, value: {{ $root.Values.global.organizationID | quote }} }
            {{- end }}
          {{- if eq .name "agentsec-api" }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export ZASP_POSTGRES_DSN="$(cat /var/run/secrets/zasp/postgres-dsn)"
              export ZASP_STYTCH_PROJECT_ID="$(cat /var/run/secrets/zasp/stytch-project-id)"
              export ZASP_STYTCH_SECRET="$(cat /var/run/secrets/zasp/stytch-secret)"
              export ZASP_STYTCH_PUBLIC_TOKEN="$(cat /var/run/secrets/zasp/stytch-public-token)"
              export ZASP_STYTCH_ORGANIZATION_ID="$(cat /var/run/secrets/zasp/stytch-organization-id)"
              export ZASP_WORKFLOW_SIGNING_KEY="$(cat /var/run/secrets/zasp/workflow-signing-key)"
              export ZASP_TOKEN_REVEAL_KEY="$(cat /var/run/secrets/zasp/token-reveal-key)"
              exec /app/agentsec-api
          volumeMounts:
            - { name: runtime-secrets, mountPath: /var/run/secrets/zasp, readOnly: true }
            - { name: connector-web-identity, mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount, readOnly: true }
          {{- end }}
      {{- if eq .name "agentsec-api" }}
      volumes:
        - name: runtime-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: {{ required "secrets.providerClassName is required" $root.Values.secrets.providerClassName | quote }} }
        - name: connector-web-identity
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken: { audience: sts.amazonaws.com, expirationSeconds: 900, path: token }
      {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentsec-discovery-scheduler
  labels: { app.kubernetes.io/name: agentsec-discovery-scheduler, app.kubernetes.io/part-of: zasp }
spec:
  replicas: {{ .Values.replicas.discoveryScheduler }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app.kubernetes.io/name: agentsec-discovery-scheduler } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentsec-discovery-scheduler, app.kubernetes.io/part-of: zasp }
      annotations: { zasp.io/schema-version: {{ .Values.schema.expectedVersion | quote }} }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.scheduler.name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.global.terminationGracePeriodSeconds }}
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app.kubernetes.io/name: agentsec-discovery-scheduler } } }
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/name: agentsec-discovery-scheduler } } }
      containers:
        - name: scheduler
          image: {{ required "global.productImages.agentsecWorker must be an immutable digest" .Values.global.productImages.agentsecWorker | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args: ['export ZASP_POSTGRES_DSN="$(cat /var/run/secrets/zasp-scheduler/postgres-dsn)"; exec /app/agentsec-worker']
          ports: [{ name: internal, containerPort: 8081, protocol: TCP }]
          startupProbe: { httpGet: { path: /healthz, port: 8081 }, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 1 }
          readinessProbe: { httpGet: { path: /readyz, port: 8081 }, failureThreshold: 3, periodSeconds: 5, timeoutSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: 8081 }, failureThreshold: 3, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 10"] } } }
          resources: { requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 32Mi }, limits: { cpu: "1", memory: 256Mi, ephemeral-storage: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
          env:
            - { name: ZASP_WORKER_MODE, value: "scheduler" }
            - { name: ZASP_DATABASE_AUTHORITY, value: "zasp_discovery_scheduler" }
            - name: ZASP_WORKER_ID
              valueFrom: { fieldRef: { apiVersion: v1, fieldPath: metadata.name } }
            - { name: ZASP_POLL_INTERVAL, value: "1s" }
            - { name: ZASP_LEASE_DURATION, value: "30s" }
            - { name: ZASP_BATCH_SIZE, value: "8" }
            - { name: ZASP_SHUTDOWN_TIMEOUT, value: "15s" }
            - { name: ZASP_DISCOVERY_PARSER_VERSION, value: {{ required "discovery.parserVersion is required" .Values.discovery.parserVersion | quote }} }
            - { name: ZASP_DISCOVERY_TOOL_VERSION, value: {{ required "discovery.toolVersion is required" .Values.discovery.toolVersion | quote }} }
          volumeMounts: [{ name: scheduler-secrets, mountPath: /var/run/secrets/zasp-scheduler, readOnly: true }]
      volumes:
        - name: scheduler-secrets
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: {{ .Values.secrets.schedulerProviderClassName | quote }} } }
