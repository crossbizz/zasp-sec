{{- if ne .Values.profile "customer_edge" }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ required "secrets.providerClassName is required" .Values.secrets.providerClassName }}
  labels: { app.kubernetes.io/part-of: zasp }
spec:
  provider: aws
  secretObjects:
    - secretName: zasp-runtime-secrets
      type: Opaque
      data:
        - { objectName: postgres-dsn, key: ZASP_POSTGRES_DSN }
        - { objectName: stytch-project-id, key: ZASP_STYTCH_PROJECT_ID }
        - { objectName: stytch-secret, key: ZASP_STYTCH_SECRET }
        - { objectName: stytch-public-token, key: ZASP_STYTCH_PUBLIC_TOKEN }
        - { objectName: stytch-organization-id, key: ZASP_STYTCH_ORGANIZATION_ID }
        - { objectName: workflow-signing-key, key: ZASP_WORKFLOW_SIGNING_KEY }
        - { objectName: token-reveal-key, key: ZASP_TOKEN_REVEAL_KEY }
  parameters:
    region: {{ .Values.secrets.region | quote }}
    objects: |
      - objectName: {{ required "secrets.postgresDSNObjectName is required" .Values.secrets.postgresDSNObjectName | quote }}
        objectType: secretsmanager
        objectAlias: postgres-dsn
      - objectName: {{ required "secrets.stytchProjectIDObjectName is required" .Values.secrets.stytchProjectIDObjectName | quote }}
        objectType: secretsmanager
        objectAlias: stytch-project-id
      - objectName: {{ required "secrets.stytchSecretObjectName is required" .Values.secrets.stytchSecretObjectName | quote }}
        objectType: secretsmanager
        objectAlias: stytch-secret
      - objectName: {{ required "secrets.stytchPublicTokenObjectName is required" .Values.secrets.stytchPublicTokenObjectName | quote }}
        objectType: secretsmanager
        objectAlias: stytch-public-token
      - objectName: {{ required "secrets.stytchOrganizationIDObjectName is required" .Values.secrets.stytchOrganizationIDObjectName | quote }}
        objectType: secretsmanager
        objectAlias: stytch-organization-id
      - objectName: {{ required "secrets.workflowSigningKeyObjectName is required" .Values.secrets.workflowSigningKeyObjectName | quote }}
        objectType: secretsmanager
        objectAlias: workflow-signing-key
      - objectName: {{ required "secrets.tokenRevealKeyObjectName is required" .Values.secrets.tokenRevealKeyObjectName | quote }}
        objectType: secretsmanager
        objectAlias: token-reveal-key
{{- end }}
