apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.canarySecretSync.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.canarySecretSync.roleArn is required" .Values.serviceAccounts.canarySecretSync.roleArn | quote }}
automountServiceAccountToken: false
{{- if .Values.recovery.canaryEnabled }}
{{- range $secret := list
  (dict "provider" $.Values.secrets.recoveryBackupOutboxProviderClassName "object" $.Values.secrets.recoveryBackupOutboxPostgresDSNObjectName "name" "zasp-recovery-backup-outbox-secrets")
  (dict "provider" $.Values.secrets.recoveryRestoreOutboxProviderClassName "object" $.Values.secrets.recoveryRestoreOutboxPostgresDSNObjectName "name" "zasp-recovery-restore-outbox-secrets")
  (dict "provider" $.Values.secrets.recoveryBackupProviderClassName "object" $.Values.secrets.recoveryBackupPostgresDSNObjectName "name" "zasp-recovery-backup-secrets")
  (dict "provider" $.Values.secrets.recoveryRestoreProviderClassName "object" $.Values.secrets.recoveryRestorePostgresDSNObjectName "name" "zasp-recovery-restore-secrets")
}}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .provider }}
  labels: { app.kubernetes.io/part-of: zasp }
spec:
  provider: aws
  secretObjects:
    - secretName: {{ .name }}
      type: Opaque
      data: [{ objectName: postgres-dsn, key: ZASP_POSTGRES_DSN }]
  parameters:
    region: {{ $.Values.secrets.region | quote }}
    objects: |
      - objectName: {{ required (printf "%s object is required" .name) .object | quote }}
        objectType: secretsmanager
        objectAlias: postgres-dsn
{{- end }}
{{- end }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.canaryProviderClassName }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider: aws
  secretObjects:
    - secretName: zasp-canary-secrets
      type: Opaque
      data: [{ objectName: canary-read-token, key: ZASP_CANARY_READ_TOKEN }]
  parameters:
    region: {{ .Values.secrets.region | quote }}
    objects: |
      - objectName: {{ required "secrets.canaryReadTokenObjectName is required" .Values.secrets.canaryReadTokenObjectName | quote }}
        objectType: secretsmanager
        objectAlias: canary-read-token
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zasp-canary-secret-sync
  labels: { app.kubernetes.io/name: zasp-canary-secret-sync, app.kubernetes.io/part-of: zasp }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata: { labels: { app.kubernetes.io/name: zasp-canary-secret-sync, app.kubernetes.io/part-of: zasp } }
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.canarySecretSync.name }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: sync
          image: {{ required "global.productImages.web must be an immutable digest" .Values.global.productImages.web | quote }}
          command: ["node", "-e", "require('node:fs').accessSync('/var/run/secrets/zasp-canary/canary-read-token')"]
          volumeMounts: [{ name: canary-secrets, mountPath: /var/run/secrets/zasp-canary, readOnly: true }]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      volumes:
        - name: canary-secrets
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: {{ .Values.secrets.canaryProviderClassName | quote }} } }
{{- end }}
