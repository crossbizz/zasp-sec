{{- if and .Values.attackLabReconciler.enabled (has (toString .Values.schema.expectedVersion) (list "57" "58")) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: attack-lab-workflow-readiness-ingress }
spec:
  podSelector:
    matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [agentsec-security-agent, agentsec-attack-lab-outbox, agentsec-attack-lab-controller, agentsec-attack-lab-proxy, security-agent-attack-lab-reconciler] }]
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: agentsec-api } } }]
      ports: [{ protocol: TCP, port: 8081 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: attack-lab-workflow-readiness-egress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: agentsec-api } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [agentsec-security-agent, agentsec-attack-lab-outbox, agentsec-attack-lab-controller, agentsec-attack-lab-proxy, security-agent-attack-lab-reconciler] }]
      ports: [{ protocol: TCP, port: 8081 }]
{{- end }}
