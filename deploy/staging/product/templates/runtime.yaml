{{- if ne .Values.profile "customer_edge" }}
{{- $root := . }}
{{- range $account := list
      (dict "key" "runtimeIngest" "role" true)
      (dict "key" "gatewayControl" "role" true)
      (dict "key" "runtimeOutbox" "role" true)
      (dict "key" "runtimeCoordinator" "role" true)
      (dict "key" "runtimeArchive" "role" true)
      (dict "key" "runtimeIndex" "role" true)
      (dict "key" "runtimeCorrelation" "role" true)
      (dict "key" "runtimeProjection" "role" true)
      (dict "key" "runtimeComplete" "role" true) }}
{{- $serviceAccount := index $root.Values.serviceAccounts $account.key }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccount.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  {{- if $account.role }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required (printf "serviceAccounts.%s.roleArn is required" $account.key) $serviceAccount.roleArn | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- range $secret := list
      (dict "name" "zasp-production-runtime-ingest-secrets" "providerKey" "runtimeIngestProviderClassName" "objectKey" "runtimeIngestPostgresDSNObjectName")
      (dict "name" "zasp-production-runtime-coordinator-secrets" "providerKey" "runtimeCoordinatorProviderClassName" "objectKey" "runtimeCoordinatorPostgresDSNObjectName")
      (dict "name" "zasp-production-runtime-archive-secrets" "providerKey" "runtimeArchiveProviderClassName" "objectKey" "runtimeArchivePostgresDSNObjectName")
      (dict "name" "zasp-production-runtime-index-secrets" "providerKey" "runtimeIndexProviderClassName" "objectKey" "runtimeIndexPostgresDSNObjectName")
      (dict "name" "zasp-production-runtime-correlation-secrets" "providerKey" "runtimeCorrelationProviderClassName" "objectKey" "runtimeCorrelationPostgresDSNObjectName")
      (dict "name" "zasp-production-runtime-projection-secrets" "providerKey" "runtimeProjectionProviderClassName" "objectKey" "runtimeProjectionPostgresDSNObjectName")
      (dict "name" "zasp-production-gateway-control-secrets" "providerKey" "gatewayControlProviderClassName" "objectKey" "gatewayControlPostgresDSNObjectName") }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: {{ index $root.Values.secrets $secret.providerKey }}, labels: { app.kubernetes.io/part-of: zasp } }
spec:
  provider: aws
  parameters:
    region: {{ $root.Values.secrets.region | quote }}
    objects: |
      - objectName: {{ required (printf "secrets.%s is required" $secret.objectKey) (index $root.Values.secrets $secret.objectKey) | quote }}
        objectType: secretsmanager
        objectAlias: postgres-dsn
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agentsec-event-ingest, labels: { app.kubernetes.io/name: agentsec-event-ingest, app.kubernetes.io/part-of: zasp } }
spec:
  replicas: {{ .Values.replicas.runtimeIngest }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app.kubernetes.io/name: agentsec-event-ingest } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentsec-event-ingest, app.kubernetes.io/part-of: zasp }
      annotations: { zasp.io/schema-version: {{ .Values.schema.expectedVersion | quote }} }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.runtimeIngest.name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.global.terminationGracePeriodSeconds }}
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app.kubernetes.io/name: agentsec-event-ingest } } }
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/name: agentsec-event-ingest } } }
      containers:
        - name: event-ingest
          image: {{ required "global.productImages.eventIngest must be an immutable digest" .Values.global.productImages.eventIngest | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args: ['export ZASP_DATABASE_URL="$(cat /var/run/secrets/zasp-runtime-ingest/postgres-dsn)"; exec /app/event-ingest']
          ports: [{ name: product, containerPort: 8080, protocol: TCP }, { name: internal, containerPort: 8081, protocol: TCP }]
          startupProbe: { httpGet: { path: /healthz, port: 8081 }, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 1 }
          readinessProbe: { httpGet: { path: /readyz, port: 8081 }, failureThreshold: 3, periodSeconds: 5, timeoutSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: 8081 }, failureThreshold: 3, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 10"] } } }
          resources: { requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi }, limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
          env:
            - { name: ZASP_AWS_REGION, value: {{ required "runtime.awsRegion is required" .Values.runtime.awsRegion | quote }} }
            - { name: ZASP_EVENT_INGEST_ROLE_ARN, value: {{ required "runtime.eventIngestRoleArn is required" .Values.runtime.eventIngestRoleArn | quote }} }
            - { name: ZASP_EVENT_INGEST_WEB_IDENTITY_TOKEN_FILE, value: {{ required "runtime.webIdentityTokenFile is required" .Values.runtime.webIdentityTokenFile | quote }} }
            - { name: ZASP_RUNTIME_RAW_BUCKET, value: {{ required "runtime.rawBucket is required" .Values.runtime.rawBucket | quote }} }
            - { name: ZASP_RUNTIME_RAW_BUCKET_OWNER, value: {{ required "runtime.rawBucketOwner is required" .Values.runtime.rawBucketOwner | quote }} }
            - { name: ZASP_RUNTIME_RAW_KMS_KEY_ARN, value: {{ required "runtime.rawKMSKeyArn is required" .Values.runtime.rawKMSKeyArn | quote }} }
            - { name: ZASP_EVENT_INGEST_MAX_BYTES, value: "67108864" }
            - { name: ZASP_EVENT_INGEST_OPERATION_TIMEOUT, value: "10s" }
            - { name: ZASP_EVENT_INGEST_SHUTDOWN_TIMEOUT, value: "15s" }
          volumeMounts:
            - { name: database, mountPath: /var/run/secrets/zasp-runtime-ingest, readOnly: true }
            - { name: web-identity, mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount, readOnly: true }
      volumes:
        - name: database
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: {{ .Values.secrets.runtimeIngestProviderClassName | quote }} } }
        - name: web-identity
          projected: { defaultMode: 256, sources: [{ serviceAccountToken: { audience: sts.amazonaws.com, expirationSeconds: 900, path: token } }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agentsec-gateway-control, labels: { app.kubernetes.io/name: agentsec-gateway-control, app.kubernetes.io/part-of: zasp } }
spec:
