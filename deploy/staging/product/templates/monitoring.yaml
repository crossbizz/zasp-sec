{{- if and (ne .Values.profile "customer_edge") .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agentsec-api
  labels: { app.kubernetes.io/name: agentsec-api, app.kubernetes.io/part-of: zasp }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: agentsec-api, app.kubernetes.io/part-of: zasp } }
  namespaceSelector: { matchNames: [{{ .Release.Namespace | quote }}] }
  endpoints:
    - { port: internal, path: /metrics, interval: 30s, scrapeTimeout: 5s }
{{- range $name := list "agentsec-discovery-scheduler" "agentsec-security-agent" "agentsec-security-agent-action" "agentsec-policy-deployment" "agentsec-outbox-publisher" "agentsec-projection-risk" "agentsec-projection-graph" "agentsec-projection-search" "agentsec-event-ingest" "agentsec-gateway-control" "agentsec-runtime-outbox" "agentsec-runtime-coordinator" "agentsec-runtime-archive" "agentsec-runtime-index" "agentsec-runtime-correlation" "agentsec-runtime-projection" "agentsec-runtime-complete" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp } }
  namespaceSelector: { matchNames: [{{ $.Release.Namespace | quote }}] }
  endpoints:
    - { port: internal, path: /metrics, interval: 30s, scrapeTimeout: 5s }
{{- end }}
{{- if .Values.recovery.canaryEnabled }}
{{- range $name := list "agentsec-recovery-backup-outbox" "agentsec-recovery-restore-outbox" "agentsec-recovery-backup" "agentsec-recovery-restore" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp } }
  namespaceSelector: { matchNames: [{{ $.Release.Namespace | quote }}] }
  endpoints:
    - { port: internal, path: /metrics, interval: 30s, scrapeTimeout: 5s }
{{- end }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agentsec-discovery-worker
  labels: { app.kubernetes.io/name: agentsec-discovery-worker, app.kubernetes.io/part-of: zasp }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: agentsec-discovery-worker, app.kubernetes.io/part-of: zasp } }
  namespaceSelector: { matchNames: [{{ .Release.Namespace | quote }}] }
  endpoints:
    - { port: internal, path: /metrics, interval: 30s, scrapeTimeout: 5s }
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zasp-production-slos
  labels: { app.kubernetes.io/part-of: zasp }
spec:
  groups:
    - name: zasp.production
      rules:
        - alert: ZaspAPIErrorBudgetBurn
          expr: sum(rate(zasp_http_slo_requests_total{status_class="5xx"}[5m])) / sum(rate(zasp_http_slo_requests_total[5m])) > 0.01 and sum(rate(zasp_http_slo_requests_total[5m])) > 0
          for: 10m
          labels: { severity: page }
          annotations: { summary: "Product API error rate exceeds 1%" }
        - alert: ZaspAPIReadLatencyBudget
          expr: histogram_quantile(0.95, sum by (le) (rate(zasp_http_slo_request_duration_seconds_bucket{request_class="read"}[5m]))) > 0.5
          for: 15m
          labels: { severity: ticket }
          annotations: { summary: "Product API read p95 exceeds 500ms" }
        - alert: ZaspAPIMutationLatencyBudget
          expr: histogram_quantile(0.95, sum by (le) (rate(zasp_http_slo_request_duration_seconds_bucket{request_class="mutation"}[5m]))) > 1
          for: 15m
          labels: { severity: ticket }
          annotations: { summary: "Product API mutation p95 exceeds 1s" }
        - alert: ZaspWebUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="web"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="web"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Zasp web workload is unavailable or absent" }
        - alert: ZaspAPIUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-api"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-api"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Zasp API workload is unavailable or absent" }
        {{- range $redTeam := list
              (dict "alert" "ZaspRedTeamOutboxUnavailable" "name" "agentsec-red-team-outbox")
              (dict "alert" "ZaspRedTeamWorkerUnavailable" "name" "agentsec-red-team-worker")
              (dict "alert" "ZaspRedTeamAdapterUnavailable" "name" "agentsec-red-team-adapter") }}
        - alert: {{ $redTeam.alert }}
          expr: kube_deployment_status_replicas_available{namespace="{{ $.Release.Namespace }}",deployment="{{ $redTeam.name }}"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ $.Release.Namespace }}",deployment="{{ $redTeam.name }}"})
          for: 5m
          labels: { severity: page, workload: {{ $redTeam.name }} }
          annotations: { summary: "A Red Team workload is unavailable or absent" }
        {{- end }}
        - alert: ZaspRedTeamDependencyNotReady
          expr: agentsec_ready{namespace="{{ .Release.Namespace }}",service=~"agentsec-red-team-(outbox|worker|adapter)"} == 0
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "A Red Team dependency is not ready" }
        {{- range $attackLab := list
              (dict "alert" "ZaspAttackLabControllerUnavailable" "name" "agentsec-attack-lab-controller")
              (dict "alert" "ZaspAttackLabOutboxUnavailable" "name" "agentsec-attack-lab-outbox")
              (dict "alert" "ZaspAttackLabProxyUnavailable" "name" "agentsec-attack-lab-proxy") }}
        - alert: {{ $attackLab.alert }}
          expr: kube_deployment_status_replicas_available{namespace="{{ $.Release.Namespace }}",deployment="{{ $attackLab.name }}"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ $.Release.Namespace }}",deployment="{{ $attackLab.name }}"})
          for: 5m
          labels: { severity: page, workload: {{ $attackLab.name }} }
          annotations: { summary: "An Attack Lab workload is unavailable or absent" }
        {{- end }}
        - alert: ZaspAttackLabDependencyNotReady
          expr: agentsec_ready{namespace="{{ .Release.Namespace }}",service=~"agentsec-attack-lab-(controller|outbox|proxy)"} == 0
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "An Attack Lab dependency is not ready" }
        - alert: ZaspDiscoveryWorkerUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-discovery-worker"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-discovery-worker"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Discovery worker is unavailable or absent" }
        - alert: ZaspDiscoverySchedulerUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-discovery-scheduler"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-discovery-scheduler"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Discovery scheduler is unavailable or absent" }
        - alert: ZaspSecurityAgentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-security-agent"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-security-agent"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Security agent worker is unavailable or absent" }
        - alert: ZaspSecurityAgentActionUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-security-agent-action"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-security-agent-action"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Security agent action worker is unavailable or absent" }
        - alert: ZaspPolicyDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-policy-deployment"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-policy-deployment"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Central policy deployment worker is unavailable or absent" }
        - alert: ZaspOutboxPublisherUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-outbox-publisher"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-outbox-publisher"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Discovery outbox publisher is unavailable or absent" }
        - alert: ZaspProjectionRiskUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-risk"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-risk"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Risk projection worker is unavailable or absent" }
        - alert: ZaspProjectionGraphUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-graph"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-graph"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Graph projection worker is unavailable or absent" }
        - alert: ZaspProjectionSearchUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-search"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-search"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Search projection worker is unavailable or absent" }
        {{- range $runtime := list
              (dict "alert" "ZaspEventIngestUnavailable" "name" "agentsec-event-ingest")
              (dict "alert" "ZaspGatewayControlUnavailable" "name" "agentsec-gateway-control")
              (dict "alert" "ZaspRuntimeOutboxUnavailable" "name" "agentsec-runtime-outbox")
              (dict "alert" "ZaspRuntimeCoordinatorUnavailable" "name" "agentsec-runtime-coordinator")
              (dict "alert" "ZaspRuntimeArchiveUnavailable" "name" "agentsec-runtime-archive")
              (dict "alert" "ZaspRuntimeIndexUnavailable" "name" "agentsec-runtime-index")
              (dict "alert" "ZaspRuntimeCorrelationUnavailable" "name" "agentsec-runtime-correlation")
              (dict "alert" "ZaspRuntimeProjectionUnavailable" "name" "agentsec-runtime-projection")
              (dict "alert" "ZaspRuntimeCompleteUnavailable" "name" "agentsec-runtime-complete") }}
        - alert: {{ $runtime.alert }}
          expr: kube_deployment_status_replicas_available{namespace="{{ $.Release.Namespace }}",deployment="{{ $runtime.name }}"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ $.Release.Namespace }}",deployment="{{ $runtime.name }}"})
          for: 5m
          labels: { severity: page, workload: {{ $runtime.name }} }
          annotations: { summary: "Runtime data-plane workload is unavailable or absent" }
        {{- end }}
        - alert: ZaspTask6RuntimeDependencyNotReady
          expr: agentsec_ready{namespace="{{ .Release.Namespace }}",service=~"agentsec-(event-ingest|gateway-control|runtime-(outbox|coordinator|archive|index|correlation|projection|complete))"} == 0
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "A runtime data-plane dependency is not ready" }
        - alert: ZaspTask4WorkerDependencyNotReady
          expr: agentsec_ready{namespace="{{ .Release.Namespace }}",service=~"agentsec-(discovery-(scheduler|worker)|security-agent(-action)?|policy-deployment|outbox-publisher|projection-(risk|graph|search))"} == 0
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "A discovery or projection worker dependency is not ready" }
        - alert: ZaspProjectionRiskDriverNotReady
          expr: zasp_worker_driver_ready{service="agentsec-projection-risk"} == 0 or absent(zasp_worker_driver_ready{service="agentsec-projection-risk"})
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "Risk projection driver is not ready or absent" }
        - alert: ZaspProjectionGraphDriverNotReady
          expr: zasp_worker_driver_ready{service="agentsec-projection-graph"} == 0 or absent(zasp_worker_driver_ready{service="agentsec-projection-graph"})
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "Graph projection driver is not ready or absent" }
        - alert: ZaspProjectionSearchDriverNotReady
          expr: zasp_worker_driver_ready{service="agentsec-projection-search"} == 0 or absent(zasp_worker_driver_ready{service="agentsec-projection-search"})
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "Search projection driver is not ready or absent" }
        - alert: ZaspProjectionBacklogAge
          expr: max(zasp_worker_projection_backlog_age_seconds) > 300
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "Projection backlog age exceeds five minutes" }
        - alert: ZaspWorkerLeaseLoss
          expr: sum(increase(zasp_worker_lease_loss_total[10m])) > 0
          for: 5m
          labels: { severity: ticket }
          annotations: { summary: "A worker lost durable lease ownership" }
        - alert: ZaspWorkerExhaustion
          expr: sum(increase(zasp_worker_exhaustion_total[15m])) > 0
          for: 5m
          labels: { severity: page }
          annotations: { summary: "A worker exhausted bounded retry attempts" }
        - alert: ZaspTask4WorkerCapacityExhausted
          expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="{{ .Release.Namespace }}",horizontalpodautoscaler=~"agentsec-(discovery-(scheduler|worker)|security-agent|outbox-publisher|projection-(risk|graph|search))"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="{{ .Release.Namespace }}",horizontalpodautoscaler=~"agentsec-(discovery-(scheduler|worker)|security-agent|outbox-publisher|projection-(risk|graph|search))"}
          for: 15m
          labels: { severity: ticket }
          annotations: { summary: "A discovery or projection worker is at its replica ceiling" }
{{- if .Values.recovery.canaryEnabled }}
        - alert: ZaspRecoveryUnavailable
          expr: agentsec_ready{namespace="{{ .Release.Namespace }}",service=~"agentsec-recovery-(backup|restore)(-outbox)?"} == 0 or count(count by (service) (agentsec_ready{namespace="{{ .Release.Namespace }}",service=~"agentsec-recovery-(backup|restore)(-outbox)?"})) < 4
          for: 5m
          labels: { severity: page }
          annotations: { summary: "A recovery worker is unavailable" }
        - alert: ZaspRecoveryDriverNotReady
          expr: zasp_recovery_driver_ready{namespace="{{ .Release.Namespace }}",service=~"agentsec-recovery-(backup|restore)"} == 0 or count(count by (service) (zasp_recovery_driver_ready{namespace="{{ .Release.Namespace }}",service=~"agentsec-recovery-(backup|restore)"})) < 2
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Recovery cloud or database authority is not ready" }
        - alert: ZaspRecoveryQueueAge
          expr: max(zasp_recovery_queue_age_seconds{namespace="{{ .Release.Namespace }}",service=~"agentsec-recovery-(backup|restore)"}) > 300
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "Recovery work has remained queued for more than five minutes" }
        - alert: ZaspRecoveryHoldTooOld
          expr: max(zasp_recovery_hold_age_seconds{namespace="{{ .Release.Namespace }}",service="agentsec-recovery-backup"}) > 900
          for: 1m
          labels: { severity: page }
          annotations: { summary: "A tenant recovery hold exceeded the fifteen-minute bound" }
        - alert: ZaspRecoveryExhaustion
          expr: sum(increase(zasp_recovery_exhaustion_total{namespace="{{ .Release.Namespace }}",service=~"agentsec-recovery-(backup|restore)"}[15m])) > 0
          for: 1m
          labels: { severity: page }
          annotations: { summary: "Recovery work exhausted bounded retry attempts" }
        - alert: ZaspRecoveryLeaseLoss
          expr: sum(increase(zasp_recovery_lease_loss_total{namespace="{{ .Release.Namespace }}",service=~"agentsec-recovery-(backup|restore)"}[10m])) > 0
          for: 1m
          labels: { severity: ticket }
          annotations: { summary: "A recovery worker lost durable lease ownership" }
        - alert: ZaspRecoveryCleanupFailure
          expr: sum(increase(zasp_recovery_cleanup_failure_total{namespace="{{ .Release.Namespace }}",service="agentsec-recovery-restore"}[10m])) > 0
          for: 1m
          labels: { severity: page }
          annotations: { summary: "A recovery rehearsal failed to prove cleanup" }
{{- end }}
{{- end }}
