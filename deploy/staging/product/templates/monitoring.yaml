{{- if and (ne .Values.profile "customer_edge") .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agentsec-api
  labels: { app.kubernetes.io/name: agentsec-api, app.kubernetes.io/part-of: zasp }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: agentsec-api, app.kubernetes.io/part-of: zasp } }
  namespaceSelector: { matchNames: [{{ .Release.Namespace | quote }}] }
  endpoints:
    - { port: internal, path: /metrics, interval: 30s, scrapeTimeout: 5s }
{{- range $name := list "agentsec-discovery-scheduler" "agentsec-outbox-publisher" "agentsec-projection-risk" "agentsec-projection-graph" "agentsec-projection-search" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: zasp } }
  namespaceSelector: { matchNames: [{{ $.Release.Namespace | quote }}] }
  endpoints:
    - { port: internal, path: /metrics, interval: 30s, scrapeTimeout: 5s }
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agentsec-discovery-worker
  labels: { app.kubernetes.io/name: agentsec-discovery-worker, app.kubernetes.io/part-of: zasp }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: agentsec-discovery-worker, app.kubernetes.io/part-of: zasp } }
  namespaceSelector: { matchNames: [{{ .Release.Namespace | quote }}] }
  endpoints:
    - { port: internal, path: /metrics, interval: 30s, scrapeTimeout: 5s }
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zasp-production-slos
  labels: { app.kubernetes.io/part-of: zasp }
spec:
  groups:
    - name: zasp.production
      rules:
        - alert: ZaspAPIErrorBudgetBurn
          expr: sum(rate(zasp_http_slo_requests_total{status_class="5xx"}[5m])) / sum(rate(zasp_http_slo_requests_total[5m])) > 0.01 and sum(rate(zasp_http_slo_requests_total[5m])) > 0
          for: 10m
          labels: { severity: page }
          annotations: { summary: "Product API error rate exceeds 1%" }
        - alert: ZaspAPIReadLatencyBudget
          expr: histogram_quantile(0.95, sum by (le) (rate(zasp_http_slo_request_duration_seconds_bucket{request_class="read"}[5m]))) > 0.5
          for: 15m
          labels: { severity: ticket }
          annotations: { summary: "Product API read p95 exceeds 500ms" }
        - alert: ZaspAPIMutationLatencyBudget
          expr: histogram_quantile(0.95, sum by (le) (rate(zasp_http_slo_request_duration_seconds_bucket{request_class="mutation"}[5m]))) > 1
          for: 15m
          labels: { severity: ticket }
          annotations: { summary: "Product API mutation p95 exceeds 1s" }
        - alert: ZaspWebUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="web"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="web"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Zasp web workload is unavailable or absent" }
        - alert: ZaspAPIUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-api"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-api"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Zasp API workload is unavailable or absent" }
        - alert: ZaspDiscoveryWorkerUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-discovery-worker"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-discovery-worker"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Discovery worker is unavailable or absent" }
        - alert: ZaspDiscoverySchedulerUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-discovery-scheduler"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-discovery-scheduler"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Discovery scheduler is unavailable or absent" }
        - alert: ZaspOutboxPublisherUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-outbox-publisher"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-outbox-publisher"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Discovery outbox publisher is unavailable or absent" }
        - alert: ZaspProjectionRiskUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-risk"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-risk"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Risk projection worker is unavailable or absent" }
        - alert: ZaspProjectionGraphUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-graph"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-graph"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Graph projection worker is unavailable or absent" }
        - alert: ZaspProjectionSearchUnavailable
          expr: kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-search"} < 1 or absent(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="agentsec-projection-search"})
          for: 5m
          labels: { severity: page }
          annotations: { summary: "Search projection worker is unavailable or absent" }
        - alert: ZaspTask4WorkerDependencyNotReady
          expr: agentsec_ready{namespace="{{ .Release.Namespace }}",service=~"agentsec-(discovery-(scheduler|worker)|outbox-publisher|projection-(risk|graph|search))"} == 0
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "A discovery or projection worker dependency is not ready" }
        - alert: ZaspProjectionRiskDriverNotReady
          expr: zasp_worker_driver_ready{service="agentsec-projection-risk"} == 0 or absent(zasp_worker_driver_ready{service="agentsec-projection-risk"})
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "Risk projection driver is not ready or absent" }
        - alert: ZaspProjectionGraphDriverNotReady
          expr: zasp_worker_driver_ready{service="agentsec-projection-graph"} == 0 or absent(zasp_worker_driver_ready{service="agentsec-projection-graph"})
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "Graph projection driver is not ready or absent" }
        - alert: ZaspProjectionSearchDriverNotReady
          expr: zasp_worker_driver_ready{service="agentsec-projection-search"} == 0 or absent(zasp_worker_driver_ready{service="agentsec-projection-search"})
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "Search projection driver is not ready or absent" }
        - alert: ZaspProjectionBacklogAge
          expr: max(zasp_worker_projection_backlog_age_seconds) > 300
          for: 10m
          labels: { severity: ticket }
          annotations: { summary: "Projection backlog age exceeds five minutes" }
        - alert: ZaspWorkerLeaseLoss
          expr: sum(increase(zasp_worker_lease_loss_total[10m])) > 0
          for: 5m
          labels: { severity: ticket }
          annotations: { summary: "A worker lost durable lease ownership" }
        - alert: ZaspWorkerExhaustion
          expr: sum(increase(zasp_worker_exhaustion_total[15m])) > 0
          for: 5m
          labels: { severity: page }
          annotations: { summary: "A worker exhausted bounded retry attempts" }
        - alert: ZaspTask4WorkerCapacityExhausted
          expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="{{ .Release.Namespace }}",horizontalpodautoscaler=~"agentsec-(discovery-(scheduler|worker)|outbox-publisher|projection-(risk|graph|search))"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="{{ .Release.Namespace }}",horizontalpodautoscaler=~"agentsec-(discovery-(scheduler|worker)|outbox-publisher|projection-(risk|graph|search))"}
          for: 15m
          labels: { severity: ticket }
          annotations: { summary: "A discovery or projection worker is at its replica ceiling" }
{{- end }}
