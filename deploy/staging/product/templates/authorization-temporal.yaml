{{- if and (ne .Values.profile "customer_edge") .Values.authorizationTemporal.profile }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zasp-authorization-projector
  labels: { app.kubernetes.io/part-of: zasp }
  annotations: { eks.amazonaws.com/role-arn: {{ .Values.authorizationTemporal.projectorRoleArn | quote }} }
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: zasp-authorization-projector, labels: { app.kubernetes.io/name: zasp-authorization-projector, app.kubernetes.io/part-of: zasp } }
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 150
      ttlSecondsAfterFinished: 3600
      template:
        metadata: { labels: { app.kubernetes.io/name: zasp-authorization-projector, app.kubernetes.io/part-of: zasp } }
        spec:
          serviceAccountName: zasp-authorization-projector
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: projector
              image: {{ .Values.global.productImages.agentsecWorker | quote }}
              command: ["/app/zasp-authorization-reconcile"]
              args: ["--mode", "reconcile", "--limit", "20", "--timeout", "2m"]
              env:
                - { name: ZASP_ENVIRONMENT, value: {{ .Values.global.environment | quote }} }
                {{- include "zasp.runtimeServices.env" . | nindent 16 }}
                - name: ZASP_POSTGRES_DSN
                  valueFrom: { secretKeyRef: { name: {{ .Values.authorizationTemporal.projectorDSNSecret | quote }}, key: postgres-dsn } }
              securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
              volumeMounts:
                {{- include "zasp.runtimeServices.mount" . | nindent 16 }}
                - { name: projector-database-source, mountPath: /var/run/zasp-projector-source, readOnly: true }
          volumes:
            {{- include "zasp.runtimeServices.volume" . | nindent 12 }}
            - name: projector-database-source
              csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: zasp-authorization-projector } }
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: zasp-authorization-projector }
spec:
  provider: aws
  secretObjects:
    - secretName: {{ .Values.authorizationTemporal.projectorDSNSecret | quote }}
      type: Opaque
      data: [{ objectName: postgres-dsn, key: postgres-dsn }]
  parameters:
    region: {{ .Values.secrets.region | quote }}
    objects: |
      - objectName: {{ .Values.secrets.outboxPostgresDSNObjectName | quote }}
        objectType: secretsmanager
        objectAlias: postgres-dsn
        filePermission: "0440"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: zasp-temporal-provider-files }
spec:
  provider: aws
  parameters:
    region: {{ .Values.secrets.region | quote }}
    objects: |
      - objectName: {{ .Values.secrets.gatewaySigningPrivateKeyObjectName | quote }}
        objectType: secretsmanager
        objectAlias: gateway-signing-private-key
        filePermission: "0440"
      - objectName: {{ .Values.secrets.redTeamAdapterTokenObjectName | quote }}
        objectType: secretsmanager
        objectAlias: adapter-token
        filePermission: "0440"
      - objectName: {{ .Values.secrets.redTeamAdapterTLSCertificateObjectName | quote }}
        objectType: secretsmanager
        objectAlias: adapter-ca.crt
        filePermission: "0440"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: authorization-projector-database }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: zasp-authorization-projector } }
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: {{ .Values.network.postgresCIDR | quote }} } }]
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: temporal-worker-provider }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: agentsec-security-agent } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: agentsec-red-team-adapter } } }]
      ports: [{ protocol: TCP, port: 8443 }]
    {{- range .Values.network.redTeamEgressCIDRs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 443 }]
    {{- end }}
    {{- range .Values.network.s3CIDRs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 443 }]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: temporal-worker-adapter-ingress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: agentsec-red-team-adapter } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: agentsec-security-agent } } }]
      ports: [{ protocol: TCP, port: 8443 }]
{{- end }}
