{{- if ne .Values.profile "customer_edge" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.migration.name }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    eks.amazonaws.com/role-arn: {{ required "serviceAccounts.migration.roleArn is required" .Values.serviceAccounts.migration.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.migrationProviderClassName }}
  labels: { app.kubernetes.io/part-of: zasp }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider: aws
  secretObjects:
    - secretName: zasp-migration-secrets
      type: Opaque
      data: [{ objectName: postgres-dsn, key: ZASP_POSTGRES_DSN }]
  parameters:
    region: {{ .Values.secrets.region | quote }}
    objects: |
      - objectName: {{ required "secrets.migrationPostgresDSNObjectName is required" .Values.secrets.migrationPostgresDSNObjectName | quote }}
        objectType: secretsmanager
        objectAlias: postgres-dsn
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agentsec-schema-v{{ .Values.schema.expectedVersion }}
  labels: { app.kubernetes.io/name: agentsec-schema, app.kubernetes.io/part-of: zasp }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata: { labels: { app.kubernetes.io/name: agentsec-schema, app.kubernetes.io/part-of: zasp } }
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.migration.name }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ required "global.productImages.agentsecApi must be an immutable digest" .Values.global.productImages.agentsecApi | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args: ['export ZASP_POSTGRES_DSN="$(cat /var/run/secrets/zasp-migration/postgres-dsn)"; exec /app/agentsec-migrate up']
          env:
            - { name: ZASP_MIGRATION_TIMEOUT, value: {{ .Values.schema.migrationTimeout | quote }} }
            - { name: ZASP_MIGRATION_DB_PRINCIPAL, value: {{ required "databasePrincipals.migration is required" .Values.databasePrincipals.migration | quote }} }
            - { name: ZASP_DISCOVERY_API_DB_PRINCIPAL, value: {{ required "databasePrincipals.api is required" .Values.databasePrincipals.api | quote }} }
            - { name: ZASP_DISCOVERY_WORKER_DB_PRINCIPAL, value: {{ required "databasePrincipals.discoveryWorker is required" .Values.databasePrincipals.discoveryWorker | quote }} }
            - { name: ZASP_DISCOVERY_SCHEDULER_DB_PRINCIPAL, value: {{ required "databasePrincipals.discoveryScheduler is required" .Values.databasePrincipals.discoveryScheduler | quote }} }
            - { name: ZASP_PROJECTION_RISK_DB_PRINCIPAL, value: {{ required "databasePrincipals.projectionRisk is required" .Values.databasePrincipals.projectionRisk | quote }} }
            - { name: ZASP_PROJECTION_GRAPH_DB_PRINCIPAL, value: {{ required "databasePrincipals.projectionGraph is required" .Values.databasePrincipals.projectionGraph | quote }} }
            - { name: ZASP_PROJECTION_SEARCH_DB_PRINCIPAL, value: {{ required "databasePrincipals.projectionSearch is required" .Values.databasePrincipals.projectionSearch | quote }} }
            - { name: ZASP_RUNTIME_INGEST_DB_PRINCIPAL, value: {{ required "databasePrincipals.runtimeIngest is required" .Values.databasePrincipals.runtimeIngest | quote }} }
            - { name: ZASP_RUNTIME_WORKER_DB_PRINCIPAL, value: {{ required "databasePrincipals.runtimeWorker is required" .Values.databasePrincipals.runtimeWorker | quote }} }
            - { name: ZASP_OUTBOX_WORKER_DB_PRINCIPAL, value: {{ required "databasePrincipals.outboxWorker is required" .Values.databasePrincipals.outboxWorker | quote }} }
            - { name: ZASP_RUNTIME_GATEWAY_DB_PRINCIPAL, value: {{ required "databasePrincipals.runtimeGateway is required" .Values.databasePrincipals.runtimeGateway | quote }} }
          volumeMounts: [{ name: migration-secrets, mountPath: /var/run/secrets/zasp-migration, readOnly: true }]
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      volumes:
        - name: migration-secrets
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: {{ .Values.secrets.migrationProviderClassName | quote }} } }
{{- end }}
