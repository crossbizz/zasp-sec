{{- if ne .Values.profile "customer_edge" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agentsec-schema-v{{ .Values.schema.expectedVersion }}
  labels: { app.kubernetes.io/name: agentsec-schema, app.kubernetes.io/part-of: zasp }
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata: { labels: { app.kubernetes.io/name: agentsec-schema, app.kubernetes.io/part-of: zasp } }
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: {{ required "global.productImages.agentsecApi must be an immutable digest" .Values.global.productImages.agentsecApi | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/app/agentsec-migrate"]
          args: ["up"]
          env:
            - { name: ZASP_MIGRATION_TIMEOUT, value: {{ .Values.schema.migrationTimeout | quote }} }
            - name: ZASP_POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: zasp-runtime-secrets, key: ZASP_POSTGRES_DSN } }
          volumeMounts: [{ name: runtime-secrets, mountPath: /var/run/secrets/zasp, readOnly: true }]
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, privileged: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
      volumes:
        - name: runtime-secrets
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: {{ required "secrets.providerClassName is required" .Values.secrets.providerClassName | quote }} } }
{{- end }}
