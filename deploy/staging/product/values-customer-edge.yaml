profile: customer_edge
runtimeGateway:
  enabled: true
  controlPlaneURL: ""
  organizationID: ""
  workspaceID: ""
  environmentID: ""
  deviceID: ""
  credentialID: ""
  credentialSecretName: ""
  policyKeysSecretName: ""
  proxyClientTokenSecretName: ""
  proxyUpstreamURL: ""
  proxyAllowedCIDRs: []
  policyCache:
    maximumBytes: 67108864
    storageClassName: ""
sensorAgent:
  enabled: true
  sourceProfile: tetragon-local-stream-v2
  enrollmentBinding: ""
  tokenSecretName: ""
  stateHostPath: /var/lib/zasp-sensor-lineage
  # Runtime agent discovery: one host-network pod per node with CAP_NET_RAW
  # that joins DNS answers to Tetragon connection events and publishes, per
  # workload, which model APIs and remote MCP servers it called.
  egressDiscovery:
    enabled: false
    healthPort: 18083
    publishInterval: 5m0s
network:
  controlPlaneCIDRs: []
  kubernetesAPICIDRs: []
  nodeCIDRs: []
