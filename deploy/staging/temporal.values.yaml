# Official temporal chart 1.7.0. External DBs and certs must exist first.
server:
  image:
    tag: 1.32.0@sha256:c3e752127759616bb1615e0f9ba0e21635aeb5fdeb922de4f371c350955f46ae
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '2', memory: 2Gi }
  tls:
    internode:
      enabled: true
      secretName: temporal-internode-tls
      requireClientAuth: true
      serverName: temporal-internode.zasp-runtime.svc.cluster.local
    frontend:
      enabled: true
      secretName: temporal-frontend-tls
      requireClientAuth: true
      serverName: temporal-frontend.zasp-runtime.svc.cluster.local
  additionalVolumes:
    - name: database-ca
      secret: { secretName: runtime-database-ca }
  additionalVolumeMounts:
    - { name: database-ca, mountPath: /etc/database-ca, readOnly: true }
  config:
    logLevel: warn
    persistence:
      numHistoryShards: 128
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: false
            pluginName: postgres12
            databaseName: temporal
            connectAddr: temporal-db.internal:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-persistence
            secretKey: password
            maxConns: 10
            maxIdleConns: 5
            tls: { enabled: true, caFile: /etc/database-ca/ca.crt, enableHostVerification: true }
        visibility:
          sql:
            createDatabase: false
            manageSchema: false
            pluginName: postgres12
            databaseName: temporal_visibility
            connectAddr: temporal-visibility-db.internal:5432
            connectProtocol: tcp
            user: temporal_visibility
            existingSecret: temporal-visibility
            secretKey: password
            maxConns: 10
            maxIdleConns: 5
            tls: { enabled: true, caFile: /etc/database-ca/ca.crt, enableHostVerification: true }
    namespaces:
      create: true
      useExternalFrontend: true
      namespace: [{ name: zasp-staging, retention: 3d }]
  internal-frontend: { enabled: false }
admintools:
  enabled: false
  image:
    tag: 1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
web: { enabled: false }
schema:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: '1', memory: 512Mi }
