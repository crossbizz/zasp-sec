apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-services-ingress, namespace: zasp-runtime }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agentsec } }
          podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [agentsec-api, agentsec-discovery-scheduler, agentsec-discovery-worker, agentsec-red-team-worker, agentsec-security-agent, zasp-authorization-projector] }
      ports: [{ protocol: TCP, port: 7233 }, { protocol: TCP, port: 8080 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agentsec } }
          podSelector: { matchLabels: { app.kubernetes.io/name: agentsec-red-team-adapter } }
      ports: [{ protocol: TCP, port: 8080 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ protocol: TCP, port: 9090 }, { protocol: TCP, port: 2112 }]
