apiVersion: v1
kind: ServiceAccount
metadata: {name: zasp-cd, namespace: agentsec}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: zasp-helm-upgrade, namespace: agentsec}
rules:
  # Helm keeps its revision history in namespace-local Secrets.
  - apiGroups: [""]
    resources: [secrets, configmaps, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [secrets-store.csi.x-k8s.io]
    resources: [secretproviderclasses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, prometheusrules]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [vpcresources.k8s.aws]
    resources: [securitygrouppolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: zasp-helm-upgrade, namespace: agentsec}
subjects:
  - {kind: ServiceAccount, name: zasp-cd, namespace: agentsec}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zasp-helm-upgrade}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: agentsec-cd-read-installation}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system, agentsec]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: agentsec-cd-read-installation}
subjects:
  - {kind: ServiceAccount, name: zasp-cd, namespace: agentsec}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agentsec-cd-read-installation}
