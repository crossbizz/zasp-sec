apiVersion: v1
kind: ServiceAccount
metadata: {name: zasp-cd, namespace: zasp}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: zasp-helm-upgrade, namespace: zasp}
rules:
  # Helm keeps its revision history in namespace-local Secrets.
  - apiGroups: [""]
    resources: [secrets, configmaps, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [secrets-store.csi.x-k8s.io]
    resources: [secretproviderclasses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, prometheusrules]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [vpcresources.k8s.aws]
    resources: [securitygrouppolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: zasp-helm-upgrade, namespace: zasp}
subjects:
  - {kind: ServiceAccount, name: zasp-cd, namespace: zasp}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: zasp-helm-upgrade}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: agentsec-cd-read-installation}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system, zasp]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: agentsec-cd-read-installation}
subjects:
  - {kind: ServiceAccount, name: zasp-cd, namespace: zasp}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agentsec-cd-read-installation}
---
# Helm revision numbers are allocated as new Secrets. RBAC cannot restrict
# creates by name prefix. Apply this policy as the cluster operator alongside
# the Role before binding the runner to a shared application namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: agentsec-cd-release-isolation}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: ["*"]
        scope: Namespaced
  matchConditions:
    - name: product-deployer
      expression: "request.userInfo.username == 'system:serviceaccount:zasp:zasp-cd' && request.namespace == 'zasp'"
  validations:
    - expression: >-
        [object, oldObject].all(o, o == null || !has(o.metadata.annotations) || !('meta.helm.sh/release-name' in o.metadata.annotations) || o.metadata.annotations['meta.helm.sh/release-name'] != 'zasp')
      message: The production deployer cannot mutate evaluation-release resources.
    - expression: >-
        request.resource.group != '' || request.resource.resource != 'secrets' ||
        [object, oldObject].all(o, o == null || (o.metadata.name.matches('^sh[.]helm[.]release[.]v1[.]agentsec[.]v[0-9]+$') && has(o.metadata.labels) && 'owner' in o.metadata.labels && 'name' in o.metadata.labels && o.metadata.labels.owner == 'helm' && o.metadata.labels.name == 'agentsec'))
      message: The production deployer can write only agentsec Helm revision Secrets.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: agentsec-cd-release-isolation}
spec:
  policyName: agentsec-cd-release-isolation
  validationActions: [Deny]
