apiVersion: v1
kind: Service
metadata: {name: opensearch}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: opensearch}
  ports: [{name: https, protocol: TCP, port: 9200, targetPort: https}]
---
apiVersion: v1
kind: Service
metadata: {name: opensearch-headless}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: opensearch}
  ports: [{name: https, protocol: TCP, port: 9200, targetPort: https}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: opensearch}
spec:
  serviceName: opensearch-headless
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: opensearch}}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  template:
    metadata:
      labels: {app.kubernetes.io/name: opensearch}
      annotations:
        zasp.io/node-config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: opensearch
          image: {{ .Values.image | quote }}
          env:
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: {{ .Values.javaOpts | quote }}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {{ .Values.resources | toJson }}
          ports: [{name: https, containerPort: 9200, protocol: TCP}]
          startupProbe: {tcpSocket: {port: https}, periodSeconds: 3, failureThreshold: 100}
          readinessProbe: {tcpSocket: {port: https}, periodSeconds: 5}
          volumeMounts:
            - {name: data, mountPath: /usr/share/opensearch/data}
            - {name: node-config, mountPath: /usr/share/opensearch/config/opensearch.yml, subPath: opensearch.yml, readOnly: true}
            - {name: node-tls, mountPath: /usr/share/opensearch/config/tls, readOnly: true}
      volumes:
        - name: node-config
          configMap: {name: opensearch-node}
        - name: node-tls
          secret: {secretName: opensearch-node-tls, defaultMode: 288}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ required "storage.size is required" .Values.storage.size | quote }}}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-security-init
  annotations:
    helm.sh/hook: post-install,post-upgrade,post-rollback
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 360
  template:
    metadata: {labels: {app.kubernetes.io/name: opensearch-security-init}}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: security-admin
          image: {{ .Values.image | quote }}
          command: ["/bin/bash", "/usr/share/opensearch/plugins/opensearch-security/tools/securityadmin.sh"]
          args: ["-h", "opensearch.opensearch.svc.cluster.local", "-p", "9200", "-cn", "zasp-production-search", "-cacert", "/tls/ca.crt", "-cert", "/tls/tls.crt", "-key", "/tls/tls.key", "-cd", "/security"]
          env: [{name: JAVA_HOME, value: /usr/share/opensearch/jdk}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
          volumeMounts:
            - {name: admin-tls, mountPath: /tls, readOnly: true}
            - {name: security, mountPath: /security, readOnly: true}
      volumes:
        - name: admin-tls
          secret: {secretName: opensearch-security-admin-tls, defaultMode: 288}
        - name: security
          configMap: {name: opensearch-security-configuration}
