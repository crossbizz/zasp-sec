_meta: {type: config, config_version: 2}
config:
  dynamic:
    http: {anonymous_auth_enabled: false}
    authc:
      workload_certificates:
        description: Verified Zasp client certificates
        http_enabled: true
        transport_enabled: false
        order: 0
        http_authenticator:
          type: clientcert
          challenge: false
          config: {username_attribute: cn}
        authentication_backend: {type: noop}
