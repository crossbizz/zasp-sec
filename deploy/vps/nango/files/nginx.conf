worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/nango-tls/tls.crt;
    ssl_certificate_key /run/nango-tls/tls.key;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;

    # Public router prefixes in the pinned Nango image. The dashboard,
    # private API and internal control routes are available only to operators.
    server {
        listen 8443 ssl;
        location ~ ^/(ready|health|action|api-auth|app-auth|app-store-auth|auth|config|connect|connection|connections|environment-variables|integrations|mcp|oauth|oauth2|providers|proxy|records|remote-function|scripts|sync|v1|webhook)(/|$) {
            proxy_pass http://127.0.0.1:3003;
        }
        location / { return 404; }
    }

    # kubectl forwards to loopback inside the pod. Only configured dashboard
    # clients need a pod-network listener and Service port.
    server {
        listen {{ if not .Values.dashboard.clients }}127.0.0.1:{{ end }}9443 ssl;
        if ($http_host != "{{ include "nango.dashboardHost" . }}:18443") { return 421; }
        location = /env.js {
            proxy_pass http://127.0.0.1:3003;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Accept-Encoding "";
            # Nango uses NANGO_SERVER_URL for both Console XHR and the default
            # OAuth redirect. Only the Console XHR is local to this dashboard.
            sub_filter_types text/javascript;
            sub_filter '"apiUrl": "{{ .Values.publicOrigin }}/api/v1/integrations"' '"apiUrl": "{{ include "nango.dashboardURL" . }}"';
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store";
        }
        location / {
            proxy_pass http://127.0.0.1:3003;
        }
    }
}
