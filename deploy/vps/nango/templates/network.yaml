apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nango-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: nango-migrate } }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "nango.dbEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: nango }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: nango } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.clients }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .namespace | quote }} } }
          podSelector:
            matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: {{ .workloads | toJson }} }]
        {{- end }}
      ports: [{ protocol: TCP, port: 8443 }]
  egress:
    {{- include "nango.dbEgress" . | nindent 4 }}
    - to:
        {{- range .Values.providerEgressCIDRs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports: [{ protocol: TCP, port: 443 }]
