    RuntimeSessionPage: { type: object, additionalProperties: false, required: [items, page_info], properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/RuntimeSession' } }, page_info: { $ref: '#/components/schemas/PageInfo' }, search: { $ref: '#/components/schemas/RuntimeSessionSearchStatus' } } }
    RuntimeSessionEventPage: { type: object, additionalProperties: false, required: [items, page_info], properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/RuntimeSessionEvent' } }, page_info: { $ref: '#/components/schemas/PageInfo' } } }
