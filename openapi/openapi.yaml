      properties:
        principal_id: { type: string, minLength: 1, maxLength: 128 }
        agent_id: { type: string, minLength: 1, maxLength: 128 }
        session_id: { type: string, minLength: 1, maxLength: 128 }
        action: { type: string, minLength: 1, maxLength: 64 }
        resource: { type: string, minLength: 1, maxLength: 256 }
        environment_id: { type: string, minLength: 1, maxLength: 128 }
        metadata: { type: object, maxProperties: 32, additionalProperties: { type: string, minLength: 1, maxLength: 256 } }
    PolicySimulationInput:
      type: object
      additionalProperties: false
      maxProperties: 0
    PolicySimulation:
      type: object
      additionalProperties: false
      required: [matches, would_block, example_session_ids]
      properties:
        matches: { type: integer, minimum: 0, maximum: 100 }
        would_block: { type: integer, minimum: 0, maximum: 100 }
        example_session_ids: { type: array, maxItems: 5, items: { type: string, minLength: 1, maxLength: 128 } }
    PolicyRolloutInput:
      type: object
      additionalProperties: false
      required: [state, target_id]
      properties:
        state: { type: string, enum: [monitor, enforced] }
        target_id: { type: string, minLength: 1, maxLength: 128 }
    PolicyRollout:
      type: object
      additionalProperties: false
      required: [policy_id, state, target_id]
      properties:
        policy_id: { $ref: '#/components/schemas/PolicyID' }
        state: { type: string, enum: [draft, monitor, enforced, disabled] }
        target_id: { type: string, minLength: 1, maxLength: 128 }
    RuntimeDecision:
      type: object
      additionalProperties: false
      required: [id, policy_id, environment_id, result, correlation_id, at]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        policy_id: { $ref: '#/components/schemas/PolicyID' }
        environment_id: { type: string, minLength: 1, maxLength: 128 }
        result: { type: string, enum: [allow, monitor, block] }
        correlation_id: { type: string, minLength: 1, maxLength: 128 }
        at: { type: string, format: date-time }
    RuntimeDecisionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/RuntimeDecision' } }
    FindingSeverity:
      type: string
      enum: [critical, high, medium, low]
    RiskFactor:
      type: object
      additionalProperties: false
      required: [name, evidence_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        evidence_id: { $ref: '#/components/schemas/ProductID' }
    Finding:
      type: object
      additionalProperties: false
      required: [id, source, title, severity, status, evidence_ids, risk_factors, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        source: { type: string, enum: [posture, prowler] }
        rule: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 256 }
        severity: { $ref: '#/components/schemas/FindingSeverity' }
        status: { $ref: '#/components/schemas/FindingStatus' }
        agent_id: { $ref: '#/components/schemas/ProductID' }
        path_id: { $ref: '#/components/schemas/ProductID' }
        compliance_context: { type: string, minLength: 1, maxLength: 128 }
        evidence_ids: { type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
        risk_factors: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/RiskFactor' } }
        acceptance_reason: { type: string, minLength: 1, maxLength: 512 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FindingPage:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Finding' } }
