        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
security:
  - BrowserSession: []
    BrowserExpectedScope: []
  - ProductAPIToken: []
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-zasp_session
      description: Secure, HttpOnly, SameSite=Lax host-only human browser session.
    BrowserExpectedScope:
      type: apiKey
      in: header
      name: X-Zasp-Expected-Scope
      description: Exact canonical organization/workspace/environment scope captured by the browser before a scoped request. The server compares it with the authenticated session scope before data access; ProductAPIToken scope remains token-owned.
    ProductAPIToken:
      type: http
      scheme: bearer
      bearerFormat: ProductAPIToken
      description: Product automation token.
  headers:
    WorkflowETag:
      description: Quoted durable resource version for optimistic concurrency.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    WorkflowAuditID:
      description: Durable audit record identifier for this mutation or its exact replay.
      schema: { $ref: '#/components/schemas/ProductID' }
    WorkflowMutationReceiptID:
      description: BrowserSession-only durable recovery receipt bound to the exact authenticated principal, scope, operation, intent, and attempt key. This header is absent for ProductAPIToken mutations and replays.
      schema: { $ref: '#/components/schemas/ProductID' }
    RetryAfter:
      description: Minimum whole seconds before retrying an accepted asynchronous mutation.
      schema: { type: string, pattern: '^[1-9][0-9]{0,2}$' }
  parameters:
    ComplianceFramework: { name: framework, in: query, schema: { type: string, enum: [soc2_security, hipaa] } }
    ComplianceControlFilter: { name: control_id, in: query, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^(soc2_security|hipaa)-(audit|findings|policies|tests|configuration)$' } }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Short-lived CSRF value bound to the authenticated browser session. Mutations also require an exact same-origin Origin header.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    BrowserMutationCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for BrowserSession mutations and omitted for ProductAPIToken mutations. The value is bound to the authenticated browser session.
      schema: { type: string, minLength: 32, maxLength: 256 }
    BrowserMutationOrigin:
      name: Origin
      in: header
      required: false
      description: Required for BrowserSession mutations and omitted for ProductAPIToken mutations. The server requires the exact configured same-origin HTTPS origin.
      schema: { type: string, minLength: 9, maxLength: 2048, pattern: '^https://[^/?#]+$' }
    SensorEnrollmentSchema:
      name: X-Zasp-Sensor-Enrollment-Schema
      in: header
      required: false
      description: Select enrollment-binding-v1 to require a scoped installation binding in a successful one-time credential response. Omission preserves the legacy representation. This is not authentication or mutation intent.
      schema: { type: string, const: enrollment-binding-v1 }
    FreshAuth:
      name: X-Zasp-Fresh-Auth
      in: header
      required: true
      description: Explicit fresh-auth confirmation required for a sensitive approval or connector authorization mutation.
      schema: { type: string, const: confirmed }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key binding an exact workflow mutation and its durable response.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
    CompliancePageCursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ComplianceCursor'
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the preceding page.
      schema:
        $ref: '#/components/schemas/Cursor'
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ResourceVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted current durable resource version.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    ControlVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted current execution-control version, including quoted zero before the first tenant override.
      schema: { type: string, pattern: '^"(?:0|[1-9][0-9]*)"$' }
    ScheduleVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted current schedule version, or quoted zero when creating the singleton schedule.
      schema: { type: string, pattern: '^"(?:0|[1-9][0-9]*)"$' }
  schemas:
    RecoveryBackupInput:
      type: object
      additionalProperties: false
      required: [backup_id, retention_days]
      properties:
        backup_id: { $ref: '#/components/schemas/ProductID' }
        retention_days: { type: integer, minimum: 7, maximum: 90 }
    RecoveryRestoreInput:
      type: object
      additionalProperties: false
      required: [restore_id, target_environment, manifest]
      properties:
        restore_id: { $ref: '#/components/schemas/ProductID' }
        target_environment: { $ref: '#/components/schemas/RecoveryTargetEnvironment' }
        manifest: { $ref: '#/components/schemas/RecoveryManifestLocator' }
    RecoveryTargetEnvironment:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
      not: { const: production }
    RecoveryArtifactLocator:
      type: object
      additionalProperties: false
      required: [reference, version_id, sha256, size_bytes, media_type, schema]
      properties:
        reference: { type: string, minLength: 32, maxLength: 2048, pattern: '^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/organizations/pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/workspaces/pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/environments/pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/artifacts/pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        version_id: { type: string, minLength: 1, maxLength: 1024, pattern: '^[A-Za-z0-9._~+/=-]+$' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, minimum: 1, maximum: 67108864 }
        media_type: { type: string, minLength: 3, maxLength: 193, pattern: '^[a-z0-9][a-z0-9.+-]{0,63}/[a-z0-9][a-z0-9.+-]{0,127}$' }
        schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z][a-z0-9_]{0,63}$' }
    RecoveryManifestLocator:
      type: object
      additionalProperties: false
      required: [reference, version_id, sha256, size_bytes, media_type, schema, signing_key_id, signature]
      properties:
        reference: { type: string, minLength: 32, maxLength: 2048, pattern: '^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/organizations/pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/workspaces/pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/environments/pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/artifacts/pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        version_id: { type: string, minLength: 1, maxLength: 1024, pattern: '^[A-Za-z0-9._~+/=-]+$' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, minimum: 1, maximum: 67108864 }
        media_type: { type: string, const: application/vnd.zasp.recovery-manifest+json }
        schema: { type: string, const: recovery_signed_manifest_v1 }
        signing_key_id: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        signature: { type: string, minLength: 43, maxLength: 684, pattern: '^[A-Za-z0-9+/]+$' }
    RecoveryCounts:
      type: object
      additionalProperties: false
      required: [assets, findings, policies]
      properties:
        assets: { type: integer, minimum: 0, maximum: 1000000000 }
        findings: { type: integer, minimum: 0, maximum: 1000000000 }
        policies: { type: integer, minimum: 0, maximum: 1000000000 }
    RecoveryValidationEvidence:
      type: object
      additionalProperties: false
      required: [state, expected_counts, observed_counts, evidence]
      properties:
        state: { type: string, const: validated }
        expected_counts: { $ref: '#/components/schemas/RecoveryCounts' }
        observed_counts: { $ref: '#/components/schemas/RecoveryCounts' }
        evidence: { $ref: '#/components/schemas/RecoveryArtifactLocator' }
    RecoveryCleanupEvidence:
      type: object
      additionalProperties: false
      required: [state, evidence]
      properties:
        state: { type: string, enum: [deleted, failed] }
        evidence: { $ref: '#/components/schemas/RecoveryArtifactLocator' }
    RecoveryErrorCode:
      type: string
      enum: [dependency_unavailable, outcome_unknown, signature_invalid, manifest_invalid, manifest_expired, validation_failed, projection_mismatch, cleanup_failed, exhausted, lease_lost, cancelled]
    RecoveryBackup:
      type: object
      additionalProperties: false
      required: [id, version, state, retention_days, attempt, created_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        version: { type: integer, minimum: 1, maximum: 1000000 }
        state: { type: string, enum: [queued, draining, capturing, publishing, succeeded, retryable, failed] }
        retention_days: { type: integer, minimum: 7, maximum: 90 }
        attempt: { type: integer, minimum: 0, maximum: 100 }
        manifest: { $ref: '#/components/schemas/RecoveryManifestLocator' }
        error_code: { $ref: '#/components/schemas/RecoveryErrorCode' }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    RecoveryRestore:
      type: object
      additionalProperties: false
      required: [id, version, state, target_environment, attempt, manifest, created_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        version: { type: integer, minimum: 1, maximum: 1000000 }
        state: { type: string, enum: [queued, verifying, provisioning, validating, rebuilding, cleanup_required, cleaning, succeeded, retryable, failed, failed_cleanup] }
        target_environment: { $ref: '#/components/schemas/RecoveryTargetEnvironment' }
        attempt: { type: integer, minimum: 0, maximum: 100 }
        manifest: { $ref: '#/components/schemas/RecoveryManifestLocator' }
        observed_counts: { $ref: '#/components/schemas/RecoveryCounts' }
        validation_evidence: { $ref: '#/components/schemas/RecoveryValidationEvidence' }
        cleanup_evidence: { $ref: '#/components/schemas/RecoveryCleanupEvidence' }
        error_code: { $ref: '#/components/schemas/RecoveryErrorCode' }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    WorkflowMutationReceipt:
      oneOf:
        - { $ref: '#/components/schemas/StandardWorkflowMutationReceipt' }
        - { $ref: '#/components/schemas/OAuthCompletionWorkflowMutationReceipt' }
        - { $ref: '#/components/schemas/ReferenceAuthorizationWorkflowMutationReceipt' }
        - { $ref: '#/components/schemas/SyncIntegrationWorkflowMutationReceipt' }
        - { $ref: '#/components/schemas/PutIntegrationScheduleWorkflowMutationReceipt' }
        - { $ref: '#/components/schemas/DeleteIntegrationScheduleWorkflowMutationReceipt' }
    StandardWorkflowMutationReceipt:
      type: object
      additionalProperties: false
      required: [id, operation, idempotency_key, intent, result, resource_kind, resource_id, resource_version, audit_id, correlation_id, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        operation: { type: string, enum: [createPolicy, updatePolicy, deletePolicy, rolloutPolicy, disablePolicy, createIntegration, updateIntegration, deleteIntegration, remediateIntegrationAuthorization, createSecurityAgent, updateSecurityAgent, deleteSecurityAgent, updateFinding, acceptFindingRisk] }
        idempotency_key: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        intent: { $ref: '#/components/schemas/WorkflowMutationIntent' }
        result:
          oneOf:
            - { $ref: '#/components/schemas/Policy' }
            - { $ref: '#/components/schemas/Integration' }
            - { $ref: '#/components/schemas/IntegrationDeletionReceiptResult' }
            - { $ref: '#/components/schemas/SecurityAgentDefinition' }
            - { $ref: '#/components/schemas/Finding' }
        resource_kind: { type: string, enum: [policy, integration, security_agent, finding] }
        resource_id: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: integer, minimum: 1 }
        audit_id: { $ref: '#/components/schemas/ProductID' }
        correlation_id: { $ref: '#/components/schemas/ProductID' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    OAuthCompletionWorkflowMutationReceipt:
      type: object
      additionalProperties: false
      required: [id, operation, idempotency_key, intent, result, resource_kind, resource_id, resource_version, audit_id, correlation_id, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        operation: { type: string, const: completeIntegrationOAuth }
        idempotency_key: { type: string, minLength: 16, maxLength: 128, pattern: '^oauth-completion:pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        intent: { $ref: '#/components/schemas/OAuthCompletionReceiptIntent' }
        result: { $ref: '#/components/schemas/Integration' }
        resource_kind: { type: string, const: integration }
        resource_id: { $ref: '#/components/schemas/ProductID' }
        resource_version: { type: integer, minimum: 1 }
        audit_id: { $ref: '#/components/schemas/ProductID' }
        correlation_id: { $ref: '#/components/schemas/ProductID' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    ReferenceAuthorizationWorkflowMutationReceipt:
      type: object
      additionalProperties: false
      required: [id, operation, idempotency_key, intent, result, resource_kind, resource_id, resource_version, audit_id, correlation_id, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        operation: { type: string, const: completeIntegrationReferenceAuthorization }
        idempotency_key: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        intent: { $ref: '#/components/schemas/ReferenceAuthorizationReceiptIntent' }
        result: { $ref: '#/components/schemas/Integration' }
        resource_kind: { type: string, const: integration }
        resource_id: { $ref: '#/components/schemas/ProductID' }
        resource_version: { type: integer, minimum: 1 }
        audit_id: { $ref: '#/components/schemas/ProductID' }
        correlation_id: { $ref: '#/components/schemas/ProductID' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    SyncIntegrationWorkflowMutationReceipt:
      type: object
      additionalProperties: false
      required: [id, operation, idempotency_key, intent, result, resource_kind, resource_id, resource_version, audit_id, correlation_id, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        operation: { type: string, const: syncIntegration }
        idempotency_key: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        intent: { $ref: '#/components/schemas/SyncIntegrationReceiptIntent' }
        result: { $ref: '#/components/schemas/IntegrationSync' }
        resource_kind: { type: string, const: integration_sync }
        resource_id: { $ref: '#/components/schemas/ProductID' }
        resource_version: { type: integer, minimum: 1 }
        audit_id: { $ref: '#/components/schemas/ProductID' }
        correlation_id: { $ref: '#/components/schemas/ProductID' }
        created_at: { type: string, format: date-time }
