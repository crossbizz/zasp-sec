      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SCIMConnection'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    ConnectionDeletion:
      type: object
      additionalProperties: false
      required: [id, audit_correlation_id]
      properties:
        id:
          type: string
          minLength: 18
          maxLength: 128
        audit_correlation_id:
