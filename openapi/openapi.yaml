        - $ref: '#/components/parameters/BrowserMutationOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceVersion'
      responses:
        '200': { description: Cancelled or cancellation-requested run., headers: { ETag: { $ref: '#/components/headers/WorkflowETag' }, X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }, X-Mutation-Receipt-ID: { $ref: '#/components/headers/WorkflowMutationReceiptID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AttackLabRun' } } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
