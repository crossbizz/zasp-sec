security:
  - BrowserSession: []
  - ProductAPIToken: []
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-zasp_session
      description: Secure, HttpOnly, SameSite=Lax host-only human browser session.
    ProductAPIToken:
      type: http
      scheme: bearer
      bearerFormat: ProductAPIToken
      description: Product automation token.
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Short-lived CSRF value bound to the authenticated browser session. Mutations also require an exact same-origin Origin header.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the preceding page.
      schema:
        $ref: '#/components/schemas/Cursor'
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  schemas:
    SessionCallbackInput:
      type: object
      additionalProperties: false
      required: [authorization_code, state]
      properties:
        authorization_code: { type: string, minLength: 1, maxLength: 4096 }
        state: { type: string, minLength: 32, maxLength: 512 }
    SessionBootstrap:
      type: object
      additionalProperties: false
      required: [principal, organization_id, workspace_id, environment_id, permissions, capabilities, csrf_token, correlation_id]
      properties:
        principal: { $ref: '#/components/schemas/Principal' }
        organization_id: { $ref: '#/components/schemas/ProductID' }
        workspace_id: { $ref: '#/components/schemas/ProductID' }
        environment_id: { $ref: '#/components/schemas/ProductID' }
        permissions: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Permission' } }
        capabilities: { type: array, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
        csrf_token: { type: string, minLength: 32, maxLength: 256 }
        correlation_id: { $ref: '#/components/schemas/ProductID' }
    SecurityAgentRunState: { type: string, enum: [queued, planning, waiting_approval, running, verifying, contained, remediated, needs_human, failed, inconclusive, cancelled] }
    SecurityAgentTemplate:
      type: object
      additionalProperties: false
      required: [id, name, version, trigger_kind, default_actions, verification_condition]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 256 }
        version: { type: integer, minimum: 1 }
        trigger_kind: { type: string, enum: [finding, attack_path, runtime_decision] }
        default_actions: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
        verification_condition: { type: string, minLength: 1, maxLength: 256 }
    SecurityAgentTemplatePage: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SecurityAgentTemplate' } } } }
    SecurityAction:
      type: object
      additionalProperties: false
      required: [key, risk_class, target_types, approval_floor, reversible, verification_kind]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        risk_class: { type: string, enum: [low, moderate, containment, destructive] }
        target_types: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 64 } }
        approval_floor: { type: string, enum: [none, operator, admin] }
        reversible: { type: boolean }
        verification_kind: { type: string, minLength: 1, maxLength: 64 }
    SecurityActionPage: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SecurityAction' } } } }
    SecurityAgentDefinition:
      type: object
      additionalProperties: false
      required: [id, name, trigger_kind, trigger_source, environment_ids, autonomy, max_steps, max_duration_seconds, temporary_policy_seconds, ai_token_budget, concurrency_limit, allowed_actions, verification_kind, definition_version, enabled]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 256 }
        trigger_kind: { type: string, enum: [finding, attack_path, runtime_decision] }
        trigger_source: { type: string, minLength: 1, maxLength: 64 }
        environment_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
        autonomy: { type: string, enum: [supervised, autonomous] }
        max_steps: { type: integer, minimum: 1, maximum: 100 }
        max_duration_seconds: { type: integer, minimum: 1, maximum: 86400 }
        temporary_policy_seconds: { type: integer, minimum: 1, maximum: 86400 }
        ai_token_budget: { type: integer, minimum: 1, maximum: 12000 }
        concurrency_limit: { type: integer, minimum: 1, maximum: 10 }
        allowed_actions: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
        verification_kind: { type: string, minLength: 1, maxLength: 64 }
        definition_version: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    SecurityAgentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SecurityAgentDefinition' } }
        next_cursor: { type: string, maxLength: 128 }
    SecurityAgentSimulationInput:
      type: object
      additionalProperties: false
      required: [goal, environment_id, evidence_ids]
      properties:
        goal: { type: string, minLength: 1, maxLength: 1024 }
        environment_id: { $ref: '#/components/schemas/ProductID' }
        evidence_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
    SecurityAgentSimulationStep:
      type: object
      additionalProperties: false
      required: [index, action, authorization, approval_required]
      properties:
        index: { type: integer, minimum: 0, maximum: 99 }
        action: { type: string, minLength: 1, maxLength: 128 }
        authorization: { type: string, enum: [allow, approval_required, deny] }
        approval_required: { type: boolean }
    SecurityAgentSimulation:
      type: object
      additionalProperties: false
      required: [matched_evidence_ids, summary, steps, side_effects]
      properties:
        matched_evidence_ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/ProductID' } }
        summary: { type: string, minLength: 1, maxLength: 500 }
        steps: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/SecurityAgentSimulationStep' } }
        side_effects: { type: integer, const: 0 }
    SecurityAgentManualRunInput:
      type: object
      additionalProperties: false
      required: [environment_id, trigger_kind, trigger_id]
      properties:
        environment_id: { $ref: '#/components/schemas/ProductID' }
        trigger_kind: { type: string, enum: [finding, attack_path, session] }
        trigger_id: { $ref: '#/components/schemas/ProductID' }
    SecurityAgentRun:
      type: object
      additionalProperties: false
      required: [id, agent_id, state, evidence_ids, definition_version, version]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        agent_id: { $ref: '#/components/schemas/ProductID' }
        state: { $ref: '#/components/schemas/SecurityAgentRunState' }
        evidence_ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/ProductID' } }
        definition_version: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
    SecurityAgentRunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SecurityAgentRun' } }
        next_cursor: { type: string, maxLength: 128 }
    SecurityAgentRunDetail:
      type: object
      additionalProperties: false
      required: [run, evidence_ids, plan, authorization, approvals, execution, verification]
      properties:
        run: { $ref: '#/components/schemas/SecurityAgentRun' }
        evidence_ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/ProductID' } }
        plan: { type: object }
        authorization: { type: string, minLength: 1, maxLength: 64 }
        approvals: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SecurityAgentApproval' } }
        execution: { type: array, maxItems: 100, items: { type: object } }
        verification: { type: string, minLength: 1, maxLength: 64 }
    SecurityAgentApproval:
      type: object
      additionalProperties: false
      required: [id, run_id, step_id, state, expires_at, version]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        run_id: { $ref: '#/components/schemas/ProductID' }
        step_id: { $ref: '#/components/schemas/ProductID' }
        state: { type: string, enum: [pending, approved, rejected, cancelled] }
        expires_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        expected_effect: { type: string, maxLength: 128 }
        reversible: { type: boolean }
        ttl_seconds: { type: integer, minimum: 0, maximum: 86400 }
        evidence_summary: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ProductID' } }
    SecurityAgentApprovalPage: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SecurityAgentApproval' } } } }
    SecurityAgentApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected, cancelled] }
    SessionID: { type: string, minLength: 9, maxLength: 128, pattern: '^session-[a-z0-9][a-z0-9-]*$' }
    ComplianceExportID: { type: string, minLength: 8, maxLength: 128, pattern: '^export-[a-z0-9][a-z0-9-]*$' }
    SessionEvent:
      type: object
      additionalProperties: false
      required: [id, session_id, class, label, evidence_id, source, confidence, at]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        session_id: { $ref: '#/components/schemas/SessionID' }
        class: { type: string, enum: [tool, runtime, network, file, credential, policy] }
        label: { type: string, minLength: 1, maxLength: 256 }
