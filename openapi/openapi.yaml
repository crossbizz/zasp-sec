      required: [identity, status, note, version, updated_by, updated_at, server_count]
      properties:
        identity: { type: string, minLength: 3, maxLength: 512 }
        status: { type: string, enum: [approved, blocked, unapproved], description: 'unapproved is returned only for a decision that was just removed.' }
        note: { type: string, maxLength: 512 }
        version: { type: integer, minimum: 0, maximum: 1000000 }
        updated_by: { $ref: '#/components/schemas/ProductID' }
        updated_at: { type: string, format: date-time }
