security:
  - BrowserSession: []
    BrowserExpectedScope: []
  - ProductAPIToken: []
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-zasp_session
      description: Secure, HttpOnly, SameSite=Lax host-only human browser session.
    BrowserExpectedScope:
      type: apiKey
      in: header
      name: X-Zasp-Expected-Scope
      description: Exact canonical organization/workspace/environment scope captured by the browser before a scoped request. The server compares it with the authenticated session scope before data access; ProductAPIToken scope remains token-owned.
    ProductAPIToken:
      type: http
      scheme: bearer
      bearerFormat: ProductAPIToken
      description: Product automation token.
  headers:
    WorkflowETag:
      description: Quoted durable resource version for optimistic concurrency.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    WorkflowAuditID:
      description: Durable audit record identifier for this mutation or its exact replay.
      schema: { $ref: '#/components/schemas/ProductID' }
    WorkflowMutationReceiptID:
      description: BrowserSession-only durable recovery receipt bound to the exact authenticated principal, scope, operation, intent, and attempt key. This header is absent for ProductAPIToken mutations and replays.
      schema: { $ref: '#/components/schemas/ProductID' }
    RetryAfter:
      description: Minimum whole seconds before retrying an accepted asynchronous mutation.
      schema: { type: string, pattern: '^[1-9][0-9]{0,2}$' }
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Short-lived CSRF value bound to the authenticated browser session. Mutations also require an exact same-origin Origin header.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    FreshAuth:
      name: X-Zasp-Fresh-Auth
      in: header
      required: true
      description: Explicit fresh-auth confirmation required for an approval decision.
      schema: { type: string, const: confirmed }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key binding an exact workflow mutation and its durable response.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the preceding page.
      schema:
        $ref: '#/components/schemas/Cursor'
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ResourceVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted current durable resource version.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  schemas:
    WorkflowMutationReceipt:
      type: object
      additionalProperties: false
      required: [id, operation, idempotency_key, intent, result, resource_kind, resource_id, resource_version, audit_id, correlation_id, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        operation: { type: string, enum: [createPolicy, updatePolicy, deletePolicy, rolloutPolicy, disablePolicy, createIntegration, updateIntegration, deleteIntegration, remediateIntegrationAuthorization, completeIntegrationReferenceAuthorization, createSecurityAgent, updateSecurityAgent, deleteSecurityAgent, updateFinding, acceptFindingRisk] }
        idempotency_key: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        intent: { $ref: '#/components/schemas/WorkflowMutationIntent' }
        result:
          oneOf:
            - { $ref: '#/components/schemas/Policy' }
            - { $ref: '#/components/schemas/Integration' }
            - { $ref: '#/components/schemas/SecurityAgentDefinition' }
            - { $ref: '#/components/schemas/Finding' }
        resource_kind: { type: string, enum: [policy, integration, security_agent, finding] }
        resource_id: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: integer, minimum: 1 }
        audit_id: { $ref: '#/components/schemas/ProductID' }
        correlation_id: { $ref: '#/components/schemas/ProductID' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    WorkflowMutationIntent:
      type: object
      additionalProperties: false
      required: [resource_id, expected_version, body]
      properties:
        resource_id: { type: string, minLength: 0, maxLength: 128 }
        expected_version: { type: integer, minimum: 0 }
        body:
          oneOf:
            - { $ref: '#/components/schemas/Policy' }
            - { $ref: '#/components/schemas/PolicyRolloutInput' }
            - { $ref: '#/components/schemas/EmptyInput' }
            - { $ref: '#/components/schemas/IntegrationInput' }
            - { $ref: '#/components/schemas/IntegrationUpdateInput' }
            - { $ref: '#/components/schemas/IntegrationAuthorizationRemediationInput' }
            - { $ref: '#/components/schemas/SecurityAgentInput' }
            - { $ref: '#/components/schemas/SecurityAgentDefinition' }
            - { $ref: '#/components/schemas/FindingUpdateInput' }
            - { $ref: '#/components/schemas/FindingAcceptanceInput' }
    WorkflowMutationReceiptPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/WorkflowMutationReceipt' } }
    SessionCallbackInput:
      type: object
      additionalProperties: false
      required: [provider_token, state]
      properties:
        provider_token: { type: string, minLength: 1, maxLength: 4096 }
        state: { type: string, minLength: 32, maxLength: 512 }
    SessionCallbackResult:
      type: object
      additionalProperties: false
      required: [return_to]
      properties:
        return_to: { type: string, minLength: 1, maxLength: 2048, pattern: '^/(?!/)' }
    SessionBootstrap:
      type: object
      additionalProperties: false
      required: [principal, organization_id, workspace_id, environment_id, permissions, capabilities, csrf_token, fresh_auth_expires_at, correlation_id]
      properties:
        principal: { $ref: '#/components/schemas/Principal' }
        organization_id: { $ref: '#/components/schemas/ProductID' }
        workspace_id: { $ref: '#/components/schemas/ProductID' }
        environment_id: { $ref: '#/components/schemas/ProductID' }
        permissions: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Permission' } }
        capabilities: { type: array, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
        csrf_token: { type: string, minLength: 32, maxLength: 256 }
        fresh_auth_expires_at: { type: string, format: date-time }
        correlation_id: { $ref: '#/components/schemas/ProductID' }
    SessionScope:
      type: object
      additionalProperties: false
      required: [organization_id, workspace_id, environment_id, label]
      properties:
        organization_id: { $ref: '#/components/schemas/ProductID' }
        workspace_id: { $ref: '#/components/schemas/ProductID' }
        environment_id: { $ref: '#/components/schemas/ProductID' }
        label: { type: string, minLength: 1, maxLength: 128 }
    SessionScopePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SessionScope' } }
    SessionScopeSwitchInput:
      type: object
      additionalProperties: false
      required: [workspace_id, environment_id]
      properties:
        workspace_id: { $ref: '#/components/schemas/ProductID' }
        environment_id: { $ref: '#/components/schemas/ProductID' }
    SecurityAgentRunState: { type: string, enum: [queued, planning, waiting_approval, running, verifying, contained, remediated, needs_human, failed, inconclusive, cancelled] }
    SecurityAgentTemplate:
      type: object
      additionalProperties: false
      required: [id, name, version, trigger_kind, default_actions, verification_condition]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 256 }
        version: { type: integer, minimum: 1 }
        trigger_kind: { type: string, enum: [finding, attack_path, runtime_decision] }
        default_actions: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
        verification_condition: { type: string, minLength: 1, maxLength: 256 }
    SecurityAgentTemplatePage: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SecurityAgentTemplate' } } } }
    SecurityAction:
      type: object
      additionalProperties: false
      required: [key, risk_class, target_types, approval_floor, reversible, verification_kind]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        risk_class: { type: string, enum: [low, moderate, containment, destructive] }
        target_types: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 64 } }
        approval_floor: { type: string, enum: [none, operator, admin] }
        reversible: { type: boolean }
        verification_kind: { type: string, minLength: 1, maxLength: 64 }
    SecurityActionPage: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SecurityAction' } } } }
    SecurityAgentDefinition:
      type: object
      additionalProperties: false
      required: [id, name, trigger_kind, trigger_source, environment_ids, autonomy, max_steps, max_duration_seconds, temporary_policy_seconds, ai_token_budget, concurrency_limit, allowed_actions, verification_kind, definition_version, enabled]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 256 }
        trigger_kind: { type: string, enum: [finding, attack_path, runtime_decision] }
        trigger_source: { type: string, minLength: 1, maxLength: 64 }
        environment_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
        autonomy: { type: string, enum: [supervised, autonomous] }
        max_steps: { type: integer, minimum: 1, maximum: 100 }
        max_duration_seconds: { type: integer, minimum: 1, maximum: 86400 }
        temporary_policy_seconds: { type: integer, minimum: 1, maximum: 86400 }
        ai_token_budget: { type: integer, minimum: 1, maximum: 12000 }
        concurrency_limit: { type: integer, minimum: 1, maximum: 10 }
        allowed_actions: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
        verification_kind: { type: string, minLength: 1, maxLength: 64 }
        definition_version: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    SecurityAgentInput:
      type: object
      additionalProperties: false
      required: [name, trigger_kind, trigger_source, environment_ids, autonomy, max_steps, max_duration_seconds, temporary_policy_seconds, ai_token_budget, concurrency_limit, allowed_actions, verification_kind, definition_version, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        trigger_kind: { type: string, enum: [finding, attack_path, runtime_decision] }
        trigger_source: { type: string, minLength: 1, maxLength: 64 }
        environment_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
        autonomy: { type: string, enum: [supervised, autonomous] }
        max_steps: { type: integer, minimum: 1, maximum: 100 }
        max_duration_seconds: { type: integer, minimum: 1, maximum: 86400 }
        temporary_policy_seconds: { type: integer, minimum: 1, maximum: 86400 }
        ai_token_budget: { type: integer, minimum: 1, maximum: 12000 }
        concurrency_limit: { type: integer, minimum: 1, maximum: 10 }
        allowed_actions: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
        verification_kind: { type: string, minLength: 1, maxLength: 64 }
        definition_version: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    SecurityAgentPage:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SecurityAgentDefinition' } }
        page_info: { $ref: '#/components/schemas/PageInfo' }
    SecurityAgentSimulationInput:
      type: object
      additionalProperties: false
      required: [goal, environment_id, evidence_ids]
      properties:
        goal: { type: string, minLength: 1, maxLength: 1024 }
        environment_id: { $ref: '#/components/schemas/ProductID' }
        evidence_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
    SecurityAgentSimulationStep:
      type: object
      additionalProperties: false
      required: [index, action, authorization, approval_required]
      properties:
        index: { type: integer, minimum: 0, maximum: 99 }
        action: { type: string, minLength: 1, maxLength: 128 }
        authorization: { type: string, enum: [allow, approval_required, deny] }
        approval_required: { type: boolean }
    SecurityAgentSimulation:
      type: object
      additionalProperties: false
      required: [matched_evidence_ids, summary, steps, side_effects]
      properties:
        matched_evidence_ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/ProductID' } }
        summary: { type: string, minLength: 1, maxLength: 500 }
        steps: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/SecurityAgentSimulationStep' } }
        side_effects: { type: integer, const: 0 }
    SecurityAgentManualRunInput:
      type: object
      additionalProperties: false
      required: [environment_id, trigger_kind, trigger_id]
      properties:
        environment_id: { $ref: '#/components/schemas/ProductID' }
        trigger_kind: { type: string, enum: [finding, attack_path, session] }
        trigger_id: { $ref: '#/components/schemas/ProductID' }
    SecurityAgentRun:
      type: object
      additionalProperties: false
      required: [id, agent_id, state, evidence_ids, definition_version, version]
      properties:
