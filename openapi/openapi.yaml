    post:
      operationId: testIntegrationWebhook
      summary: Test the configured Generic Webhook with a signed fixed event
      description: Uses only the saved destination and signing reference at the expected integration version. Exact retries retain the delivery identifier. A signed succeeded result means Zasp signed the request and the endpoint accepted it with an empty 204 response; it does not attest receiver-side signature verification. Receivers must deduplicate by delivery identifier. Browser mutations require same-origin Origin and CSRF headers; API tokens omit both.
      parameters:
        - $ref: '#/components/parameters/BrowserMutationCSRFToken'
        - $ref: '#/components/parameters/BrowserMutationOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmptyInput' } } }
      responses:
        '200':
          description: Persisted terminal test result or exact replay.
          headers:
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationWebhookTestStatus' } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
