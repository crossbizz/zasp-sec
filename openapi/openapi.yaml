    ComplianceFrameworkID: { type: string, enum: [soc2_security, hipaa, owasp_agentic_top10_2026, owasp_llm_top10_2025, mitre_atlas, nist_ai_rmf_1_0, iso_iec_42001_2023, eu_ai_act] }
    ComplianceControlID:
      type: string
      minLength: 1
      maxLength: 128
      description: A product evidence control (framework-category) or the own identifier of an AI framework control, such as ASI03, LLM01, AML.T0051, GOVERN 1.6, A.6.2.6 or Article 15.
      pattern: '^((soc2_security|hipaa)-(audit|findings|policies|tests|configuration)|ASI[0-9]{2}|LLM[0-9]{2}|AML\.T[0-9]{4}|(GOVERN|MAP|MEASURE|MANAGE) [0-9]\.[0-9]{1,2}|A\.[0-9]{1,2}(\.[0-9]{1,2}){1,2}|Article [0-9]{1,3})$'
    ComplianceControl:
      type: object
      additionalProperties: false
      required: [id, framework, name, evidence_ids, fresh_until]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        framework: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 256 }
        evidence_ids:
          type: array
          minItems: 0
          maxItems: 100
          uniqueItems: true
          description: Bounded preview of the first 100 evidence identifiers ordered by identifier; use the paged evidence operation for the complete set.
          items: { type: string, minLength: 1, maxLength: 128 }
        fresh_until: { type: string, format: date-time, description: Latest eligible source timestamp plus its maximum age across the complete control source set; Unix epoch when missing. }
        freshness: { type: string, enum: [fresh, stale, missing], description: 'Always present on the registered current-source service: aggregate state across all eligible sources, independent of the bounded preview. Absent on the legacy fallback; absence must not be interpreted as current-source evidence.' }
        finding_count: { type: integer, minimum: 0, description: 'Present on a control of an AI security framework: the number of findings the caller may read whose rule maps to this control. evidence_ids then holds the first 100 of those findings. A finding is evidence relevant to the control; the count does not say the control is met or failed.' }
    ComplianceEvidence:
      type: object
      additionalProperties: false
      required: [control, freshness, evidence]
      properties:
        control: { $ref: '#/components/schemas/ComplianceControl' }
        freshness: { type: string, enum: [fresh, stale, missing] }
        evidence:
          type: array
          minItems: 1
          maxItems: 1
          description: One evidence record per keyset-paged item.
          items: { $ref: '#/components/schemas/EvidenceRecord' }
