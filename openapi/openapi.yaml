        default: { $ref: '#/components/responses/ProductErrorResponse' }
    put:
      operationId: putGuardrailPolicy
      summary: Set the guardrail policy of the Environment
      description: >-
        BrowserSession requests require the same-origin Origin and CSRF headers; ProductAPIToken requests omit both. If-Match names
        the current version ("0" when no policy was saved); a stale version is refused with 409, which also makes a repeated request
        safe. A rule the request does not name has its default mode. The change is audited and applies to the next decision.
      parameters:
        - $ref: '#/components/parameters/BrowserMutationCSRFToken'
        - $ref: '#/components/parameters/BrowserMutationOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScheduleVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GuardrailPolicyInput' } } }
      responses:
        '200':
          description: The guardrail policy after the change.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/GuardrailPolicy' } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
