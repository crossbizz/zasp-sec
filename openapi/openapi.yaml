    WorkloadContextEvidence:
      type: object
      additionalProperties: false
      required: [kind, collection_ref, record_ref, version, result]
      properties:
        kind: { type: string, enum: [memory_write, memory_recall, retrieval, artifact_promotion, grounded_decision, hidden_context_check, workflow_purpose, workflow_approval, workflow_handoff, workflow_child, workflow_budget] }
        collection_ref: { type: string, pattern: '^[a-f0-9]{64}$' }
        record_ref: { type: string, pattern: '^[a-f0-9]{64}$' }
        version: { type: integer, minimum: 0, maximum: 9007199254740991 }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        result: { type: string, enum: [allowed, rejected] }
    ComplianceExportInput:
      type: object
      description: What the export captures - the controls of a framework (or one control; every control when both are omitted),, a managed pilot cohort/device or device-bound endpoint session, or, with agent_id alone, the evidence pack of one agent. An agent export retains how the agent was found, its findings with framework references, the Security Agent runs on those findings that the export worker can read (runs owned by the Temporal executor are not included; the synchronous evidence pack reads them) and the red team definitions and runs that target it. Its JSON format is the pack, its CSV format lists every record and its readable format is the Markdown rendering.
      additionalProperties: false
      properties:
        framework: { anyOf: [{ $ref: '#/components/schemas/ComplianceFrameworkID' }, { $ref: '#/components/schemas/CoverageFramework' }] }
        edition: { type: string, maxLength: 32 }
        upstream_id: { type: string, maxLength: 128 }
        evidence_kind: { $ref: '#/components/schemas/CoverageEvidenceKind' }
        control_id: { $ref: '#/components/schemas/ComplianceControlID' }
        agent_id: { $ref: '#/components/schemas/ProductID' }
        pilot_cohort: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
        device_id: { $ref: '#/components/schemas/ProductID' }
        endpoint_session_ref: { type: string, pattern: '^[0-9a-f]{64}$', description: Scoped endpoint session reference from a device observation. }
      allOf:
        - if: { required: [edition] }
          then: { required: [framework], not: { anyOf: [{ required: [control_id] }, { required: [agent_id] }, { required: [pilot_cohort] }, { required: [device_id] }, { required: [endpoint_session_ref] }] } }
        - if: { anyOf: [{ required: [upstream_id] }, { required: [evidence_kind] }] }
          then: { required: [edition] }
        - if: { required: [agent_id] }
          then: { not: { anyOf: [{ required: [framework] }, { required: [control_id] }, { required: [pilot_cohort] }, { required: [device_id] }, { required: [endpoint_session_ref] }] } }
        - if: { required: [pilot_cohort] }
          then: { not: { anyOf: [{ required: [framework] }, { required: [control_id] }, { required: [device_id] }, { required: [endpoint_session_ref] }] } }
        - if: { required: [device_id] }
          then: { not: { anyOf: [{ required: [framework] }, { required: [control_id] }] } }
        - if: { required: [endpoint_session_ref] }
          then: { required: [device_id] }
    ComplianceExport:
      type: object
      additionalProperties: false
      required: [id, status, formats, created_at, expires_at, failure_code, mapping_revision]
      properties:
        id: { $ref: '#/components/schemas/ComplianceExportID' }
        status: { type: string, enum: [pending, completed, failed] }
