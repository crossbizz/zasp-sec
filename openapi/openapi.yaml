    ConsoleSessionPage: { type: object, additionalProperties: false, required: [items, page_info], properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Session' } }, page_info: { $ref: '#/components/schemas/PageInfo' } } }
    ConsoleSessionEventPage: { type: object, additionalProperties: false, required: [items, page_info], properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SessionEvent' } }, page_info: { $ref: '#/components/schemas/PageInfo' } } }
    RuntimeSessionSearchStatus:
      type: object
      additionalProperties: false
      description: 'Durable scoped indexing checkpoints, checked after current-principal authorization. Current means no known pending or quarantined batches, not OpenSearch health, an atomic search snapshot, full telemetry coverage, or complete selector metadata. Capped counters are lower bounds. Search provider failures return an error, never an empty successful page.'
      required: [state, pending_batches, pending_batches_capped, quarantined_batches, quarantined_batches_capped, last_indexed_at, oldest_pending_at, checked_at, selector_coverage]
      properties:
        state: { type: string, enum: [empty, catching_up, blocked, current] }
