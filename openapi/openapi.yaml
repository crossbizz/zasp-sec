            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            X-Mutation-Receipt-ID: { $ref: '#/components/headers/WorkflowMutationReceiptID' }
            Cache-Control:
              description: Prevent authorization results from being stored.
              schema: { type: string, const: no-store }
          content:
