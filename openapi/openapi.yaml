          description: Persisted terminal test result or exact replay.
          headers:
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationWebhookTestStatus' } } }
