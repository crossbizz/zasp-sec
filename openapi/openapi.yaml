        - { $ref: '#/components/schemas/SessionID' }
        - { $ref: '#/components/schemas/RuntimeSessionID' }
    RuntimeSessionID:
      anyOf:
        - { $ref: '#/components/schemas/ProductID' }
        - { type: string, enum: [unattributed] }
    RuntimeSession:
      type: object
      additionalProperties: false
      description: 'Summary derived from committed correlated events. Unattributed is a collection, not an inferred session. A null agent means unknown or multiple agents; a null principal means unknown. Counts preserve per-event attribution confidence.'
      required: [id, kind, workspace_id, environment_id, agent_id, principal_id, first_event_at, last_event_at, projected_at, event_count, confidence_counts]
      properties:
        id: { $ref: '#/components/schemas/RuntimeSessionID' }
        kind: { type: string, enum: [runtime, unattributed] }
        workspace_id: { $ref: '#/components/schemas/ProductID' }
        environment_id: { $ref: '#/components/schemas/ProductID' }
        agent_id: { type: [string, 'null'], pattern: '^pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        principal_id: { type: [string, 'null'], pattern: '^pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        first_event_at: { type: string, format: date-time }
