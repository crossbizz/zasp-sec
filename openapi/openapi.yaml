        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    post:
      operationId: authorizeIntegrationReference
      summary: Authorize a reference-backed cloud or Kubernetes integration
      description: >-
        Performs a bounded read-only provider identity and capability probe
        using only the integration's stored reference configuration, then
        atomically records an active integration and durable mutation receipt.
        The response never returns provider subjects, endpoints, credentials,
        external IDs, certificate authorities, tokens, or raw provider errors.
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/FreshAuth'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceVersion'
