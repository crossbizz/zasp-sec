          required: [exact, strong, probable, unattributed]
          properties:
            exact: { type: integer, minimum: 0, maximum: 9007199254740991 }
            strong: { type: integer, minimum: 0, maximum: 9007199254740991 }
            probable: { type: integer, minimum: 0, maximum: 9007199254740991 }
            unattributed: { type: integer, minimum: 0, maximum: 9007199254740991 }
    RuntimeSessionEvent:
      type: object
      additionalProperties: false
      required: [id, session_id, agent_id, class, action, label, evidence_id, source, confidence, at, projected_at]
      dependentRequired:
        sandbox_id: [sandbox_source_sensor_id]
        sandbox_source_sensor_id: [sandbox_id]
      if: { properties: { sandbox_id: {} }, required: [sandbox_id] }
      then: { properties: { confidence: { enum: [exact, strong] } } }
      properties:
        outcome: { $ref: '#/components/schemas/SessionActionOutcome' }
        id: { $ref: '#/components/schemas/ProductID' }
        session_id: { type: [string, 'null'], pattern: '^pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        agent_id: { type: [string, 'null'], pattern: '^pid_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        sandbox_id:
          type: string
          minLength: 1
          maxLength: 256
          description: 'Source-qualified sandbox identity, at most 256 UTF-8 bytes with no surrounding Unicode whitespace or CR/LF. Present only with its reporting sensor and Exact/Strong correlation. Omitted when unknown, including historical events; never inferred from session identity.'
        sandbox_source_sensor_id: { $ref: '#/components/schemas/ProductID' }
        class: { type: string, enum: [tool, runtime, network, file, credential, policy] }
        action: { type: string, enum: [invoke, exec, exit, read, write, connect, accept, use, allow, monitor, block] }
        label: { type: string, minLength: 1, maxLength: 256 }
        evidence_id: { $ref: '#/components/schemas/ProductID' }
        source: { type: string, enum: [otlp, tetragon, gateway], description: 'What observed the event: a sensor (otlp, tetragon) or the hosted gateway. A gateway event is a tool call or a policy decision the gateway made for a request that named the agent; its evidence is the gateway decision record.' }
        confidence: { type: string, enum: [exact, strong, probable, unattributed] }
        at: { type: string, format: date-time }
        projected_at: { type: string, format: date-time }
    ComplianceExportID: { $ref: '#/components/schemas/ProductID' }
    SessionEvent:
      type: object
