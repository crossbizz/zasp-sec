      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected, cancelled] }
    SessionID: { type: string, minLength: 9, maxLength: 128, pattern: '^session-[a-z0-9][a-z0-9-]*$' }
    SessionInvestigationID:
      description: A console login ID, a correlated runtime session ID, or the explicitly unattributed evidence collection.
