  /api/v1/security-agent-runs/{id}/close:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ProductID' } }
    post:
      operationId: closeSecurityAgentRun
      summary: Close one Security Agent run that needs a human
      description: Records that a human reviewed a run in the needs_human state and closed it. Requires manage_workflows on the run. The run keeps its state, version and recorded stop reason; the closure is an immutable record and an audit event. A closed run no longer holds its agent's capacity for a planner request whose usage is still unknown, and that usage stays recorded as unknown, never as zero. A run with an unknown planner outcome can be closed only with the reason usage_unknown_accepted; a run without one only with one of the other reasons. A run with an unfinished effect, cleanup or temporary control cannot be closed. An exact replay returns the first answer; any other request for a closed run conflicts.
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
        - ProductAPIToken: []
      parameters:
        - $ref: '#/components/parameters/BrowserMutationCSRFToken'
        - $ref: '#/components/parameters/BrowserMutationOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SecurityAgentRunCloseRequest' } } }
      responses:
        '200':
          description: The closure of the run. The ETag is the unchanged run version.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            X-Mutation-Receipt-ID: { $ref: '#/components/headers/WorkflowMutationReceiptID' }
          content: { application/json: { schema: { $ref: '#/components/schemas/SecurityAgentRunClosed' } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
