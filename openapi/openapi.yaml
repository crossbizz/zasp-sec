      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        operation: { type: string, const: putIntegrationSchedule }
        idempotency_key: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        intent: { $ref: '#/components/schemas/PutIntegrationScheduleReceiptIntent' }
        result: { $ref: '#/components/schemas/IntegrationSchedule' }
        resource_kind: { type: string, const: integration_schedule }
        resource_id: { $ref: '#/components/schemas/ProductID' }
        resource_version: { type: integer, minimum: 1 }
        audit_id: { $ref: '#/components/schemas/ProductID' }
