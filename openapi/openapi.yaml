  /api/v1/guardrails/decisions:
    post:
      operationId: createGuardrailDecision
      summary: Decide whether one model interaction is allowed, redacted or blocked
      description: >-
        For a gateway the customer already runs (for example a LiteLLM guardrail hook): send the text going into a model
        (direction input) or coming out of it (direction output) and act on the answer. Authenticate with an API token of the
        Environment that has the decide_guardrails permission; a browser session is not accepted, and a token with view alone is
        refused. decide_guardrails is a permission of API tokens only: a token created with it and nothing else can ask for decisions
        and cannot read anything. The owner of the token must be able to view the Environment. The detectors are deterministic (regular
        expressions, phrase lists and checksums; no model is called) and are heuristics: see the rule descriptions of the guardrail
        policy. The interaction text is used for this request only. It is not logged and not stored; the audit record of a decision
        holds the decision, the matched rule identifiers with their modes and counts, the size of the text and its SHA-256 digest.
      security:
        - ProductAPIToken: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GuardrailInteraction' } } }
      responses:
        '200':
          description: The decision. It was recorded before it was returned.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/GuardrailDecision' } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '413': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/guardrails/policy:
