  /api/v1/runtime/provider-hooks/claude-enterprise/{integrationId}:
    post:
      operationId: evaluateClaudeEnterpriseHook
      summary: Evaluate an authenticated Claude Enterprise inference frame
      description: The configured provider sends its original signed JSON. Prompt frames use runtime policies. One verdict covers all tool requests in a tool frame. A delivery receipt records the Zasp decision. Provider shadow and failure settings determine enforcement.
      security:
        - ClaudeWebhookSignature: []
      parameters:
        - { name: integrationId, in: path, required: true, schema: { $ref: '#/components/schemas/ProductID' } }
        - { name: webhook-id, in: header, required: true, description: Signed opaque delivery identifier matching request_id., schema: { type: string, minLength: 1, maxLength: 512 } }
        - { name: webhook-timestamp, in: header, required: true, description: Unix timestamp in seconds with five minutes of clock tolerance., schema: { type: string, pattern: '^[0-9]{1,16}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, request_id]
              additionalProperties: true
              properties:
                type: { type: string, description: Handles prompt and tool_call. Authenticated unknown frame types receive an allow response without a coverage receipt. }
                request_id: { type: string, minLength: 1, maxLength: 512 }
                tenant_id: { type: [string, 'null'], description: Must match the configured tenant for ordinary frames. }
                session_id: { type: [string, 'null'] }
                source: { type: object, additionalProperties: true, properties: { application: { type: string } } }
                messages: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: One verdict for this frame.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema:
                oneOf:
                  - { type: object, required: [action], additionalProperties: false, properties: { action: { type: string, const: allow } } }
                  - type: object
                    required: [action, deny_reason, reference_id]
                    additionalProperties: false
                    properties:
                      action: { type: string, const: deny }
                      deny_reason: { type: string, maxLength: 512 }
                      reference_id: { $ref: '#/components/schemas/ProductID' }
        '400': { description: Malformed frame or delivery identifier mismatch. }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { description: Provider tenant does not match. }
        '404': { description: Integration unavailable. }
        '405': { description: POST required. }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '413': { $ref: '#/components/responses/ProductErrorResponse' }
        '415': { description: Uncompressed application/json required. }
        '422': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { description: Workload decision unavailable or callback budget exhausted. }
        '504': { description: Callback exceeded the decision deadline. }
security:
  - BrowserSession: []
    BrowserExpectedScope: []
  - ProductAPIToken: []
components:
  securitySchemes:
    ClaudeWebhookSignature:
      type: apiKey
      in: header
      name: webhook-signature
      description: Standard Webhooks v1 HMAC-SHA256 over webhook-id, webhook-timestamp and the exact raw request body, joined by periods.
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-zasp_session
      description: Secure, HttpOnly, SameSite=Lax host-only human browser session.
    BrowserExpectedScope:
      type: apiKey
      in: header
      name: X-Zasp-Expected-Scope
      description: Exact canonical organization/workspace/environment scope captured by the browser before a scoped request. The server compares it with the authenticated session scope before data access; ProductAPIToken scope remains token-owned.
    ProductAPIToken:
      type: http
      scheme: bearer
      bearerFormat: ProductAPIToken
      description: Product automation token.
  headers:
    AgentSettingsETag:
      description: Quoted current revision. Zero represents an agent with no declared settings.
      schema: { type: string, pattern: '^"(?:0|[1-9][0-9]{0,5}|1000000)"$' }
    WorkflowETag:
      description: Quoted durable resource version for optimistic concurrency.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    WorkflowAuditID:
      description: Durable audit record identifier for this mutation or its exact replay.
      schema: { $ref: '#/components/schemas/ProductID' }
    WorkflowMutationReceiptID:
      description: BrowserSession-only durable recovery receipt bound to the exact authenticated principal, scope, operation, intent, and attempt key. This header is absent for ProductAPIToken mutations and replays.
      schema: { $ref: '#/components/schemas/ProductID' }
    RetryAfter:
      description: Minimum whole seconds before retrying an accepted asynchronous mutation.
      schema: { type: string, pattern: '^[1-9][0-9]{0,2}$' }
  parameters:
    ComplianceFramework: { name: framework, in: query, description: 'A product evidence framework (soc2_security, hipaa) or an AI security framework. The controls of an AI framework are the framework''s own, and the evidence of one is the findings whose rule maps to it. Listing evidence of an AI framework requires control_id.', schema: { $ref: '#/components/schemas/ComplianceFrameworkID' } }
    ComplianceControlFilter: { name: control_id, in: query, schema: { $ref: '#/components/schemas/ComplianceControlID' } }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Short-lived CSRF value bound to the authenticated browser session. Mutations also require an exact same-origin Origin header.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    BrowserMutationCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for BrowserSession mutations and omitted for ProductAPIToken mutations. The value is bound to the authenticated browser session.
      schema: { type: string, minLength: 32, maxLength: 256 }
    BrowserMutationOrigin:
      name: Origin
      in: header
      required: false
      description: Required for BrowserSession mutations and omitted for ProductAPIToken mutations. The server requires the exact configured same-origin HTTPS origin.
      schema: { type: string, minLength: 9, maxLength: 2048, pattern: '^https://[^/?#]+$' }
    SensorEnrollmentSchema:
      name: X-Zasp-Sensor-Enrollment-Schema
      in: header
      required: false
      description: Select enrollment-binding-v1 to require a scoped installation binding in a successful one-time credential response. Omission preserves the legacy representation. This is not authentication or mutation intent.
      schema: { type: string, const: enrollment-binding-v1 }
    FreshAuth:
      name: X-Zasp-Fresh-Auth
      in: header
      required: true
      description: Explicit fresh-auth confirmation required for a sensitive approval or connector authorization mutation.
      schema: { type: string, const: confirmed }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key binding an exact workflow mutation and its durable response.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
    CompliancePageCursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ComplianceCursor'
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the preceding page.
      schema:
        $ref: '#/components/schemas/Cursor'
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ResourceVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted current durable resource version.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    ControlVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted current execution-control version, including quoted zero before the first tenant override.
      schema: { type: string, pattern: '^"(?:0|[1-9][0-9]*)"$' }
    AgentSettingsVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted current revision from a read of these agent settings. Use the quoted zero revision for the first write.
      schema: { type: string, pattern: '^"(?:0|[1-9][0-9]{0,5})"$' }
    ScheduleVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted current schedule version, or quoted zero when creating the singleton schedule.
      schema: { type: string, pattern: '^"(?:0|[1-9][0-9]*)"$' }
  schemas:
    PrivateAddonUploadRequest:
      type: object
      additionalProperties: false
      required: [mode, retention, archive_digest, archive_bytes]
