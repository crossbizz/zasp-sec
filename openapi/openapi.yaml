openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Agent Security Platform API
  version: 1.0.0
  description: Stable product API contract.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
paths:
  /api/v1/session/bootstrap:
    get:
      operationId: bootstrapSession
      summary: Bootstrap the authenticated browser session and authorized scope
      security:
        - BrowserSession: []
      responses:
        '200':
          description: Authenticated principal, exact scope, capabilities, and CSRF value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionBootstrap' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/callback:
    post:
      operationId: completeSessionCallback
      summary: Exchange an identity-provider callback for a host-only browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCallbackInput' }
      responses:
        '204':
          description: Session established with a Secure, HttpOnly, SameSite=Lax __Host-zasp_session cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Host-only __Host-zasp_session cookie; Secure, HttpOnly, Path=/, SameSite=Lax.
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/sign-out:
    post:
      operationId: signOutSession
      summary: Revoke the browser session and expire its host-only cookie
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Session revoked and cookie expired. }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/organization:
    get:
      operationId: getOrganization
      summary: Get the authenticated Organization
      responses:
        '200':
          description: Authenticated Organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List authorized Workspaces
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Authorized Workspace page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createWorkspace
      summary: Create an Organization Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameInput'
      responses:
        '201':
          description: Created Workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical Workspace identifier.
        schema:
          $ref: '#/components/schemas/ProductID'
    get:
      operationId: getWorkspace
      summary: Get an authorized Workspace
      responses:
        '200':
          description: Authorized Workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    patch:
      operationId: updateWorkspace
      summary: Update an authorized Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameInput'
      responses:
        '200':
          description: Updated Workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/environments:
    get:
      operationId: listEnvironments
      summary: List authorized Workspace Environments
      parameters:
        - name: workspace_id
          in: query
          required: true
          description: Canonical parent Workspace identifier.
          schema:
            $ref: '#/components/schemas/ProductID'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Authorized Environment page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createEnvironment
      summary: Create a Workspace Environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentCreateInput'
      responses:
        '201':
          description: Created Environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/environments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical Environment identifier.
        schema:
          $ref: '#/components/schemas/ProductID'
    get:
      operationId: getEnvironment
      summary: Get an authorized Environment
      responses:
        '200':
          description: Authorized Environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    patch:
      operationId: updateEnvironment
      summary: Update an authorized Environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameInput'
      responses:
        '200':
          description: Updated Environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/me:
    get:
      operationId: getCurrentPrincipal
      summary: Get the authenticated product principal
      responses:
        '200':
          description: Authenticated principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/members:
    get:
      operationId: listMembers
      summary: List Organization members
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Organization member page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/roles:
    get:
      operationId: listBuiltInRoles
      summary: List built-in product roles
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Built-in role page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuiltInRolePage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/sso-connections:
    get:
      operationId: listSSOConnections
      summary: List Organization SSO connections
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: SSO connection page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOConnectionPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createSSOConnection
      summary: Create an Organization SSO connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSOConnectionInput'
      responses:
        '201':
          description: Created SSO connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOConnectionMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/sso-connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Exact provider SSO connection identifier.
        schema:
          $ref: '#/components/schemas/SSOConnectionID'
    delete:
      operationId: deleteSSOConnection
      summary: Delete an Organization SSO connection
      responses:
        '200':
          description: Deleted SSO connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDeletion'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/sso-connections/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        description: Exact provider SSO connection identifier.
        schema:
          $ref: '#/components/schemas/SSOConnectionID'
    post:
      operationId: testSSOConnection
      summary: Test an Organization SSO connection
      responses:
        '200':
          description: SSO connection health result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTest'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/scim-connections:
    get:
      operationId: listSCIMConnections
      summary: List Organization SCIM connections
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: SCIM connection page without bearer credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMConnectionPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createSCIMConnection
      summary: Create an Organization SCIM connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMConnectionInput'
      responses:
        '201':
          description: Created SCIM connection with its one-time bearer credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMConnectionCredential'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/scim-connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Exact provider SCIM connection identifier.
        schema:
          $ref: '#/components/schemas/SCIMConnectionID'
    delete:
      operationId: deleteSCIMConnection
      summary: Delete an Organization SCIM connection
      responses:
        '200':
          description: Deleted SCIM connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionDeletion'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/group-mappings:
    get:
      operationId: listGroupMappings
      summary: List Organization IdP group mappings
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Group mapping page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMappingPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    patch:
      operationId: updateGroupMappings
      summary: Create or version-update an IdP group mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMappingInput'
      responses:
        '200':
          description: Updated group mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMapping'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/api-tokens:
    get:
      operationId: listAPITokens
      summary: List scoped product API tokens
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: API token page without raw credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createAPIToken
      summary: Create a scoped product API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITokenInput'
      responses:
        '201':
          description: Created API token with its one-time raw credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenCredential'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/api-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical product API token identifier.
        schema:
          $ref: '#/components/schemas/ProductID'
    delete:
      operationId: revokeAPIToken
      summary: Revoke a product API token
      responses:
        '200':
          description: Revoked API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: List redacted Organization audit events
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Append-only audit event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/audit-exports:
    post:
      operationId: createAuditExport
      summary: Create a bounded Organization audit export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportInput'
      responses:
        '201':
          description: Created audit export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExport'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/audit-exports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical audit export identifier.
        schema:
          $ref: '#/components/schemas/ProductID'
    get:
      operationId: getAuditExport
      summary: Get an Organization audit export
      responses:
        '200':
          description: Audit export state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExport'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/integration-catalog:
    get:
      operationId: listIntegrationCatalog
      summary: Search the product connector catalog
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
        - name: data_type
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
        - name: action
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
        - name: auth_mode
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
      responses:
        '200':
          description: Product connector catalog results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationCatalogPage' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/integrations:
    get:
      operationId: listIntegrations
      summary: List integrations in the authorized scope
      responses:
        '200':
          description: Authorized integration records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationPage' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    post:
      operationId: createIntegration
      summary: Create an integration in the authorized scope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationInput' }
      responses:
        '201':
          description: Created integration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/integrations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    get:
      operationId: getIntegration
      summary: Get an authorized integration
      responses:
        '200':
          description: Authorized integration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    patch:
      operationId: updateIntegration
      summary: Update an authorized integration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationUpdateInput' }
      responses:
        '200':
          description: Updated integration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    delete:
      operationId: deleteIntegration
      summary: Delete an authorized integration without active sync work
      responses:
        '204': { description: Integration deleted. }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/integrations/{id}/authorize:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    post:
      operationId: authorizeIntegration
      summary: Confirm authorization for an integration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyInput' }
      responses:
        '200':
          description: Authorized integration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/integrations/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    post:
      operationId: syncIntegration
      summary: Queue one idempotent integration sync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationSyncInput' }
      responses:
        '202':
          description: Queued or existing idempotent sync.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSync' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/integrations/{id}/syncs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    get:
      operationId: listIntegrationSyncs
      summary: List syncs for an authorized integration
      responses:
        '200':
          description: Integration sync records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSyncPage' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/integrations/{id}/syncs/{syncId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
      - name: syncId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    get:
      operationId: getIntegrationSync
      summary: Get one authorized integration sync
      responses:
        '200':
          description: Integration sync record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSync' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/sensors:
    get:
      operationId: listSensors
      summary: List sensors in the authorized scope
      responses:
        '200':
          description: Authorized sensor records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorPage' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    post:
      operationId: createSensorEnrollment
      summary: Create a sensor enrollment and return its token once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorInput' }
      responses:
        '201':
          description: Created sensor enrollment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorEnrollment' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/sensors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    get:
      operationId: getSensor
      summary: Get an authorized sensor
      responses:
        '200':
          description: Authorized sensor record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    patch:
      operationId: updateSensor
      summary: Update an authorized sensor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorInput' }
      responses:
        '200':
          description: Updated sensor record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sensor' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    delete:
      operationId: deleteSensor
      summary: Delete an authorized sensor
      responses:
        '204': { description: Sensor deleted. }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/sensors/{id}/rotate-token:
    parameters:
