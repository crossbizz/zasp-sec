    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    post:
      operationId: authorizeIntegration
      summary: Begin a state-bound first-party integration authorization
      description: >-
        Creates or replays an exact authorization attempt for the current
        browser principal and scope. The response contains only the durable
        attempt reference, a bounded HTTPS provider authorization target, and
        its expiry; it never returns OAuth state, a PKCE verifier, a provider
        token, a refresh credential, or secret material.
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyInput' }
      responses:
        '200':
          description: Exact authorization attempt and safe provider authorization target.
          headers:
            Cache-Control:
              description: Prevent authorization targets from being stored.
              schema: { type: string, const: no-store }
            Referrer-Policy:
              description: Prevent authorization data from entering a Referer header.
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationAuthorization' }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
