      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ProductID' } }
    get:
      operationId: getIntegrationSchedule
      summary: Get the authorized integration schedule
      responses:
        '200':
          description: Authorized singleton integration schedule.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationSchedule' } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    put:
      operationId: putIntegrationSchedule
      summary: Create or replace the authorized integration schedule
      description: BrowserSession requests require the same-origin Origin and CSRF headers; ProductAPIToken requests omit both. The server owns next_run_at and accepts only UTC schedules.
      parameters:
        - $ref: '#/components/parameters/BrowserMutationCSRFToken'
        - $ref: '#/components/parameters/BrowserMutationOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScheduleVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationScheduleInput' } } }
      responses:
        '200':
          description: Integration schedule created, replaced, or exactly replayed.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            X-Mutation-Receipt-ID: { $ref: '#/components/headers/WorkflowMutationReceiptID' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationSchedule' } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    delete:
      operationId: deleteIntegrationSchedule
      summary: Disable and delete the authorized integration schedule
      description: BrowserSession requests require the same-origin Origin and CSRF headers; ProductAPIToken requests omit both.
      parameters:
        - $ref: '#/components/parameters/BrowserMutationCSRFToken'
        - $ref: '#/components/parameters/BrowserMutationOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceVersion'
      responses:
        '204':
          description: Integration schedule deleted or exactly replayed.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            X-Mutation-Receipt-ID: { $ref: '#/components/headers/WorkflowMutationReceiptID' }
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
