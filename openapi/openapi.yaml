openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Agent Security Platform API
  version: 1.0.0
  description: Stable product API contract.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
paths:
  /api/v1/session/start:
    get:
      operationId: startSession
      summary: Start a repository-owned browser identity flow
      security: []
      parameters:
        - name: return_to
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048, pattern: '^/(?!/)' }
      responses:
        '302': { description: Redirect to the configured identity authorization endpoint. }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/bootstrap:
    get:
      operationId: bootstrapSession
      summary: Bootstrap the authenticated browser session and authorized scope
      security:
        - BrowserSession: []
      responses:
        '200':
          description: Authenticated principal, exact scope, capabilities, and CSRF value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionBootstrap' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/callback:
    post:
      operationId: completeSessionCallback
      summary: Exchange an identity-provider callback for a host-only browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCallbackInput' }
      responses:
        '200':
          description: Session established with a Secure, HttpOnly, SameSite=Lax __Host-zasp_session cookie and the state-bound return path.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Host-only __Host-zasp_session cookie; Secure, HttpOnly, Path=/, SameSite=Lax.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionCallbackResult' }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/sign-out:
    post:
      operationId: signOutSession
      summary: Revoke the browser session and expire its host-only cookie
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Session revoked and cookie expired. }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/scopes:
    get:
      operationId: listSessionScopes
      summary: List durable scopes authorized for the browser principal
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      responses:
        '200':
          description: Authorized durable scopes.
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionScopePage' } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/scope:
    put:
      operationId: switchSessionScope
      summary: Switch the browser session to an authorized durable scope
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SessionScopeSwitchInput' } } }
      responses:
        '204': { description: Session scope switched and protected caches must be reloaded. }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/organization:
    get:
      operationId: getOrganization
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Get the authenticated Organization
      responses:
        '200':
          description: Authenticated Organization.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List authorized Workspaces
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Authorized Workspace page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createWorkspace
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Create an Organization Workspace

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameInput'
      responses:
        '201':
          description: Created Workspace.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical Workspace identifier.
        schema:
          $ref: '#/components/schemas/ProductID'
    get:
      operationId: getWorkspace
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Get an authorized Workspace
      responses:
        '200':
          description: Authorized Workspace.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    patch:
      operationId: updateWorkspace
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Update an authorized Workspace

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameInput'
      responses:
        '200':
          description: Updated Workspace.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/environments:
    get:
      operationId: listEnvironments
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List authorized Workspace Environments
      parameters:
        - name: workspace_id
          in: query
          required: true
          description: Canonical parent Workspace identifier.
          schema:
            $ref: '#/components/schemas/ProductID'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Authorized Environment page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createEnvironment
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Create a Workspace Environment

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentCreateInput'
      responses:
        '201':
          description: Created Environment.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/environments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical Environment identifier.
        schema:
          $ref: '#/components/schemas/ProductID'
    get:
      operationId: getEnvironment
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Get an authorized Environment
      responses:
        '200':
          description: Authorized Environment.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    patch:
      operationId: updateEnvironment
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Update an authorized Environment

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameInput'
      responses:
        '200':
          description: Updated Environment.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/me:
    get:
      operationId: getCurrentPrincipal
      summary: Get the authenticated product principal
      responses:
        '200':
          description: Authenticated principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/members:
    get:
      operationId: listMembers
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List Organization members
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Organization member page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    patch:
      operationId: updateMemberRole
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Atomically update a member role and revoke active sessions
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemberRoleInput' } } }
      responses:
        '200': { description: Updated member., headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Principal' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/roles:
    get:
      operationId: listBuiltInRoles
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List built-in product roles
      responses:
        '200':
          description: Built-in role page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuiltInRolePage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/api-tokens:
    get:
      operationId: listAPITokens
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List scoped product API tokens
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: API token page without raw credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createAPIToken
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Create a scoped product API token

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITokenInput'
      responses:
        '201':
          description: Created API token with durable one-time reveal grant metadata.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenRevealGrant'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/api-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical product API token identifier.
        schema:
          $ref: '#/components/schemas/ProductID'
    delete:
      operationId: revokeAPIToken
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Revoke a product API token

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/ResourceVersion'
      responses:
        '200':
          description: Revoked API token.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/api-tokens/{id}/rotate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    post:
      operationId: rotateAPIToken
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Rotate a scoped product API token and create a durable one-time reveal grant
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '201': { description: Rotated API token with durable reveal grant metadata., content: { application/json: { schema: { $ref: '#/components/schemas/APITokenRevealGrant' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/api-token-reveal-grants:
    get:
      operationId: listAPITokenRevealGrants
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List this principal's pending exact-scope API token reveal grants
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200': { description: Pending reveal grant page., content: { application/json: { schema: { $ref: '#/components/schemas/APITokenRevealGrantPage' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/api-token-reveal-grants/{id}/reveal:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    post:
      operationId: revealAPIToken
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Reveal an unacknowledged API token credential in its exact scope
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '200': { description: Revealed API token credential; never cache., content: { application/json: { schema: { $ref: '#/components/schemas/APITokenRevealedCredential' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/api-token-reveal-grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    delete:
      operationId: acknowledgeAPITokenRevealGrant
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Acknowledge a reveal grant and atomically destroy its encrypted credential
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '204': { description: Credential material destroyed. }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List redacted Organization audit events
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Append-only audit event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/integration-catalog:
    get:
      operationId: listIntegrationCatalog
      summary: Search the product connector catalog
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
        - name: data_type
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
        - name: action
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
        - name: auth_mode
          in: query
          required: false
          schema: { type: string, maxLength: 63 }
      responses:
        '200':
          description: Product connector catalog results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationCatalogPage' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/workflow-mutation-receipts:
    get:
      operationId: listWorkflowMutationReceipts
      summary: List unacknowledged durable mutation receipts for the exact browser principal and scope
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Bounded unacknowledged mutation receipts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowMutationReceiptPage' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/workflow-mutation-receipts/{id}/acknowledge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    post:
      operationId: acknowledgeWorkflowMutationReceipt
      summary: Acknowledge one exact-scope durable mutation receipt
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyInput' }
      responses:
        '204': { description: Mutation receipt acknowledged. }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/integrations:
    get:
      operationId: listIntegrations
      summary: List integrations in the authorized scope
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Authorized integration records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationPage' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    post:
      operationId: createIntegration
      summary: Create an integration in the authorized scope
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationInput' }
      responses:
        '201':
          description: Created integration.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' }, X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }, X-Mutation-Receipt-ID: { $ref: '#/components/headers/WorkflowMutationReceiptID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/integrations/oauth/callback:
    get:
      operationId: completeIntegrationOAuthCallback
      summary: Complete a state-bound first-party integration authorization
      description: >-
        Accepts exactly code and state, or exactly error and state. Code and
        error are mutually exclusive. Duplicate or additional parameters,
        including error_description and error_uri, are rejected. The one-time
        state is reauthorized against the current BrowserSession before any
        provider exchange. Success and provider denial return a 303 to a fixed
        same-origin relative path with Cache-Control: no-store and
        Referrer-Policy: no-referrer; no provider token, verifier, credential,
        or provider error detail enters the redirect URL.
      security:
        - BrowserSession: []
      parameters:
        - name: state
          in: query
          required: true
          description: Opaque one-time state bound to the current browser session and authorization attempt.
          schema: { $ref: '#/components/schemas/IntegrationOAuthCallbackValue' }
        - name: code
          in: query
          required: false
          description: Provider authorization code. Required for the success form and mutually exclusive with error.
          schema: { $ref: '#/components/schemas/IntegrationOAuthCallbackValue' }
        - name: error
          in: query
          required: false
          description: Provider denial code. Required for the provider-error form and mutually exclusive with code.
          schema: { $ref: '#/components/schemas/IntegrationOAuthProviderError' }
      responses:
        '303':
          description: Authorization completed or safely denied; continue at the fixed product return path without callback data.
          headers:
            Location:
              description: Fixed same-origin relative product return path.
              schema: { type: string, minLength: 1, maxLength: 2048, pattern: '^/(?!/)' }
            Cache-Control:
              description: Prevent callback responses from being stored.
              schema: { type: string, const: no-store }
            Referrer-Policy:
              description: Prevent callback query data from entering a Referer header.
              schema: { type: string, const: no-referrer }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
