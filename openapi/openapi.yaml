        '403': { description: 'An error in the provider''s own error shape, from the gateway (codes guardrail_blocked and gateway_*) or from the provider.', content: { application/json: { schema: { $ref: '#/components/schemas/GatewayProviderBody' } } } }
        '429': { description: 'An error in the provider''s own error shape, from the gateway (codes guardrail_blocked and gateway_*) or from the provider.', content: { application/json: { schema: { $ref: '#/components/schemas/GatewayProviderBody' } } } }
        '502': { description: 'An error in the provider''s own error shape, from the gateway (codes guardrail_blocked and gateway_*) or from the provider.', content: { application/json: { schema: { $ref: '#/components/schemas/GatewayProviderBody' } } } }
        '503': { description: 'An error in the provider''s own error shape, from the gateway (codes guardrail_blocked and gateway_*) or from the provider.', content: { application/json: { schema: { $ref: '#/components/schemas/GatewayProviderBody' } } } }
