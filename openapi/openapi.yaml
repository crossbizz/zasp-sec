      description: >-
        A chat completion in the widely used chat completions format: point the SDK's base URL at <origin>/api/v1/gateway/llm/v1,
        use an API token that has the use_gateway permission as the SDK's key, and send the provider's own key in
        X-Zasp-Upstream-Authorization. The
        provider's key is forwarded for this request only and is never stored or logged. The Environment's guardrail policy is
        applied to the messages (a blocked prompt is refused with 400, code guardrail_blocked; sensitive data is redacted before the
        provider sees it) and to the answer, streamed answers included: a stream is searched through a window that never releases
        part of a match, and a blocked stream ends with an error event. The request and the answer are otherwise the provider's.
