      summary: Get what one authorized Agent may use
      description: >-
        The model and agent actions the policies of the Agent's role grant against the ones the audit log showed in use, the MCP
        servers it uses with the registry's decision for each, the data stores the identities it runs as reach, and the skills and
        instruction files of its repository (path and kind only). ai_actions is null when the role's audit log was not read.
      responses:
        '200': { description: Agent access., content: { application/json: { schema: { $ref: '#/components/schemas/AgentAccess' } } } }
