      responses:
        '200':
          description: not_requested is not a recovery eligibility or history-absence assertion.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SingleTestCleanupRecovery' } } }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    post:
      operationId: requestSingleTestCleanupRecovery
      summary: Stop forward work and admit cleanup-only recovery for an existing original run
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
        - ProductAPIToken: []
      parameters:
        - $ref: '#/components/parameters/BrowserMutationCSRFToken'
        - $ref: '#/components/parameters/BrowserMutationOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [definition_version, input_digest, diagnostic, stop_original]
              properties:
                definition_version: { type: integer, minimum: 1, maximum: 1000000 }
                input_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
                diagnostic: { const: history_unavailable }
                stop_original: { const: true }
      responses:
        '202':
          description: Durable recovery command accepted, not a cleanup-completion claim.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            X-Mutation-Receipt-ID: { $ref: '#/components/headers/WorkflowMutationReceiptID' }
          content: { application/json: { schema: { $ref: '#/components/schemas/SingleTestCleanupRecovery' } } }
        '200':
          description: Current-authorized exact replay or already-complete native evidence.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            X-Mutation-Receipt-ID: { $ref: '#/components/headers/WorkflowMutationReceiptID' }
          content: { application/json: { schema: { $ref: '#/components/schemas/SingleTestCleanupRecovery' } } }
