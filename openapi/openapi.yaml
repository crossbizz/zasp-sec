      required: [policy_revision, agent_id, from, to, evaluated, truncated, coverage]
      properties:
        policy_revision: { type: integer, minimum: 1 }
        agent_id: { $ref: '#/components/schemas/ProductID' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        evaluated: { type: integer, minimum: 0, maximum: 5000 }
        examined_count: { type: integer, minimum: 0, maximum: 5000 }
        eligible_count: { type: integer, minimum: 0, maximum: 5000 }
        next_window_to: { type: [string, 'null'], format: date-time }
        next_before_event_id: { oneOf: [{ $ref: '#/components/schemas/ProductID' }, { type: 'null' }] }
        would_block_rate: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 }, description: Fraction of eligible indexed events that would block on each evaluated trigger. }
        truncated: { type: boolean }
        coverage: { type: string, const: indexed_events_only }
    PolicySimulation:
      type: object
      additionalProperties: false
      required: [matches, would_block, example_session_ids]
      properties:
        matches: { type: integer, minimum: 0, maximum: 5000 }
        would_block: { type: integer, minimum: 0, maximum: 5000 }
        example_session_ids: { type: array, maxItems: 5, items: { type: string, minLength: 1, maxLength: 128 } }
        replay: { $ref: '#/components/schemas/PolicyReplayCoverage' }
    PolicyRolloutInput:
      description: Promote a current Environment revision from draft to monitor or monitor to enforced. Return an unedited enforced revision to its preceding monitor state with the current If-Match version. Each transition produces a new audited revision.
      type: object
      additionalProperties: false
      required: [state, target_id]
      properties:
        state: { type: string, enum: [monitor, enforced] }
        target_id: { type: string, minLength: 1, maxLength: 128 }
    PolicyRollout:
      type: object
      additionalProperties: false
      required: [policy_id, state, target_id]
      properties:
        policy_id: { $ref: '#/components/schemas/PolicyID' }
        state: { type: string, enum: [draft, monitor, enforced, disabled] }
        target_id: { type: string, minLength: 1, maxLength: 128 }
    RuntimeDecision:
      type: object
      additionalProperties: false
      required: [id, policy_id, environment_id, result, correlation_id, at]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        policy_id: { $ref: '#/components/schemas/PolicyID' }
        environment_id: { type: string, minLength: 1, maxLength: 128 }
        result: { type: string, enum: [allow, monitor, block] }
        correlation_id: { type: string, minLength: 1, maxLength: 128 }
        at: { type: string, format: date-time }
    RuntimeDecisionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/RuntimeDecision' } }
    FindingSeverity:
      type: string
      enum: [critical, high, medium, low]
    RiskFactor:
      type: object
      additionalProperties: false
      required: [name, evidence_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        evidence_id: { $ref: '#/components/schemas/ProductID' }
    Finding:
      type: object
      additionalProperties: false
      required: [id, source, title, severity, status, evidence_ids, risk_factors, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        source: { type: string, enum: [posture, prowler] }
        rule: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 256 }
        severity: { $ref: '#/components/schemas/FindingSeverity' }
        status: { $ref: '#/components/schemas/FindingStatus' }
        agent_id: { $ref: '#/components/schemas/ProductID' }
        path_id: { $ref: '#/components/schemas/ProductID' }
        compliance_context: { type: string, minLength: 1, maxLength: 128 }
        evidence_ids: { type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
        risk_factors: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/RiskFactor' } }
        current_ticket_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$', description: Completed ticket for this principal and finding version. }
        pending_ticket_key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$', description: Existing request key for a pending ticket for this principal and finding version. }
        acceptance_reason: { type: string, minLength: 1, maxLength: 512 }
        frameworks:
          type: array
          maxItems: 16
          description: 'AI security framework controls this finding is evidence for, derived from its rule. Absent when the rule has no mapping. A reference means the finding is relevant to the control, not that the control is met or failed.'
          items: { $ref: '#/components/schemas/FindingFrameworkReference' }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FindingFrameworkReference:
      type: object
      additionalProperties: false
      required: [framework, control, title]
      properties:
        framework: { type: string, enum: [owasp_agentic_top10_2026, owasp_llm_top10_2025, mitre_atlas, nist_ai_rmf_1_0, iso_iec_42001_2023, eu_ai_act] }
        control: { type: string, minLength: 1, maxLength: 32 }
        title: { type: string, minLength: 1, maxLength: 128 }
    FindingPage:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Finding' } }
        page_info: { $ref: '#/components/schemas/PageInfo' }
    FindingUpdateInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [open, under_review, resolved] }
    FindingAcceptanceInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
    FindingTicket:
      type: object
      additionalProperties: false
      required: [ticket_id]
      properties:
        ticket_id: { type: string, minLength: 1, maxLength: 128 }
    AttackPath:
      type: object
      additionalProperties: false
      required: [id, entry_id, sink_id, node_ids, state, evidence_ids, blocked_edge, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        entry_id: { $ref: '#/components/schemas/ProductID' }
        sink_id: { $ref: '#/components/schemas/ProductID' }
        node_ids: { type: array, minItems: 2, maxItems: 8, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
        state: { type: string, enum: [potential, observed, verified, blocked] }
        evidence_ids: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
        blocked_edge: { type: integer, minimum: -1, maximum: 6 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AttackPathPage:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AttackPath' } }
        page_info: { $ref: '#/components/schemas/PageInfo' }
    BreakOption:
      type: object
      additionalProperties: false
      required: [path_id, target_id, evidence_id, kind, rank]
      properties:
        path_id: { $ref: '#/components/schemas/ProductID' }
        target_id: { $ref: '#/components/schemas/ProductID' }
        evidence_id: { $ref: '#/components/schemas/ProductID' }
        kind: { type: string, enum: [remove_node, enforce_policy] }
        rank: { type: integer, minimum: 1, maximum: 8 }
    BreakOptionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/BreakOption' } }
    HomeSummary:
      type: object
      additionalProperties: false
      description: Counts cover authorized resources only. Both health fields are null when a separate current environment-view authorization is unavailable; null does not mean healthy or degraded. A current environment-view proof permits complementary boolean status values.
      required: [agent_count, high_risk_paths, verified_changes, blocked_changes, pending_approvals, oldest_approval_age_seconds, needs_human_runs, failed_runs, inconclusive_runs, recent_contained, recent_remediated, healthy, attention_required]
      properties:
        agent_count: { type: integer, minimum: 0, maximum: 9007199254740991 }
        high_risk_paths: { type: integer, minimum: 0, maximum: 9007199254740991 }
        verified_changes: { type: integer, minimum: 0, maximum: 9007199254740991 }
        blocked_changes: { type: integer, minimum: 0, maximum: 9007199254740991 }
        pending_approvals: { type: integer, minimum: 0, maximum: 9007199254740991 }
        oldest_approval_age_seconds: { type: integer, minimum: 0, maximum: 9007199254740991 }
        needs_human_runs: { type: integer, minimum: 0, maximum: 9007199254740991 }
        failed_runs: { type: integer, minimum: 0, maximum: 9007199254740991 }
        inconclusive_runs: { type: integer, minimum: 0, maximum: 9007199254740991 }
        recent_contained: { type: integer, minimum: 0, maximum: 9007199254740991 }
        recent_remediated: { type: integer, minimum: 0, maximum: 9007199254740991 }
        healthy: { type: [boolean, 'null'] }
        attention_required: { type: [boolean, 'null'] }
      oneOf:
        - required: [healthy, attention_required]
          properties:
            healthy: { const: true }
            attention_required: { const: false }
        - required: [healthy, attention_required]
          properties:
            healthy: { const: false }
            attention_required: { const: true }
        - required: [healthy, attention_required]
          properties:
            healthy: { type: 'null' }
            attention_required: { type: 'null' }
    SearchResult:
      type: object
      additionalProperties: false
      required: [id, type, name]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        type: { type: string, enum: [asset, agent, tool, identity, runtime, finding] }
        name: { type: string, minLength: 1, maxLength: 256 }
    SearchResultPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SearchResult' } }
    ProductError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - correlation_id
        - retryable
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$'
        message:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^(?!\s)(?!.*\s$)[^\x00-\x1F\x7F-\x9F]+$'
        correlation_id:
          $ref: '#/components/schemas/ProductID'
        retryable:
          type: boolean
  responses:
    ProductErrorResponse:
      description: Request rejected with a product error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductError'
