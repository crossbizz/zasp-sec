        '200': { description: Authorized Agent., content: { application/json: { schema: { $ref: '#/components/schemas/InventoryDetail' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    patch:
      operationId: updateAgent
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
        - ProductAPIToken: []
      summary: Update scoped ownership and canonical tags for one discovered Agent
      description: BrowserSession requests require the shared CSRF header and a same-origin Origin. ProductAPIToken requests omit the browser-only header at transport time; OpenAPI cannot conditionally require a parameter by security alternative.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentOwnershipInput' } } }
      responses:
        '200': { description: Updated Agent ownership and tags., headers: { ETag: { $ref: '#/components/headers/WorkflowETag' }, X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AgentMutation' } } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
