      responses:
        '200': { description: Registry decisions., content: { application/json: { schema: { $ref: '#/components/schemas/MCPRegistryPage' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
