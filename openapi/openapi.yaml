      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ProductID' } }
    get:
      operationId: getSingleTestCleanupRecovery
      summary: Read current-authorized original identity and cleanup recovery receipt
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
