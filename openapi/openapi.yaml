      properties:
        id: { $ref: '#/components/schemas/PolicyID' }
        name: { type: string, minLength: 1, maxLength: 256 }
        scope: { type: string, enum: [environment] }
        trigger: { type: string, minLength: 1, maxLength: 64 }
        conditions: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/PolicyCondition' } }
        action: { type: string, enum: [monitor, block] }
        rollout: { type: string, enum: [draft, monitor, enforced, disabled] }
        failure_mode: { type: string, enum: [open, closed] }
        risk: { type: string, enum: [low, medium, high, critical], description: 'Optional policy risk annotation. Omission means unknown.' }
    PolicyPage:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Policy' } }
