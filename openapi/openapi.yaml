        provider_token: { type: string, minLength: 1, maxLength: 4096 }
        state: { type: string, minLength: 32, maxLength: 512 }
        provider_token_type:
          type: string
          enum: [oauth, multi_tenant_magic_links]
          description: Identity provider redirect token type. Omitted means oauth; state may be omitted only with multi_tenant_magic_links.
    SessionCallbackResult:
      type: object
      additionalProperties: false
