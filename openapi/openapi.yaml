openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Agent Security Platform API
  version: 1.0.0
  description: Stable product API contract.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
paths:
  /api/v1/session/start:
    get:
      operationId: startSession
      summary: Start a repository-owned browser identity flow
      security: []
      parameters:
        - name: return_to
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048, pattern: '^/(?!/)' }
      responses:
        '302': { description: Redirect to the configured identity authorization endpoint. }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/bootstrap:
    get:
      operationId: bootstrapSession
      summary: Bootstrap the authenticated browser session and authorized scope
      security:
        - BrowserSession: []
      responses:
        '200':
          description: Authenticated principal, exact scope, capabilities, and CSRF value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionBootstrap' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/callback:
    post:
      operationId: completeSessionCallback
      summary: Exchange an identity-provider callback for a host-only browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCallbackInput' }
      responses:
        '200':
          description: Session established with a Secure, HttpOnly, SameSite=Lax __Host-zasp_session cookie and the state-bound return path.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Host-only __Host-zasp_session cookie; Secure, HttpOnly, Path=/, SameSite=Lax.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionCallbackResult' }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/sign-out:
    post:
      operationId: signOutSession
      summary: Revoke the browser session and expire its host-only cookie
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Session revoked and cookie expired. }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/scopes:
    get:
      operationId: listSessionScopes
      summary: List durable scopes authorized for the browser principal
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      responses:
        '200':
          description: Authorized durable scopes.
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionScopePage' } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/session/scope:
    put:
      operationId: switchSessionScope
      summary: Switch the browser session to an authorized durable scope
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SessionScopeSwitchInput' } } }
      responses:
        '204': { description: Session scope switched and protected caches must be reloaded. }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/organization:
    get:
      operationId: getOrganization
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Get the authenticated Organization
      responses:
        '200':
          description: Authenticated Organization.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List authorized Workspaces
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Authorized Workspace page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createWorkspace
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Create an Organization Workspace

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameInput'
      responses:
        '201':
          description: Created Workspace.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical Workspace identifier.
        schema:
          $ref: '#/components/schemas/ProductID'
    get:
      operationId: getWorkspace
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Get an authorized Workspace
      responses:
        '200':
          description: Authorized Workspace.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    patch:
      operationId: updateWorkspace
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Update an authorized Workspace

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameInput'
      responses:
        '200':
          description: Updated Workspace.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/environments:
    get:
      operationId: listEnvironments
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List authorized Workspace Environments
      parameters:
        - name: workspace_id
          in: query
          required: true
          description: Canonical parent Workspace identifier.
          schema:
            $ref: '#/components/schemas/ProductID'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Authorized Environment page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createEnvironment
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Create a Workspace Environment

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentCreateInput'
      responses:
        '201':
          description: Created Environment.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/environments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical Environment identifier.
        schema:
          $ref: '#/components/schemas/ProductID'
    get:
      operationId: getEnvironment
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Get an authorized Environment
      responses:
        '200':
          description: Authorized Environment.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    patch:
      operationId: updateEnvironment
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Update an authorized Environment

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameInput'
      responses:
        '200':
          description: Updated Environment.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentMutation'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/me:
    get:
      operationId: getCurrentPrincipal
      summary: Get the authenticated product principal
      responses:
        '200':
          description: Authenticated principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/members:
    get:
      operationId: listMembers
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List Organization members
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Organization member page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    patch:
      operationId: updateMemberRole
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Atomically update a member role and revoke active sessions
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemberRoleInput' } } }
      responses:
        '200': { description: Updated member., headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Principal' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/group-mappings:
    get:
      operationId: listGroupMappings
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List tenant IdP group mappings
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200': { description: Tenant group mapping page., content: { application/json: { schema: { $ref: '#/components/schemas/GroupMappingPage' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    patch:
      operationId: updateGroupMappings
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Create or replace a tenant IdP group mapping and revoke active sessions
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/FreshAuth'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GroupMappingInput' } } }
      responses:
        '200': { description: Updated group mapping., headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/GroupMapping' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/roles:
    get:
      operationId: listBuiltInRoles
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List built-in product roles
      responses:
        '200':
          description: Built-in role page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuiltInRolePage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/sso-connections:
    get:
      operationId: listSSOConnections
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List live SSO connections for the authenticated provider tenant
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200': { description: Tenant SSO connection page., content: { application/json: { schema: { $ref: '#/components/schemas/SSOConnectionPage' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    post:
      operationId: createSSOConnection
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Create a tenant-bound SSO connection with durable replay authority
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/FreshAuth'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SSOConnectionInput' } } }
      responses:
        '201': { description: Created SSO connection., headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SSOConnectionMutation' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/sso-connections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/SSOConnectionID' } }
    delete:
      operationId: deleteSSOConnection
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Delete a tenant-bound SSO connection with durable reconciliation
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/FreshAuth'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Deleted SSO connection., headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionDeletion' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/sso-connections/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/SSOConnectionID' } }
    post:
      operationId: testSSOConnection
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Test one active tenant-bound SSO connection
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/FreshAuth'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, maxProperties: 0 } } }
      responses:
        '200': { description: SSO connection is active., headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionTest' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/scim-connections:
    get:
      operationId: listSCIMConnections
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List live SCIM connections for the authenticated provider tenant
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200': { description: Tenant SCIM connection page., content: { application/json: { schema: { $ref: '#/components/schemas/SCIMConnectionPage' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    post:
      operationId: createSCIMConnection
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Create a tenant-bound SCIM connection and recoverable one-time credential
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/FreshAuth'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SCIMConnectionInput' } } }
      responses:
        '201': { description: Created SCIM connection credential., headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SCIMConnectionCredential' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/scim-connections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/SCIMConnectionID' } }
    delete:
      operationId: deleteSCIMConnection
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Delete a tenant-bound SCIM connection with durable reconciliation
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/FreshAuth'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Deleted SCIM connection., headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionDeletion' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/api-tokens:
    get:
      operationId: listAPITokens
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List scoped product API tokens
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: API token page without raw credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
    post:
      operationId: createAPIToken
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Create a scoped product API token

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITokenInput'
      responses:
        '201':
          description: Created API token with durable one-time reveal grant metadata.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenRevealGrant'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/api-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Canonical product API token identifier.
        schema:
          $ref: '#/components/schemas/ProductID'
    delete:
      operationId: revokeAPIToken
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Revoke a product API token

      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/ResourceVersion'
      responses:
        '200':
          description: Revoked API token.
          headers: { ETag: { $ref: '#/components/headers/WorkflowETag' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/admin/api-tokens/{id}/rotate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    post:
      operationId: rotateAPIToken
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Rotate a scoped product API token and create a durable one-time reveal grant
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '201': { description: Rotated API token with durable reveal grant metadata., content: { application/json: { schema: { $ref: '#/components/schemas/APITokenRevealGrant' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/api-token-reveal-grants:
    get:
      operationId: listAPITokenRevealGrants
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List this principal's pending exact-scope API token reveal grants
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200': { description: Pending reveal grant page., content: { application/json: { schema: { $ref: '#/components/schemas/APITokenRevealGrantPage' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/api-token-reveal-grants/{id}/reveal:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    post:
      operationId: revealAPIToken
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Reveal an unacknowledged API token credential in its exact scope
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '200': { description: Revealed API token credential; never cache., content: { application/json: { schema: { $ref: '#/components/schemas/APITokenRevealedCredential' } } } }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/admin/api-token-reveal-grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    delete:
      operationId: acknowledgeAPITokenRevealGrant
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Acknowledge a reveal grant and atomically destroy its encrypted credential
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '204': { description: Credential material destroyed. }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: List redacted Organization audit events
      description: >-
        With the explicit AuditExports runtime profile, reads the registered shared
        audit source using current browser authorization. The five filters below
        are supported only by that profile; historical deployments without it
        retain the legacy unfiltered audit list. Filters are case-sensitive and
        each query parameter may occur only once. Continuation cursors bind the
        current principal, selected scope, normalized filters and page limit.
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - name: actor_id
          in: query
          required: false
          description: Exact actor ProductID within the current organization.
          schema: { $ref: '#/components/schemas/ProductID' }
        - name: action
          in: query
          required: false
          description: Exact action, preserving the five retained mixed-case SSO/SCIM actions.
          schema: { type: string, minLength: 1, maxLength: 127, pattern: '^(?:[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*|identity_provider\.(?:createSSOConnection|deleteSSOConnection|testSSOConnection|createSCIMConnection|deleteSCIMConnection))(?![\s\S])' }
        - name: outcome
          in: query
          required: false
          description: Exact public outcome; denied includes stored rejected outcomes.
          schema: { type: string, enum: [succeeded, denied, failed] }
        - name: from
          in: query
          required: false
          description: Inclusive UTC occurrence time, normalized to six fractional digits. Must precede to when both are supplied.
          schema: { type: string, format: date-time, maxLength: 27, pattern: '^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\.[0-9]{1,6})?Z(?![\s\S])' }
        - name: to
          in: query
          required: false
          description: Exclusive UTC occurrence time, normalized to six fractional digits. Must follow from when both are supplied.
          schema: { type: string, format: date-time, maxLength: 27, pattern: '^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\.[0-9]{1,6})?Z(?![\s\S])' }
      responses:
        '200':
          description: Append-only audit event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '401':
          $ref: '#/components/responses/ProductErrorResponse'
        default:
          $ref: '#/components/responses/ProductErrorResponse'
  /api/v1/audit-exports:
    post:
      operationId: createAuditExport
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Request an organization-wide retained audit snapshot
      description: >-
        Mounted only by the configured AuditExports installation. Requires effective
        view_audit, current fresh browser authentication, same-origin Origin and CSRF.
        The empty request is independent of audit list filters. Retain the same
        idempotency key after an ambiguous response. Creation time is not capture time;
        a replay can return queued, processing, ready or failed. No download URL is issued.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuditExportInput' } } }
      responses:
        '201': { description: Durable export descriptor including an exact idempotent replay., content: { application/json: { schema: { $ref: '#/components/schemas/AuditExport' } } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/audit-exports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProductID' }
    get:
      operationId: getAuditExport
      security:
        - BrowserSession: []
          BrowserExpectedScope: []
      summary: Read durable audit export status and one verified chunk
      description: >-
        Mounted only by the configured AuditExports installation. Requires current
        browser authorization and effective view_audit, but not fresh authentication.
        Accepts only the optional opaque cursor. A ready response includes the bounded
        manifest and at most one immutable chunk; pending or failed contents are null.
        Cursors bind current principal, scope, export and manifest. A later authorized
        retrieval can restart without a cursor. Foreign or invalid cursor targets do
        not disclose existence. Temporary provider or readiness refusal returns 503.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque authenticated continuation returned by this operation; never a provider locator.
          schema: { type: string, minLength: 1, maxLength: 1024, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200': { description: Export status and at most one verified canonical chunk., content: { application/json: { schema: { $ref: '#/components/schemas/AuditExportRead' } } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
