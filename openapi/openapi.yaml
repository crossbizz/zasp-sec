  /api/v1/mcp-servers:
    get:
      operationId: listMCPServers
      summary: List the MCP servers discovered in the authorized scope
      description: >-
        One record per MCP server found without installing anything: an AgentCore gateway, a remote server an AWS account's
        network logs or a gateway target name, a server a repository's configuration declares, a Kubernetes workload that runs
        one, and a server a SaaS platform lists. Each carries the tools its declaration names, with a risk class from a catalog
        of name patterns, the agents that use it, and the registry's decision for its identity. No environment value, header,
        argument, URL path or tool description is stored.
