        status:
          $ref: '#/components/schemas/ConnectionStatus'
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        protocol:
          $ref: '#/components/schemas/SSOProtocol'
        identity_provider:
          $ref: '#/components/schemas/SSOIdentityProvider'
    SSOConnectionMutation:
      type: object
      additionalProperties: false
      required: [id, status, display_name, protocol, identity_provider, audit_correlation_id]
      properties:
        id:
          $ref: '#/components/schemas/SSOConnectionID'
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        protocol:
          $ref: '#/components/schemas/SSOProtocol'
        identity_provider:
          $ref: '#/components/schemas/SSOIdentityProvider'
