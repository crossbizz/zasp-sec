  /api/v1/gateway/mcp-servers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ProductID' } }
    put:
      operationId: putMCPGatewayServer
      summary: Register or change an MCP server behind the hosted gateway
      description: >-
        The caller chooses the identifier of a new server (a product identifier) and sends If-Match "0"; a change sends the version it
        read. The upstream address is an https URL on the default port with no credentials, query or fragment, and its host must be
        a public name: the gateway connects to public addresses only, checked at every connection. BrowserSession requests require
        the same-origin Origin and CSRF headers; ProductAPIToken requests omit both. The change is audited.
      parameters:
        - $ref: '#/components/parameters/BrowserMutationCSRFToken'
        - $ref: '#/components/parameters/BrowserMutationOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScheduleVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MCPGatewayServerInput' } } }
      responses:
        '200':
          description: The server after the change.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPGatewayServer' } } }
        '201':
          description: The registered server.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MCPGatewayServer' } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    delete:
      operationId: deleteMCPGatewayServer
      summary: Remove an MCP server from the hosted gateway
      description: >-
        Removes the server and the tools it listed; its decision records stay. If-Match names the version the caller read.
        BrowserSession requests require the same-origin Origin and CSRF headers; ProductAPIToken requests omit both.
      parameters:
        - $ref: '#/components/parameters/BrowserMutationCSRFToken'
        - $ref: '#/components/parameters/BrowserMutationOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScheduleVersion'
      responses:
        '204':
          description: The server was removed.
          headers:
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/gateway/activity:
    get:
      operationId: listGatewayActivity
      summary: List the decision records of the hosted gateway
      description: >-
        The decisions of the MCP gateway and of the model proxy, newest first. A record holds the decision, a reason, the matched
        rule identifiers with their modes and counts, the size and SHA-256 digest of the request or response body, and identifiers
        (server, tool, provider, model, agent). It never holds a prompt, an argument, a tool result or an answer.
      parameters:
        - { name: surface, in: query, required: false, schema: { type: string, enum: [mcp, llm] } }
        - { name: server_id, in: query, required: false, schema: { $ref: '#/components/schemas/ProductID' } }
        - { name: agent_id, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$' } }
        - { name: decision, in: query, required: false, schema: { type: string, enum: [allow, redact, block] } }
        - { name: before, in: query, required: false, description: The next_cursor of the page before., schema: { $ref: '#/components/schemas/ProductID' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: One page of decision records.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/GatewayDecisionPage' } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/gateway/mcp/{id}:
    parameters:
      - { name: id, in: path, required: true, description: The gateway server., schema: { $ref: '#/components/schemas/ProductID' } }
      - name: X-Zasp-Upstream-Authorization
        in: header
        required: false
        description: >-
          The upstream's own credential: for an MCP server the value of the Authorization header the server expects (for example
          "Bearer <token>"), for a model provider its API key (with or without "Bearer "). It is forwarded for this request only and
          is never stored or logged. The platform token in Authorization is never sent upstream.
        schema: { type: string, minLength: 1, maxLength: 4096 }
      - name: X-Zasp-Agent-Id
        in: header
        required: false
        description: The calling agent, recorded with each decision. Send the agent's identifier in the inventory to have its gateway traffic count as the agent's activity.
        schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$' }
    post:
      operationId: callMCPGateway
      summary: Send one MCP message to a server through the hosted gateway
      description: >-
        The MCP Streamable HTTP endpoint of a registered server: an agent's MCP configuration names this address instead of the
        server's own and sends an API token that has the use_gateway permission. The body is a single JSON-RPC 2.0 message (no
        batches). The gateway forwards it to the registered upstream with the session and protocol headers of the transport
        (MCP-Session-Id, MCP-Protocol-Version, Mcp-Method, Mcp-Name) and answers with one JSON-RPC message, a stream of server-sent
        events, or 202 for a notification. Under the Environment's policy a blocked or (by policy) unapproved server is refused
        with 403; tools/list hides the tools the policy denies and tools whose description carries an injected instruction;
        tools/call is refused for a denied tool, and its arguments and result go through the guardrail detectors (a blocked call or
        result is answered as a failed tool call, isError true). GET is not offered (405), so messages a server starts outside a
        request are not delivered. Only decisions are recorded, never arguments or results.
      security:
        - ProductAPIToken: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GatewayJSONRPCMessage' } } }
      responses:
        '200':
          description: The JSON-RPC response, or a stream of server-sent events that ends with it.
          headers:
            Cache-Control: { schema: { type: string } }
            MCP-Session-Id: { schema: { type: string, maxLength: 512 }, description: The session the upstream assigned at initialize. }
          content:
            application/json: { schema: { $ref: '#/components/schemas/GatewayJSONRPCMessage' } }
            text/event-stream: { schema: { type: string } }
        '202': { description: The upstream accepted a notification or a response. }
