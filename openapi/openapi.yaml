      parameters:
        - { name: after_tool_id, in: query, schema: { $ref: '#/components/schemas/ProductID' } }
      summary: Read persisted suggestions for the current agent purpose
      security: [{ BrowserSession: [], BrowserExpectedScope: [] }]
      responses:
        '200': { description: Current saved suggestions and observed coverage., content: { application/json: { schema: { $ref: '#/components/schemas/AgentSuggestionPage' } } } }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
  /api/v1/agents/{id}/suggestions/refresh:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ProductID' } }
    post:
      operationId: refreshAgentSuggestions
      summary: Generate suggestions using scoped indexed runtime tool events
      security: [{ BrowserSession: [], BrowserExpectedScope: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/BrowserMutationOrigin'
