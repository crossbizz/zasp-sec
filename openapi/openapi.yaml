  /api/v1/integrations/{id}/remediation-role:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/ProductID' } }
    get:
      operationId: getIntegrationRemediationRole
      summary: Get the remediation role of an integration
      description: >-
        Provider remediations (Security Agent actions that change the customer's account) never use the role discovery reads with.
        They use this separately configured role, and are refused while none is configured.
      responses:
        '200':
          description: The remediation role setting.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationRemediationRole' } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
    put:
      operationId: putIntegrationRemediationRole
      summary: Set or remove the remediation role of an integration
      description: >-
        BrowserSession requests require the same-origin Origin and CSRF headers; ProductAPIToken requests omit both. If-Match names
        the current version ("0" when no role is configured); a request that names a stale version is refused with 409, which also
        makes a repeated request safe. The role must be an IAM role of the account the integration reads and must not be the role
        discovery reads with. The change is audited.
      parameters:
        - $ref: '#/components/parameters/BrowserMutationCSRFToken'
        - $ref: '#/components/parameters/BrowserMutationOrigin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScheduleVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationRemediationRoleInput' } } }
      responses:
        '200':
          description: The remediation role setting after the change.
          headers:
            ETag: { $ref: '#/components/headers/WorkflowETag' }
            X-Audit-ID: { $ref: '#/components/headers/WorkflowAuditID' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationRemediationRole' } } }
        '400': { $ref: '#/components/responses/ProductErrorResponse' }
        '401': { $ref: '#/components/responses/ProductErrorResponse' }
        '403': { $ref: '#/components/responses/ProductErrorResponse' }
        '404': { $ref: '#/components/responses/ProductErrorResponse' }
        '409': { $ref: '#/components/responses/ProductErrorResponse' }
        '503': { $ref: '#/components/responses/ProductErrorResponse' }
        default: { $ref: '#/components/responses/ProductErrorResponse' }
