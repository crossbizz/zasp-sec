          $ref: '#/components/schemas/ProductID'
          description: Present only for createWorkspace; the server atomically creates and authorizes this initial development Environment.
        audit_correlation_id:
          $ref: '#/components/schemas/ProductID'
    EnvironmentMutation:
      type: object
      additionalProperties: false
      required: [id, organization_id, workspace_id, name, environment_class, version, audit_correlation_id]
      properties:
        id:
          $ref: '#/components/schemas/ProductID'
        organization_id:
          $ref: '#/components/schemas/ProductID'
        workspace_id:
          $ref: '#/components/schemas/ProductID'
        name:
          type: string
          minLength: 1
          maxLength: 128
        environment_class: { type: string, enum: [development, test, staging, production] }
        version: { type: integer, minimum: 1 }
        audit_correlation_id:
          $ref: '#/components/schemas/ProductID'
    ConnectionStatus:
      type: string
