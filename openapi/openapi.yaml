    FindingTicket:
      type: object
      additionalProperties: false
      required: [ticket_id]
      properties:
        ticket_id: { type: string, minLength: 1, maxLength: 128 }
    AttackPath:
      type: object
      additionalProperties: false
      required: [id, entry_id, sink_id, node_ids, state, evidence_ids, blocked_edge, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        entry_id: { $ref: '#/components/schemas/ProductID' }
        sink_id: { $ref: '#/components/schemas/ProductID' }
        node_ids: { type: array, minItems: 2, maxItems: 8, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
        state: { type: string, enum: [potential, observed, verified, blocked] }
        evidence_ids: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
        blocked_edge: { type: integer, minimum: -1, maximum: 6 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AttackPathPage:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AttackPath' } }
        page_info: { $ref: '#/components/schemas/PageInfo' }
    BreakOption:
      type: object
      additionalProperties: false
      required: [path_id, target_id, evidence_id, kind, rank]
      properties:
        path_id: { $ref: '#/components/schemas/ProductID' }
        target_id: { $ref: '#/components/schemas/ProductID' }
        evidence_id: { $ref: '#/components/schemas/ProductID' }
        kind: { type: string, enum: [remove_node, enforce_policy] }
        rank: { type: integer, minimum: 1, maximum: 8 }
    BreakOptionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/BreakOption' } }
    HomeSummary:
      type: object
      additionalProperties: false
      description: Counts cover authorized resources only. Both health fields are null when a separate current environment-view authorization is unavailable; null does not mean healthy or degraded. A current environment-view proof permits complementary boolean status values.
      required: [agent_count, high_risk_paths, verified_changes, blocked_changes, pending_approvals, oldest_approval_age_seconds, needs_human_runs, failed_runs, inconclusive_runs, recent_contained, recent_remediated, healthy, attention_required]
      properties:
        agent_count: { type: integer, minimum: 0, maximum: 9007199254740991 }
        high_risk_paths: { type: integer, minimum: 0, maximum: 9007199254740991 }
        verified_changes: { type: integer, minimum: 0, maximum: 9007199254740991 }
        blocked_changes: { type: integer, minimum: 0, maximum: 9007199254740991 }
        pending_approvals: { type: integer, minimum: 0, maximum: 9007199254740991 }
        oldest_approval_age_seconds: { type: integer, minimum: 0, maximum: 9007199254740991 }
        needs_human_runs: { type: integer, minimum: 0, maximum: 9007199254740991 }
        failed_runs: { type: integer, minimum: 0, maximum: 9007199254740991 }
        inconclusive_runs: { type: integer, minimum: 0, maximum: 9007199254740991 }
        recent_contained: { type: integer, minimum: 0, maximum: 9007199254740991 }
        recent_remediated: { type: integer, minimum: 0, maximum: 9007199254740991 }
        healthy: { type: [boolean, 'null'] }
        attention_required: { type: [boolean, 'null'] }
      oneOf:
        - required: [healthy, attention_required]
          properties:
            healthy: { const: true }
            attention_required: { const: false }
        - required: [healthy, attention_required]
          properties:
            healthy: { const: false }
            attention_required: { const: true }
        - required: [healthy, attention_required]
          properties:
            healthy: { type: 'null' }
            attention_required: { type: 'null' }
    SearchResult:
      type: object
      additionalProperties: false
      required: [id, type, name]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        type: { type: string, enum: [asset, agent, tool, identity, runtime, finding] }
        name: { type: string, minLength: 1, maxLength: 256 }
    SearchResultPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SearchResult' } }
    ProductError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - correlation_id
        - retryable
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$'
        message:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^(?!\s)(?!.*\s$)[^\x00-\x1F\x7F-\x9F]+$'
        correlation_id:
          $ref: '#/components/schemas/ProductID'
        retryable:
          type: boolean
  responses:
    ProductErrorResponse:
      description: Request rejected with a product error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductError'
