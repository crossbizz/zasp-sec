    post:
      operationId: downloadSecurityAgentExport
      security: [{ BrowserSession: [], BrowserExpectedScope: [] }]
      summary: Download original verified Security Agent export bytes
      description: Verifies immutable storage and run/step/selection binding, then rechecks current source authority and consumes the grant before sending bytes. A lost response requires a new grant. Human maps to internal readable format.
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 32, maxLength: 512 } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [format, token], properties: { format: { $ref: '#/components/schemas/ComplianceDownloadFormat' }, token: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$' } } } } } }
