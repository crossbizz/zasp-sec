      security: [{ BrowserSession: [], BrowserExpectedScope: [] }]
      summary: Download a verified frozen export with a single-use grant
      description: Current source permissions and grant/export expiry are checked again after immutable storage verification and before bytes. A lost response requires a newly authorized grant. Human format maps to the internal readable format.
