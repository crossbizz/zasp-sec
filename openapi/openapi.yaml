      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        environment_id: { $ref: '#/components/schemas/ProductID' }
        provider: { type: string }
        model: { type: string }
        purpose: { type: string }
        status: { type: string, enum: [queued, running, passed, failed] }
        requested_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    GuardrailInteraction:
      type: object
      additionalProperties: false
      required: [direction, text]
      properties:
        content_mode: { type: string, enum: [approved_code_snippet], description: Explicitly identifies an approved snippet for optional private evaluation. }
        direction: { type: string, enum: [input, output], description: input is text on its way into a model; output is text a model produced. }
        text: { type: string, description: The interaction text. At most 32768 bytes of UTF-8; a longer text is refused with 413. }
        agent_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$', description: 'Optional identifier of the agent, as the gateway knows it. Recorded with the decision.' }
        tool_name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$', description: Optional name of the tool whose call or result the text is. Recorded with the decision. }
    GuardrailMatchedRule:
      type: object
      additionalProperties: false
      required: [id, category, mode, count]
      properties:
        id: { $ref: '#/components/schemas/GuardrailRuleID' }
        category: { type: string, enum: [prompt_injection, sensitive_data] }
        mode: { type: string, enum: [block, redact, monitor] }
        count: { type: integer, minimum: 1, maximum: 9999 }
    GuardrailDecision:
      type: object
      additionalProperties: false
      required: [decision_id, decision, matched_rules, policy_version]
      properties:
        semantic_state: { type: string, enum: [coverage_degraded, shadow, confirmed, suppressed_benign, detected, screened] }
        coverage_degraded: { type: boolean }
        decision_id: { $ref: '#/components/schemas/ProductID' }
        decision: { type: string, enum: [allow, redact, block] }
        redacted_text: { type: string, description: 'Present only when decision is redact: the text with every match of a redacting rule replaced by [REDACTED:<rule id>]. Forward this instead of the original.' }
        matched_rules: { type: array, maxItems: 11, items: { $ref: '#/components/schemas/GuardrailMatchedRule' }, description: 'Every rule that matched and is not off, including rules that only monitor.' }
        policy_version: { type: integer, minimum: 0, maximum: 1000000 }
    GuardrailPolicyRule:
      type: object
      additionalProperties: false
      required: [id, category, description, mode, default_mode, redactable]
      properties:
        id: { $ref: '#/components/schemas/GuardrailRuleID' }
        rule_class: { type: string, enum: [hard, heuristic] }
        category: { type: string, enum: [prompt_injection, sensitive_data] }
        description: { type: string, minLength: 1, maxLength: 512 }
        mode: { $ref: '#/components/schemas/GuardrailMode' }
        default_mode: { $ref: '#/components/schemas/GuardrailMode' }
        redactable: { type: boolean, description: Only a redactable rule can have the redact mode. }
    GuardrailPolicy:
      type: object
      additionalProperties: false
      required: [environment_id, version, updated_at, rules]
      properties:
        environment_id: { $ref: '#/components/schemas/ProductID' }
        version: { type: integer, minimum: 0, maximum: 1000000 }
        updated_at: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        rules: { type: array, minItems: 11, maxItems: 11, items: { $ref: '#/components/schemas/GuardrailPolicyRule' } }
    GuardrailPolicyInput:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: object
          description: Rule identifier to mode. A rule that is not named has its default mode.
          maxProperties: 11
          propertyNames: { $ref: '#/components/schemas/GuardrailRuleID' }
          additionalProperties: { $ref: '#/components/schemas/GuardrailMode' }
    MCPToolRiskClass:
      type: string
      description: The risk class of a tool, from the words of its name. execute runs code or commands; write changes something; network fetches from an address; read only reads.
      enum: [execute, write, network, read, unclassified]
    GatewayPolicy:
      type: object
      additionalProperties: false
      description: The policy of the hosted gateway in an Environment. Version 0 means no policy was saved and the defaults apply.
      required: [environment_id, unapproved_servers, denied_tool_risks, requests_per_minute, version, updated_at, gateway_enabled]
      properties:
        environment_id: { $ref: '#/components/schemas/ProductID' }
        unapproved_servers: { type: string, enum: [allow, refuse], description: What happens to a server the MCP registry has no decision for. A blocked server is always refused. }
        denied_tool_risks: { type: array, maxItems: 5, uniqueItems: true, items: { $ref: '#/components/schemas/MCPToolRiskClass' }, description: Tools of these risk classes are hidden from tools/list and refused in tools/call. }
        requests_per_minute: { type: integer, minimum: 0, maximum: 100000, description: The requests one API token may send through the gateway in a minute. 0 is no limit. The limit is kept by each replica of the API. }
        version: { type: integer, minimum: 0, maximum: 1000000 }
        updated_at: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
        gateway_enabled: { type: boolean, description: Whether this deployment hosts the gateway's traffic routes. }
    GatewayPolicyInput:
      type: object
      additionalProperties: false
      required: [unapproved_servers, denied_tool_risks, requests_per_minute]
      properties:
        unapproved_servers: { type: string, enum: [allow, refuse] }
        denied_tool_risks: { type: array, maxItems: 5, uniqueItems: true, items: { $ref: '#/components/schemas/MCPToolRiskClass' } }
        requests_per_minute: { type: integer, minimum: 0, maximum: 100000 }
    MCPGatewayToolName:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'
    MCPGatewayTool:
      type: object
      additionalProperties: false
      description: A tool a server listed through the gateway. Its description and schema are never kept.
      required: [name, risk, last_seen_at]
      properties:
        name: { $ref: '#/components/schemas/MCPGatewayToolName' }
        risk: { $ref: '#/components/schemas/MCPToolRiskClass' }
        last_seen_at: { type: string, format: date-time }
    MCPGatewayServer:
      type: object
      additionalProperties: false
      description: >-
        An upstream MCP server registered behind the hosted gateway. gateway_path, under this API's origin, is the address an
        agent's MCP configuration names instead of upstream_url. identity is what the MCP registry decides (the server's host) and
        approval its decision. No credential of the upstream is stored.
      required: [id, name, upstream_url, upstream_host, gateway_path, identity, approval, enabled, allowed_tools, denied_tools, tools, tool_count, last_activity_at, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 128 }
        upstream_url: { type: string, format: uri, maxLength: 2048, pattern: '^https://' }
        upstream_host: { type: string, minLength: 1, maxLength: 253 }
        gateway_path: { type: string, pattern: '^/api/v1/gateway/mcp/pid_[0-9a-f-]{36}$' }
        identity: { type: string, pattern: '^host:', maxLength: 512 }
        approval: { type: string, enum: [approved, unapproved, blocked] }
        enabled: { type: boolean, description: A disabled server is refused at the gateway. }
        allowed_tools: { type: array, maxItems: 128, uniqueItems: true, items: { $ref: '#/components/schemas/MCPGatewayToolName' }, description: 'When not empty, the only tools that may be listed and called.' }
        denied_tools: { type: array, maxItems: 128, uniqueItems: true, items: { $ref: '#/components/schemas/MCPGatewayToolName' }, description: Tools that are never listed or called. }
        tools: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/MCPGatewayTool' }, description: 'The tools the server listed through the gateway, the most dangerous first.' }
        tool_count: { type: integer, minimum: 0 }
        last_activity_at: { oneOf: [{ type: 'null' }, { type: string, format: date-time }], description: The time of the newest decision record of the server. }
        version: { type: integer, minimum: 1, maximum: 1000000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MCPGatewayServerInput:
      type: object
      additionalProperties: false
      required: [name, upstream_url, enabled, allowed_tools, denied_tools]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        upstream_url: { type: string, format: uri, maxLength: 2048, pattern: '^https://', description: 'An https URL on the default port with a public host, no credentials, no query and no fragment.' }
        enabled: { type: boolean }
        allowed_tools: { type: array, maxItems: 128, uniqueItems: true, items: { $ref: '#/components/schemas/MCPGatewayToolName' } }
        denied_tools: { type: array, maxItems: 128, uniqueItems: true, items: { $ref: '#/components/schemas/MCPGatewayToolName' } }
    MCPGatewayServerList:
      type: object
      additionalProperties: false
      required: [items, gateway_enabled]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/MCPGatewayServer' } }
        gateway_enabled: { type: boolean, description: Whether this deployment hosts the gateway's traffic routes. }
    GatewayDecision:
      type: object
      additionalProperties: false
      description: One decision of the hosted gateway. It holds no prompt, argument, tool result or answer.
      required: [id, created_at, surface, operation, direction, decision, reason, rules, bytes, content_digest, server_id, server_name, tool_name, provider, model, agent_id, principal_id]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        created_at: { type: string, format: date-time }
        surface: { type: string, enum: [mcp, llm] }
        operation: { type: string, minLength: 1, maxLength: 64, description: 'The MCP method (tools/call, tools/list, ...) or the model API (chat.completions, responses, messages).' }
        direction: { type: string, enum: [request, response] }
        decision: { type: string, enum: [allow, redact, block] }
        reason:
          type: string
          enum: [none, guardrail, server_blocked, server_unapproved, server_disabled, tool_denied, tool_not_allowed, tool_risk_denied, tools_hidden, stream_window_exceeded]
        rules: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/GuardrailMatchedRule' } }
        bytes: { type: integer, minimum: 0, description: The size of the request or response body. }
        content_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$', description: The SHA-256 digest of the request or response body as the gateway received it. }
        server_id: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/ProductID' }] }
        server_name: { oneOf: [{ type: 'null' }, { type: string }], description: The name of the gateway server; null once it was removed. }
        tool_name: { oneOf: [{ type: 'null' }, { type: string }] }
        provider: { oneOf: [{ type: 'null' }, { type: string }] }
        model: { oneOf: [{ type: 'null' }, { type: string }] }
        agent_id: { oneOf: [{ type: 'null' }, { type: string }], description: The agent the request named in X-Zasp-Agent-Id. }
        principal_id: { $ref: '#/components/schemas/ProductID' }
    GatewayDecisionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/GatewayDecision' } }
        next_cursor: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/ProductID' }] }
    GatewayJSONRPCMessage:
      type: object
      description: A single JSON-RPC 2.0 message of the Model Context Protocol. Its members are the protocol's.
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, const: '2.0' }
    GatewayProviderBody:
      type: object
      description: A request or an answer of the model provider's API. Its members are the provider's.
    IntegrationRemediationRole:
      type: object
      additionalProperties: false
      description: >-
        The separate IAM role provider remediations of this integration use. It is named by ARN only; no credential is stored.
        supported is false for a provider without remediation actions. When configured is false, role_arn and updated_at are null
        and version is 0, and remediations of the integration are refused.
      required: [integration_id, supported, configured, role_arn, version, updated_at]
      properties:
        integration_id: { $ref: '#/components/schemas/ProductID' }
        supported: { type: boolean }
        configured: { type: boolean }
        role_arn: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/AWSRoleARN' }] }
        version: { type: integer, minimum: 0, maximum: 1000000 }
        updated_at: { oneOf: [{ type: 'null' }, { type: string, format: date-time }] }
    IntegrationRemediationRoleInput:
      type: object
      additionalProperties: false
      required: [role_arn]
      properties:
        role_arn:
          description: An IAM role of the account the integration reads, different from the role discovery reads with. The empty string removes the setting.
          oneOf:
            - { type: string, const: '' }
            - { $ref: '#/components/schemas/AWSRoleARN' }
    AWSRoleARN:
      type: string
      pattern: '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$'
    IntegrationSetupStatus:
      type: object
      additionalProperties: false
      required: [integration_id, connector_key, authorization, runtime_coverage, updated_at]
      properties:
        integration_id: { $ref: '#/components/schemas/ProductID' }
        connector_key: { type: string, enum: [aws, kubernetes, github, okta, microsoft, salesforce, saas, gcp] }
        authorization: { $ref: '#/components/schemas/IntegrationSetupAuthorization' }
        runtime_coverage: { $ref: '#/components/schemas/IntegrationRuntimeCoverage' }
        updated_at: { type: string, format: date-time }
    SensorMode:
      type: string
      enum: [metadata_only, full]
    SensorKind:
      type: string
      enum: [tetragon, otlp]
    SensorState:
      type: string
      enum: [pending, active, degraded, revoked]
    SensorInput:
      type: object
      additionalProperties: false
      required: [name, kind, mode]
      properties:
        runtime_sensor_id:
          $ref: '#/components/schemas/ProductID'
          description: Optional immutable pairing for OTLP only. Must identify an active Tetragon enrollment in the same scope. Omit for an unpaired semantic source. Event payloads cannot select this authority.
        name: { type: string, minLength: 1, maxLength: 128, pattern: '^(?!\s)(?!.*\s$)[^\x00-\x1F\x7F-\x9F]+$' }
        kind: { $ref: '#/components/schemas/SensorKind' }
        mode: { $ref: '#/components/schemas/SensorMode' }
    SensorUpdateInput:
      type: object
      additionalProperties: false
      required: [name, mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, pattern: '^(?!\s)(?!.*\s$)[^\x00-\x1F\x7F-\x9F]+$' }
        mode: { $ref: '#/components/schemas/SensorMode' }
    Sensor:
      type: object
      additionalProperties: false
      required: [id, name, kind, mode, state, version, token_expires_at, last_heartbeat_at, created_at, updated_at]
      properties:
        runtime_sensor_id:
          $ref: '#/components/schemas/ProductID'
          description: Configured immutable Tetragon enrollment pairing for an OTLP source. Absent when unpaired. This does not assert current anchor activity or correlation confidence.
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 128, pattern: '^(?!\s)(?!.*\s$)[^\x00-\x1F\x7F-\x9F]+$' }
        kind: { $ref: '#/components/schemas/SensorKind' }
        mode: { $ref: '#/components/schemas/SensorMode' }
        state: { $ref: '#/components/schemas/SensorState' }
        version: { type: integer, minimum: 1 }
        token_expires_at: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        last_heartbeat_at: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SensorEnrollment:
      type: object
      additionalProperties: false
      required: [id, name, kind, mode, state, version, token_expires_at, last_heartbeat_at, created_at, updated_at, token]
      properties:
        enrollment_binding:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
          description: Present and required for the enrollment-binding-v1 response profile. Server-derived public comparison hash of exact Organization, Workspace, Environment and sensor enrollment; unchanged by credential rotation. This grants no authority. Preserve it in sensorAgent.enrollmentBinding.
        runtime_sensor_id:
          $ref: '#/components/schemas/ProductID'
          description: Configured immutable Tetragon enrollment pairing for an OTLP source. Absent when unpaired. Re-pairing requires a new enrollment.
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 128, pattern: '^(?!\s)(?!.*\s$)[^\x00-\x1F\x7F-\x9F]+$' }
        kind: { $ref: '#/components/schemas/SensorKind' }
        mode: { $ref: '#/components/schemas/SensorMode' }
        state: { $ref: '#/components/schemas/SensorState' }
        version: { type: integer, minimum: 1 }
        token_expires_at: { type: string, format: date-time }
        last_heartbeat_at: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        token:
          type: string
          minLength: 81
          maxLength: 81
          pattern: '^zasp_sensor_v1\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}$'
          description: One-time enrollment credential returned only by create or rotate.
    SensorPage:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Sensor' }
        page_info: { $ref: '#/components/schemas/PageInfo' }
    SensorCoverage:
      type: object
      additionalProperties: false
      required: [sensor_id, supported, status, last_heartbeat, kernel, btf, capabilities, event_rate, drops]
      properties:
        sensor_id: { $ref: '#/components/schemas/ProductID' }
        supported: { type: boolean }
        status: { type: string, enum: [pending, healthy, degraded, offline, revoked] }
        last_heartbeat: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        kernel: { type: string, maxLength: 128 }
        btf: { type: boolean }
        capabilities:
          type: array
          uniqueItems: true
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 96 }
        event_rate: { type: integer, minimum: 0, maximum: 1000000000 }
        drops: { type: integer, minimum: 0, maximum: 1000000000 }
    InventoryKind:
      type: string
      enum: [asset, agent, tool, identity, runtime]
    InventoryFreshnessState:
      type: string
      enum: [fresh, stale]
    InventorySummary:
      type: object
      additionalProperties: false
      required: [id, name, kind, owner, team, tags, evidence_id, confidence_basis_points, first_seen, last_seen, observed_at, fresh_until, freshness_state, version, provider, source_kind, discovery, management_state, last_activity_at, activity_state]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 256 }
        kind: { $ref: '#/components/schemas/InventoryKind' }
        provider: { $ref: '#/components/schemas/InventoryProvider' }
        source_kind: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$' }
        discovery: { $ref: '#/components/schemas/InventoryDiscovery' }
        management_state: { $ref: '#/components/schemas/InventoryManagementState' }
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: For an agent, the latest time activity is known, from what is recorded without anything installed - the newest runtime event attributed to the agent; for an AWS agent the newest time CloudTrail shows its role invoking a model inside the collector's seven-day window (to the hour); or, where the provider's logs showed activity but no event time was recorded (network logs, or an invocation without a recorded time), the time of that collection. Null when there is none, and for every other kind.
        activity_state: { $ref: '#/components/schemas/InventoryActivityState' }
        attribution: { $ref: '#/components/schemas/InventoryAttribution' }
        owner: { type: string, maxLength: 128 }
        team: { type: string, maxLength: 128 }
        tags:
          type: array
          maxItems: 32
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        evidence_id: { $ref: '#/components/schemas/ProductID' }
        confidence_basis_points: { type: integer, minimum: 1, maximum: 10000 }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }
        fresh_until: { type: string, format: date-time }
        freshness_state: { $ref: '#/components/schemas/InventoryFreshnessState' }
        version: { type: integer, minimum: 1 }
    InventoryAttribution:
      type: object
      description: Where the object lives, which integration found it and, for an agent, who created it and the owner and team that suggests. It is derived on every read from what the collectors recorded without anything installed. A member is null where the provider says nothing; nothing is guessed. The owner and team a person assigned are the summary's own owner and team and are never replaced by a suggestion.
      additionalProperties: false
      required: [location, integration, creator, suggested_owner, suggested_team]
      properties:
        location:
          oneOf:
            - { type: 'null' }
            - type: object
              description: The account, project, subscription, tenant, organization, repository, cluster or namespace the object was found in.
              additionalProperties: false
              required: [kind, id, label]
              properties:
                kind: { type: string, enum: [aws_account, gcp_project, gcp_scope, github_repository, github_organization, kubernetes_namespace, kubernetes_cluster, microsoft_subscription, power_platform_environment, microsoft_tenant, okta_tenant, salesforce_org, saas_workspace] }
                id: { type: string, minLength: 1, maxLength: 512, description: 'The identifier the provider uses, for example an AWS account id, a project id, owner/repository or cluster/namespace.' }
                label: { type: string, minLength: 1, maxLength: 256, description: 'What to show. The provider''s name for a Microsoft tenant, a Salesforce org or a SaaS workspace; the identifier everywhere else.' }
        integration:
          oneOf:
            - { type: 'null' }
            - type: object
              description: The integration whose observation of the object is the winning one.
              additionalProperties: false
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/ProductID' }
                name: { type: string, minLength: 1, maxLength: 128 }
        creator:
          oneOf:
            - { type: 'null' }
            - type: object
              description: For an agent, the identity the provider says created it (source cloudtrail, audit_log or provider_record), or the owner the object's own metadata names (source codeowners, label or annotation). Null for every other kind and where the provider does not say.
              additionalProperties: false
              required: [identity, created_at, source]
              properties:
                identity: { type: string, pattern: '^[A-Za-z0-9@][A-Za-z0-9._%+@:/=-]{0,253}$', description: 'An email address, a user name, a login, a team handle or a role name, as the provider records it.' }
                created_at: { type: [string, 'null'], format: date-time }
                source: { $ref: '#/components/schemas/InventoryCreatorSource' }
        suggested_owner:
          oneOf:
            - { type: 'null' }
            - type: object
              description: For an agent no person has given an owner, the creator. Null once an owner is assigned, and for a creator an audit log names only by an opaque account id.
              additionalProperties: false
              required: [value, source]
              properties:
                value: { type: string, minLength: 1, maxLength: 128 }
                source: { $ref: '#/components/schemas/InventoryCreatorSource' }
        suggested_team:
          oneOf:
            - { type: 'null' }
            - type: object
              description: For an agent no person has given a team, the team a label or annotation of the object names (label), otherwise the department of the Okta user of this Environment whose email address is the creator's (okta). Null once a team is assigned.
              additionalProperties: false
              required: [value, source]
              properties:
                value: { type: string, minLength: 1, maxLength: 128 }
                source: { type: string, enum: [label, okta] }
    InventoryCreatorSource:
      type: string
      description: How the creator is known. cloudtrail is an AWS CloudTrail create event; audit_log the audit log of another provider; provider_record a creator or owner field of the provider's own record of the object; codeowners the repository's CODEOWNERS file; label and annotation a label or annotation the object carries.
      enum: [annotation, audit_log, cloudtrail, codeowners, label, provider_record]
    InventoryProvider:
      type: string
      description: The discovery provider. saas is the generic provider of every SaaS platform read through a Nango connection; the platform (databricks, slack, ...) is the platform stable field of the object and the platform of its discovery. gcp is Google Cloud, read as the projects of one organization, folder or project.
      enum: [aws, kubernetes, github, okta, microsoft, salesforce, saas, gcp]
    InventoryDiscovery:
      type: object
      description: How the object was found. An agent is declared by its owner, listed by the provider's own control plane, or inferred from catalog signals. Every other kind is a provider record.
      additionalProperties: false
      required: [method, platform, signals]
      properties:
        method: { type: string, enum: [declared, provider_api, inferred] }
        platform: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$' }
        signals:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}:[a-z0-9][a-z0-9_.-]{0,63}$' }
    InventoryManagementState:
      type: string
      description: For an agent, dismissed when it was found without a declaration and a person marked it as not an agent (the reserved tag not-an-agent, set through the ownership update; the tag is ignored on a declared agent, which stays managed). Otherwise unmanaged while it was found without a declaration and has no owner, and managed in every other case. Not applicable to other kinds.
      enum: [managed, unmanaged, dismissed, not_applicable]
    InventoryActivityState:
      type: string
      description: For an agent, active when last_activity_at is within 30 days; inactive when it is older, or when there is none and the provider reports the agent's execution role unused for 90 days (an open agent_role_unused_90_days finding); unknown when there is no activity source at all, which is not the same as inactive. Every other kind is not_applicable.
      enum: [active, inactive, unknown, not_applicable]
    InventoryRecord:
      $ref: '#/components/schemas/InventorySummary'
    AgentEvidencePackStatus:
      type: string
      description: Whether a section holds everything (complete), stops at its bound (truncated), or is empty because the caller may not read it (not_permitted), it is read only with a browser session (browser_session_required) or it could not be read when the pack was generated (unavailable).
      enum: [complete, truncated, not_permitted, browser_session_required, unavailable]
    AgentEvidencePack:
      type: object
      additionalProperties: false
      required: [schema_version, generated_at, organization_id, workspace_id, environment_id, agent, findings, security_agent_runs, red_team_tests, red_team_runs]
      properties:
        schema_version: { type: string, const: agent-evidence-pack-v1 }
        generated_at: { type: string, format: date-time }
        organization_id: { $ref: '#/components/schemas/ProductID' }
        workspace_id: { $ref: '#/components/schemas/ProductID' }
        environment_id: { $ref: '#/components/schemas/ProductID' }
        agent: { $ref: '#/components/schemas/InventoryDetail' }
        findings:
          type: object
          description: The findings on the agent, each with its framework references. At most 200.
          additionalProperties: false
          required: [status, items]
          properties:
            status: { $ref: '#/components/schemas/AgentEvidencePackStatus' }
            items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Finding' } }
        security_agent_runs:
          type: object
          description: The Security Agent runs related to those findings, each once, with the run detail the run operation returns (plan, authorization, approvals, execution and verification). At most 50.
          additionalProperties: false
          required: [status, items]
          properties:
            status: { $ref: '#/components/schemas/AgentEvidencePackStatus' }
            items:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [finding_ids, run]
                properties:
                  finding_ids: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { $ref: '#/components/schemas/ProductID' } }
                  run: { type: object, additionalProperties: true, description: The body of getSecurityAgentRun for this run. }
        red_team_tests:
          type: object
          description: The red team definitions whose target is the agent. At most 200.
          additionalProperties: false
          required: [status, items]
          properties:
            status: { $ref: '#/components/schemas/AgentEvidencePackStatus' }
            items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/TestDefinition' } }
        red_team_runs:
          type: object
          description: The runs of those definitions. At most 200.
          additionalProperties: false
          required: [status, items]
          properties:
            status: { $ref: '#/components/schemas/AgentEvidencePackStatus' }
            items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/TestRun' } }
    AgentEvidencePackResponse:
      type: object
      additionalProperties: false
      required: [pack, markdown]
      properties:
        pack: { $ref: '#/components/schemas/AgentEvidencePack' }
        markdown: { type: string, minLength: 1, description: The same pack rendered as Markdown for a reader. }
    InventorySourceObservation:
      type: object
      additionalProperties: false
      required: [integration_id, provider, source, source_identifier, snapshot_id, generation, evidence_id, confidence_basis_points, observed_at, fresh_until, projection_version, winning]
      properties:
        integration_id: { $ref: '#/components/schemas/ProductID' }
        provider: { type: string, enum: [aws, kubernetes, github, okta, microsoft, salesforce, saas, gcp] }
        source: { type: string, pattern: '^[a-z][a-z0-9_]{1,63}$' }
        source_identifier: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        snapshot_id: { $ref: '#/components/schemas/ProductID' }
        generation: { type: integer, minimum: 1 }
        evidence_id: { $ref: '#/components/schemas/ProductID' }
        confidence_basis_points: { type: integer, minimum: 1, maximum: 10000 }
        observed_at: { type: string, format: date-time }
        fresh_until: { type: string, format: date-time }
        projection_version: { type: integer, minimum: 1 }
        winning: { type: boolean }
    InventoryEvidenceReference:
      type: object
      additionalProperties: false
      required: [id, checksum, media_type, schema_version, parser_version, tool_version, collected_at, size_bytes]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        checksum: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        media_type: { type: string, minLength: 1, maxLength: 128 }
        schema_version: { type: string, minLength: 1, maxLength: 64 }
        parser_version: { type: string, minLength: 1, maxLength: 64 }
        tool_version: { type: string, minLength: 1, maxLength: 64 }
        collected_at: { type: string, format: date-time }
        size_bytes: { type: integer, minimum: 1, maximum: 536870912 }
    InventoryDetail:
      type: object
      additionalProperties: false
      required: [summary, sources, evidence]
      properties:
        summary: { $ref: '#/components/schemas/InventorySummary' }
        sources: { type: array, minItems: 1, maxItems: 64, items: { $ref: '#/components/schemas/InventorySourceObservation' } }
        evidence: { type: array, minItems: 1, maxItems: 64, items: { $ref: '#/components/schemas/InventoryEvidenceReference' } }
    InventoryPage:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/InventorySummary' } }
        page_info: { $ref: '#/components/schemas/PageInfo' }
    AgentAccess:
      type: object
      additionalProperties: false
      required: [agent_id, ai_actions, mcp_servers, data_stores, skills, tools, tool_kinds]
      properties:
        agent_id: { $ref: '#/components/schemas/ProductID' }
        tools:
          type: array
          maxItems: 64
          description: The topics and actions the agent's platform lists for it, topics first. Empty for an agent of a platform that lists none.
          items:
            type: object
            additionalProperties: false
            required: [id, name, kind, target, confirmation]
            properties:
              id: { $ref: '#/components/schemas/ProductID' }
              name: { type: string, minLength: 1, maxLength: 256 }
              kind: { type: string, enum: [topic, action] }
              target: { oneOf: [{ type: 'null' }, { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$' }], description: 'What an action invokes, for example flow or apex. Null for a topic and where the platform did not state it.' }
              confirmation: { oneOf: [{ type: 'null' }, { type: boolean }], description: 'Whether an action asks for confirmation before it runs. Null for a topic and where the platform did not state it.' }
        tool_kinds:
          type: array
          maxItems: 16
          description: The kinds of tool the agent's platform states for it, for example code_interpreter, file_search or mcp, in order. Empty where the platform states none.
          items: { type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,63}$' }
        ai_actions:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [window_days, granted, used, unused]
              properties:
                window_days: { type: integer, minimum: 1, maximum: 90 }
                granted: { type: array, minItems: 1, maxItems: 32, items: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}:[A-Za-z]{1,64}$' } }
                used: { type: array, maxItems: 32, items: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}:[A-Za-z]{1,64}$' } }
                unused: { type: array, maxItems: 32, items: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}:[A-Za-z]{1,64}$' }, description: 'Granted actions the audit log can show and did not. An action it cannot show is never listed.' }
        mcp_servers:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [id, name, identity, approval]
            properties:
              id: { $ref: '#/components/schemas/ProductID' }
              name: { type: string, minLength: 1, maxLength: 256 }
              identity: { type: string, minLength: 3, maxLength: 512 }
              approval: { type: string, enum: [approved, unapproved, blocked] }
        data_stores:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [id, name, service, access, scope]
            properties:
              id: { $ref: '#/components/schemas/ProductID' }
              name: { type: string, minLength: 1, maxLength: 256 }
              service: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
              access: { type: string, enum: [read, write] }
              scope: { type: string, enum: [resource, service], description: 'service means every resource of the data service.' }
        skills:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [id, path, kind]
            properties:
              id: { $ref: '#/components/schemas/ProductID' }
              path: { type: string, minLength: 1, maxLength: 512 }
              kind: { type: string, enum: [skill, agent_instructions, editor_rules] }
    MCPTool:
      type: object
      additionalProperties: false
      required: [id, name, risk]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 256 }
        risk: { type: string, enum: [execute, write, network, read, unclassified], description: 'The most dangerous class the words of the tool''s name fall in.' }
    MCPServerAgent:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 256 }
    MCPServer:
      type: object
      additionalProperties: false
      required: [id, name, provider, source_kind, source, transport, endpoint_host, command, package, package_pinned, plain_http, auth, identity, approval, tools, tool_count, agents, agent_count, first_seen_at, last_seen_at]
      properties:
        id: { $ref: '#/components/schemas/ProductID' }
        name: { type: string, minLength: 1, maxLength: 256 }
        provider: { type: string, enum: [aws, github, kubernetes, saas, gcp] }
        source_kind: { type: string, enum: [aws_agentcore_gateway, aws_mcp_server, github_mcp_server, kubernetes_mcp_server, saas_mcp_server, gcp_mcp_server] }
        source: { type: string, enum: [agentcore_gateway, egress, gateway_target, repository_config, workload, saas_api, provider_api], description: 'How the server was found.' }
        transport: { type: [string, 'null'], enum: [stdio, http, sse, null] }
        endpoint_host: { type: [string, 'null'], minLength: 1, maxLength: 253, description: 'Host of a remote server. The URL path and query are never stored.' }
        command: { type: [string, 'null'], minLength: 1, maxLength: 64, description: 'Base name of a stdio server''s command. Arguments are never stored.' }
        package: { type: [string, 'null'], minLength: 1, maxLength: 256, description: 'Package a launcher starts, without its version.' }
        package_pinned: { type: [boolean, 'null'], description: 'Whether the package carries an exact version; null when there is no package.' }
        plain_http: { type: boolean }
        auth: { type: string, enum: [declared, none, not_applicable, unknown], description: 'Whether the declaration names any authentication. Only its presence is stored.' }
        identity: { type: string, minLength: 3, maxLength: 512, description: 'What a registry decision names.' }
        approval: { type: string, enum: [approved, unapproved, blocked] }
        tools: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/MCPTool' } }
        tool_count: { type: integer, minimum: 0, maximum: 9007199254740991 }
        agents: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/MCPServerAgent' } }
        agent_count: { type: integer, minimum: 0, maximum: 9007199254740991 }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    MCPServerPage:
      type: object
      additionalProperties: false
      required: [items, page_info]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MCPServer' } }
        page_info: { $ref: '#/components/schemas/PageInfo' }
    MCPRegistryEntry:
      type: object
