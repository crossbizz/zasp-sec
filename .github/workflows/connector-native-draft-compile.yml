  legacy-device-association-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.8
          cache: false
      - name: Require all 18 exact existing-credential association component results
        shell: bash
        run: |
          set -euo pipefail
          umask 0027
          test "$(go version)" = 'go version go1.26.8 linux/amd64'
          python3 - <<'PYLEGACYDEVICEASSOCIATION'
