              result = subprocess.run(command, stdout=out, stderr=err, timeout=1200, check=False)
              executions.append({'module':'services/platform','command':command,'exit_code':result.returncode,'classification':'compile-only-no-behavior'})
              if result.returncode != 0 and status == 0:
                  status = result.returncode
          Path('gateway-bootstrap-component-executions.json').write_text(json.dumps(executions, indent=2)+'\n')
          assert len(executions) == 4 and all(item['exit_code'] == 0 for item in executions), 'required behavior or API compilation failed'
          print(json.dumps(validate_events(load_events('gateway-bootstrap-components.jsonl'), status, expected), sort_keys=True))
          PYGATEWAYBOOTSTRAP
      - name: Preserve component and compile-only evidence with separate labels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-bootstrap-component-evidence
          path: |
