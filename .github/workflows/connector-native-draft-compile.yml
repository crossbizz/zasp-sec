name: Connector native draft compilation

on:
  pull_request:
    paths:
      - 'services/platform/**'
      - 'services/gateway-control/**'
      - 'services/runtime-gateway/**'
      - 'services/health/**'
      - 'services/sensor-agent/**'
      - 'cmd/agentsecctl/**'
      - 'deploy/production/**'
      - 'deploy/staging/**'
      - 'app/**'
      - 'apps/web/api/**'
      - 'openapi/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/validate_agent_read_components.py'
      - 'scripts/validate_agent_read_components_test.py'
      - '.github/workflows/connector-native-draft-compile.yml'
      - '.github/connector-native-compile-source-pins.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: false
      - name: Check frozen source association and absence of activation configuration
        run: |
          test "$(go version)" = 'go version go1.26.8 linux/amd64'
          test -z "${ZASP_CONNECTOR_MAINTENANCE_PROFILE_CHECKSUM:-}"
          test -z "${ZASP_CONNECTOR_MAINTENANCE_POSTGRES_DSN:-}"
          test -z "${ZASP_CONNECTOR_MAINTENANCE_KEY_FILE:-}"
          test -z "${ZASP_RETENTION_PROFILE_CHECKSUM:-}"
          test -z "${ZASP_RETENTION_JOURNAL_PROFILE_CHECKSUM:-}"
          test -z "${ZASP_RETENTION_CONFIGURATION_FILE:-}"
          python3 - <<'PYVERIFY'
          import hashlib, json
          from pathlib import Path
          source = json.loads(Path('.github/connector-native-compile-source-pins.json').read_text())
          assert len(source['sources']) == 925
          for item in source['sources']:
              raw = Path(item['path']).read_bytes()
              assert len(raw) == item['bytes']
              assert hashlib.sha256(raw).hexdigest() == item['sha256'], item['path']
          PYVERIFY
      - name: Compile nineteen affected packages without executing test binaries
        run: |
          output=$(mktemp -d "${RUNNER_TEMP}/connector-native-compile.XXXXXX")
          for package in connectormaintenance connectormaintenancecutover authorization approvalmaintenance apiserver agentsec-api agentsec-worker runtimeservices migrations optionalegress agentsec-migrate cmd/zasp-authorization-reconcile cmd/zasp-controlled-maintenance-cutover cmd/zasp-maintenance-register runtimeevent runtimeindex runtimeindex/opensearchdriver policy/opensearchhistory orchestration; do
            echo "::group::Compile $package"
            name=${package//\//-}
            go test -C services/platform -race -p 1 -c -o "$output/$name.test" "./$package"
            echo '::endgroup::'
          done
          git diff --exit-code -- services/platform services/health
      - name: Atomic connector and retained writer journal application contracts
        timeout-minutes: 5
        run: |
          python3 - <<'PYJOURNALAPPLICATION'
          import hashlib, json, subprocess, tempfile
          from pathlib import Path
          base = 'github.com/zasp-ai/zasp-sec/services/platform/'
          groups = {
              'connectormaintenance': {
                  'TestAtomicConnectorObservation': ['#00', 'before_pending', 'user', 'service', 'wrong_model', 'after_source', 'after_revision', 'after_expiry', 'after_error'],
                  'TestAtomicObservationStoredValues': ['exact_stored_pair', 'unknown_outer_field', 'internal_disposition', 'missing_revision', 'foreign_organization', 'pending_projection', 'unknown_nested_field', 'wrong_source_pin', 'null_facts'],
                  'TestAtomicObservationDatabaseFailureClasses': ['expired_or_changed_lease', 'missing_original_task', 'current_source_or_permission_denied'],
              },
              'runtimeindex': {'TestRetainedJournalClaimCrashAndOneUseBoundaries': ['reserve', 'unknown_commit', 'replay', 'confirmed']},
              'runtimeindex/opensearchdriver': {'TestRetainedJournalAtActualSerializedBulkBoundary': [family+'/'+outcome for family in ['raw', 'session-v1', 'session-v2'] for outcome in ['created', 'known_conflict', 'lost_acknowledgement', 'truncated_response', 'reserve_failure', 'unknown_claim', 'replay_claim', 'append_failure']]},
              'agentsec-worker': {
                  'TestRetainedWorkerJournalArtifactCommitAndCapturedBoundaries': ['confirmed', 'uncertain_put', 'changed_pinned_bytes', 'claim_unknown', 'late_captured', 'suppressed_zero_request'],
                  'TestRetainedWriterJournalExactUnknownCommitRecovery': [operation+'/'+mode for operation in ['begin_execution', 'admit_execution', 'reserve_request', 'claim_send', 'append_terminal', 'close_inventory', 'seal_partition'] for mode in ['exact', 'mismatch', 'lookup_unavailable']],
              },
              'agentsec-migrate': {'TestRetentionJournalOperatorBoundary': []},
              'migrations': {'TestRetentionJournalCompiledClosureAndInstaller': [], 'TestRetentionJournalRawSealHasNoReadinessRecursion': []},
          }
          expected = {(base+package, name): {'run': 0, 'pass': 0} for package, tops in groups.items() for top, children in tops.items() for name in [top]+[top+'/'+child for child in children]}
          assert len(groups) == 6 and sum(len(tops) for tops in groups.values()) == 10 and len(expected) == 86
          def check_sources():
              source = json.loads(Path('.github/connector-native-compile-source-pins.json').read_text())
              assert len(source['sources']) == 925
              for item in source['sources']:
                  raw = Path(item['path']).read_bytes()
                  assert len(raw) == item['bytes'] and hashlib.sha256(raw).hexdigest() == item['sha256'], item['path']
          check_sources()
          names = [name for tops in groups.values() for name in tops]
          with tempfile.TemporaryFile() as output, tempfile.TemporaryFile() as errors:
              result = subprocess.run(['go', 'test', '-C', 'services/platform', '-race', '-p=1', '-count=1', '-timeout=2m', '-json', '-run', '^('+'|'.join(names)+')$']+['./'+package for package in groups], stdout=output, stderr=errors, timeout=180)
              assert output.tell() <= 8*1024*1024 and errors.tell() <= 1024*1024, 'output bounds exceeded'
              output.seek(0)
              package_pass = {base+package: 0 for package in groups}
              valid = True
              for line in output:
                  event = json.loads(line)
                  package, name, action = event.get('Package'), event.get('Test'), event.get('Action')
                  if package not in package_pass or action not in ['start', 'run', 'output', 'pass']:
                      valid = False
                      continue
                  if name is None:
                      if action == 'pass':
                          package_pass[package] += 1
                      continue
                  key = (package, name)
                  if key not in expected:
                      valid = False
                  elif action in expected[key]:
                      expected[key][action] += 1
              missing = sum(count != {'run': 1, 'pass': 1} for count in expected.values())
              print('::notice title=Connector and journal application contracts::packages='+str(len(groups))+'; tops='+str(len(names))+'; named='+str(len(expected))+'; missingOrDuplicate='+str(missing)+'; validEvents='+str(valid)+'; exit='+str(result.returncode)+'. Component application checks only; no native SQL or deployed provider acceptance.')
              assert result.returncode == 0 and valid and not missing and all(count == 1 for count in package_pass.values()), 'connector/journal application group refused'
          check_sources()
          PYJOURNALAPPLICATION
      - name: Compiled source pin retains fresh connector authorization
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^TestCompiledPinKeepsFreshConnectorAuthority$' ./connectormaintenance
      - name: Existing connector handler and reconciler application regressions
        timeout-minutes: 5
        run: |
          python3 - <<'PYAPPLICATION'
          import hashlib, json, subprocess, tempfile
          from pathlib import Path
          pins = {'services/platform/apiserver/approval_projection_visibility_test.go': 'b8f964ffe558539a52e1fca5c97cac4f7add6e366b18a88f0e6682e72def526b', 'services/platform/apiserver/approval_activation_failure_observation_test.go': 'd521fb9a290f1969ea355e5d95632f6777132a21f86eade1f18a5db1b47d7d18', 'services/platform/apiserver/approval_activation_future_family_test.go': 'baf589a10beee3b81ee430757a81adb06ab255be992f7cd75bb1896c3c265158', 'services/platform/apiserver/connector_maintenance_failure_observation_test.go': '38e59d1e256423bda47285786edcd4ecbb1f95fb32a85153559e9ce65aabb36f', 'services/platform/apiserver/connector_handler_test.go': 'e62ba6a2e46a3c3b3b60a662d24b92f0ba4a1b409d3ed0c4f5d1d4ff0f23d80f', 'services/platform/apiserver/connector_reconciler_test.go': 'e8bcdefa818f3467c58f51a79085e48a3b2b2c89db40ce8a8fb6c2c0f3862309'}
          names = ['TestApprovalImmediateGrantSetPermissionCases', 'TestApprovalActivationFailureObservationBoundaries', 'TestApprovalActivationFutureFixtureSeamsAreClosed', 'TestConnectorMaintenanceFailureObservationBoundaries', 'TestConnectorPreparationFailureStagesAreClosed', 'TestConnectorCallbackRecoveryApplicationBoundaries', 'TestConnectorMaintenanceRecoveryDecodeBoundaries', 'TestConnectorMaintenanceCallbackExecutionBoundaries', 'TestConnectorMaintenanceCallbackAdmissionReservesBeforeConsume', 'TestConnectorAuthorizeActivatesDurablePKCECleanupAfterRejectedStart', 'TestConnectorAuthorizeDurablyStagesCleanupBeforeCreatingPKCE', 'TestConnectorAuthorizeActivatesAtomicPKCECleanupWhenProviderURLFails', 'TestConnectorAuthorizeBindsPublicLongTailKeyToPrivateProviderAuthority', 'TestConnectorCallbackCompletesLongTailAgainstPrivateAuthority', 'TestConnectorCallbackMarksEffectUnknownBeforeProviderAndRetainsRecoveryAfterPersistenceFailure', 'TestConnectorAuthorizeCreatesStateBoundPKCEAttemptWithoutSecretResponse', 'TestConnectorOAuthCallbackConsumesStateBeforeProviderAndRedirectsSafely', 'TestConnectorCallbackRejectsChangedIntentAfterConsumingStateAndDestroysVerifier', 'TestConnectorCallbackDoesNotReportIntentConflictUntilConsumedAttemptCleanupIsDurable', 'TestConnectorCallbackLeavesDurableCleanupPendingWhenDiscardFails', 'TestConnectorQuarantineRemediationRequiresFreshExactIntentAndReturnsDurableReceipt', 'TestConnectorQuarantineRemediationLostResponseReplaysBeforeHistoricalLookup', 'TestConnectorOktaRevocationRemediationDoesNotRequireOAuthEffectManifest', 'TestConnectorCallbackReplayNeverCallsProvider', 'TestConnectorCallbackConsumesFixedProviderDenialWithoutExchange', 'TestConnectorReconcilerDispatchesNextHealthyLaneWithoutWaitingForSlowSibling', 'TestConnectorReconcilerShutdownDoesNotWaitIndefinitelyForHostileProvider', 'TestConnectorReconcilerProviderFailuresDoNotBackOffGlobalClaims', 'TestConnectorReconcilerRecoversDurableOutcomeWithoutRepeatingProviderEffect', 'TestConnectorReconcilerRecoversLongTailOutcomeFromTenantBoundAuthority', 'TestConnectorReconcilerNeverRejectsUnknownOutcomeOnTransientWorkflowFailure', 'TestConnectorReconcilerNeverRejectsUnknownOutcomeOnProviderReadinessFailure', 'TestConnectorReconcilerRetriesPostCompletionCleanupWithoutRecoveringOrExchanging', 'TestConnectorReconcilerQuarantinesFinalAttemptCleanupAndRevocationFailures', 'TestConnectorReconcilerDefersAmbiguousCompletionAndQuarantinesOtherFinalAttemptFailures', 'TestConnectorReconcilerDeletesExpiredPKCEUnderLiveLease', 'TestConnectorReconcilerDrainsClaimAfterOneProviderFailure', 'TestConnectorReconcilerProcessesSlowProvidersWithoutStarvingOtherLeases', 'TestConnectorReconciliationBatchDoesNotCollapseDistinctNangoProviders', 'TestConnectorReconcilerReservesLiveLeaseTimeForFinalAttemptQuarantine', 'TestConnectorReconcilerQuarantinesExpiredFinalAttemptBeforeProviderWork', 'TestConnectorReconcilerConfirmsProviderRevocationBeforeLocalTerminalState', 'TestConnectorReconcilerRevokesLongTailConnectionWithTenantBinding', 'TestConnectorReconcilerRejectsChangedAuthorizationIntentAndRunCancels', 'TestConnectorReconcilerNeverFailsUnknownEffectWithoutPositiveProviderCleanup', 'TestCurrentAuthorizationHealthProbeCancellationAndAdmission', 'TestCurrentAuthorizationHealthProbeScope', 'TestP7AuthorizationConstructorPrincipal', 'TestP7AuthorizationTransactionBoundary', 'TestP7GuardedRuntimeReadinessAdapter']
          for file, pin in pins.items():
              assert hashlib.sha256(Path(file).read_bytes()).hexdigest() == pin, file
          with tempfile.TemporaryFile() as output, tempfile.TemporaryFile() as errors:
              result = subprocess.run(['go', 'test', '-C', 'services/platform', '-race', '-p=1', '-count=1', '-timeout=2m', '-json', '-run', '^('+'|'.join(names)+')$', './apiserver'], stdout=output, stderr=errors, timeout=180)
              assert output.tell() <= 8*1024*1024 and errors.tell() <= 1024*1024, 'output bounds exceeded'
              output.seek(0)
              counts = {name: {'run': 0, 'pass': 0, 'fail': 0, 'skip': 0} for name in names}
              package_pass = 0
              for line in output:
                  event = json.loads(line)
                  name, action = event.get('Test'), event.get('Action')
                  if name in counts and action in counts[name]:
                      counts[name][action] += 1
                  if name is None and action == 'pass':
                      package_pass += 1
              failed = [name for name, value in counts.items() if value != {'run': 1, 'pass': 1, 'fail': 0, 'skip': 0}]
              print('::notice title=Existing connector application regressions::tops='+str(len(names))+'; failedOrUnobserved='+','.join(failed)+'; exit='+str(result.returncode)+'. Component application checks only; no native lifecycle or deployment acceptance.')
              assert result.returncode == 0 and package_pass == 1 and not failed, 'existing application group refused'
          for file, pin in pins.items():
              assert hashlib.sha256(Path(file).read_bytes()).hexdigest() == pin, file
          PYAPPLICATION
      - name: Current authorization health probe integration group
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^(TestCurrentReadinessPipelineStartsAllIndependentMetadata|TestLegacyReadinessNeverStartsPreviousAfterAuthorizationRefusal|TestOwnedReadinessDiagnosticPreservesGateAndClosedOutput|TestP7GuardedRuntimeReadinessCallback|TestP7GuardedRuntimeReadinessStartupGate|TestServiceRefusalIdentityAndNoMetadataArePreserved|TestStartupAuthorizationUsesIndependentParentBudget|TestStartupAuthorizationFreshBudgetRemainsFailClosed|TestInitialAuthorizationReadinessForwardsOnlyExistingRoleOutcomes)$' ./agentsec-api
      - name: Controlled cutover model and writer application group
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^(TestControlledPrepareRefusalStages|TestControlledActivateRefusalStages|TestControlledModelReadbackCompatibility|TestControlledModelSDKReadbackBoundary|TestControlledModelReadbackRejectsAlteredDefaults)$' ./connectormaintenancecutover
      - name: Guarded inactive maintenance profile commands
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^(TestAuthorizationRuntimeProfilePlan|TestAuthorizationRuntimeWorkerSelectsExplicitAuditRecipe|TestAuthorizationWorkerProfileCommand|TestMaintenanceProfileExplicitCommands|TestMaintenanceProfilePostInstallCatalogOnly)$' ./agentsec-migrate
      - name: Connected maintenance installer and operator application group
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^(TestApprovalActivation.*|TestRegistration.*|TestContinueHandshake|TestCompiledPins.*|TestHoldProtocol)$' ./migrations ./authorization ./runtimeservices ./cmd/zasp-controlled-maintenance-cutover ./cmd/zasp-maintenance-register ./cmd/zasp-authorization-reconcile
      - name: Temporal worker activated configuration and signing boundaries
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^(TestTemporalWorkerRetainsExplicitApprovalActivationSelection|TestOrderedSigningRuntimeRejectsWrongVerifierMount|TestOrderedSigningRuntimeReadsVerifierMount|TestComposeWorkerRuntimeMountsOnlyProductionReadyModes)$' ./agentsec-worker
      - name: Audited captured settlement and runtime selection boundaries
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^(TestApprovalSettlementAuditProfileBoundaries|TestApprovalSettlementAuditInstallerTransactions|TestSettlementAuditSelectionRequiresOriginalAndAdditiveCatalog|TestSettlementAuditCapturedDispatchNeverReauthorizesOrFallsBack|TestApprovalSettlementRuntimeSelectionHasNoFallback|TestMaintenanceProfileExplicitCommands|TestMaintenanceProfilePostInstallCatalogOnly)$' ./migrations ./approvalmaintenance ./agentsec-api ./agentsec-migrate
      - name: Existing whole approval source pin verification
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^TestApprovalMaintenanceSourcePinBindsWholeSupplementaryBody$' ./migrations
      # No production configuration, database start, activation, credential
      # issuance or native lifecycle admission is performed by this workflow.

  connected-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: false
      - name: Verify connected preflight source custody
        run: |
          python3 - <<'PYPREFLIGHT'
          import hashlib, json
          from pathlib import Path
          pins = json.loads(Path('.github/connector-native-compile-source-pins.json').read_text())['sources']
          for item in pins:
              raw = Path(item['path']).read_bytes()
              assert len(raw) == item['bytes'] and hashlib.sha256(raw).hexdigest() == item['sha256'], item['path']
          PYPREFLIGHT
      - name: Actual SDK protocol and credential boundary application checks
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m ./cloudreadiness ./preflight
      - name: Read-only compiled PostgreSQL profile observation contracts
        timeout-minutes: 2
        run: go test -C services/platform -race -p=1 -count=1 -timeout=90s -run '^TestReadOnlyPreflightCurrentProfile$' ./migrations
      - name: Full CLI application regressions and explicit offline compatibility
        timeout-minutes: 3
        run: go test -C cmd/agentsecctl -race -p=1 -count=1 -timeout=2m ./...
      - name: Keep consumed source and module metadata unchanged
        run: git diff --exit-code -- cmd/agentsecctl services/platform services/health

  selected-node-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: false
      - name: Verify selected-node application source custody
        run: |
          python3 - <<'PYSENSOR'
          import hashlib, json
          from pathlib import Path
          for item in json.loads(Path('.github/connector-native-compile-source-pins.json').read_text())['sources']:
              raw = Path(item['path']).read_bytes()
              assert len(raw) == item['bytes'] and hashlib.sha256(raw).hexdigest() == item['sha256'], item['path']
          PYSENSOR
      - name: Selected-node adapter application regressions
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m ./sensoradapter
      - name: Sensor application regressions with original fixture permissions
        timeout-minutes: 5
        run: |
          umask 0027
          go test -C services/sensor-agent -race -p=1 -count=1 -timeout=2m ./...
      - name: Keep consumed sensor and module source unchanged
        run: git diff --exit-code -- services/sensor-agent services/platform services/health

  connected-opensearch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: false
      - name: Verify connected OpenSearch source custody
        run: |
          python3 - <<'PYOPENSEARCH'
          import hashlib, json
          from pathlib import Path
          for item in json.loads(Path('.github/connector-native-compile-source-pins.json').read_text())['sources']:
              raw = Path(item['path']).read_bytes()
              assert len(raw) == item['bytes'] and hashlib.sha256(raw).hexdigest() == item['sha256'], item['path']
          PYOPENSEARCH
      - name: Canonical driver and read-only schema observer regressions
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m ./runtimeindex/opensearchdriver ./inventorysearch/opensearchdriver
      - name: Connected domain and selected-workload schema application checks
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^TestOpenSearch' ./preflight
      - name: Keep consumed OpenSearch and module source unchanged
        run: git diff --exit-code -- services/platform cmd/agentsecctl services/health

  connected-fargate-configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: false
      - name: Verify connected Fargate configuration source custody
        run: |
          python3 - <<'PYFARGATE'
          import hashlib, json
          from pathlib import Path
          for item in json.loads(Path('.github/connector-native-compile-source-pins.json').read_text())['sources']:
              raw = Path(item['path']).read_bytes()
              assert len(raw) == item['bytes'] and hashlib.sha256(raw).hexdigest() == item['sha256'], item['path']
          PYFARGATE
      - name: Connected Fargate configuration application checks
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^TestAttackLab' ./cloudreadiness ./preflight
      - name: Original worker Kubernetes readiness and refusal controls
        timeout-minutes: 5
        run: go test -C services/platform -race -p=1 -count=1 -timeout=2m -run '^TestProductionAttackLabKubernetesAPIReadiness(CollectsAndUIDFencesCleanup|RejectsPrivilegeAndEgressDrift)$' ./agentsec-worker
      - name: Keep consumed Fargate configuration and module source unchanged
        run: git diff --exit-code -- services/platform cmd/agentsecctl services/health

  optional-egress-operator-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.8
          cache: false
      - name: Check frozen optional egress source custody
        run: |
          python3 - <<'PYMAINTENANCE'
          import hashlib,json
          from pathlib import Path
          for item in json.loads(Path('.github/connector-native-compile-source-pins.json').read_text())['sources']:
              raw=Path(item['path']).read_bytes()
              assert len(raw)==item['bytes'] and hashlib.sha256(raw).hexdigest()==item['sha256'],item['path']
          PYMAINTENANCE
      - name: Require every optional egress installer and actual CLI confirmation component
        timeout-minutes: 8
        run: |
          go test -C services/platform -race -p=1 -count=1 -timeout=3m -json -run '^TestOptionalEgress(ProfileSealsAndAdmissionBoundaries|InstallerTransactions|InstallerNoInheritRoleWindows|ConfirmationUsesActualBoundedAuthorityPath)$' ./migrations ./agentsec-migrate > optional-egress-operator-components.jsonl
          python3 - <<'PYMAINTENANCECASES'
          import json
          from pathlib import Path
