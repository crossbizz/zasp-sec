              'apiserver': {'TestEnvironmentClassificationHTTPPreservesOptionalPresenceAndExactKeys', 'TestEnvironmentClassificationStatementsBindCurrentActorScopeAndProfile', 'TestEnvironmentClassificationRepositorySelectsOneClosedWriter'},
              'agentsec-api': {'TestEnvironmentClassRuntimeRequiresExplicitCompiledProfile'},
