                  result = subprocess.run(command, stdout=out, stderr=err, timeout=1200, check=False)
                  executions.append({'module':module,'command':command,'exit_code':result.returncode,'classification':'component-behavior'})
                  if result.returncode != 0 and status == 0:
                      status = result.returncode
          # The API service has new composition/configuration without a new test head.
          # Keep its required compile-only result out of the 98-name behavior stream.
          with Path('gateway-bootstrap-api-compile.jsonl').open('wb') as out, Path('gateway-bootstrap-api-compile.stderr').open('wb') as err:
