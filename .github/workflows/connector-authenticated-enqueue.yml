name: Connector authenticated enqueue integration
"on":
  pull_request:
    paths:
      - 'services/platform/**'
      - '.github/connector-native-compile-source-pins.json'
      - 'scripts/hosted-connector-authenticated-enqueue.mjs'
      - 'scripts/hosted-memory-observation.mjs'
      - 'scripts/hosted-memory-observation.test.mjs'
      - 'scripts/owned-command.mjs'
      - 'scripts/owned-fixed-fd-command.mjs'
      - 'scripts/official-held-tools.mjs'
      - '.github/workflows/connector-authenticated-enqueue.yml'
  push:
    paths:
      - 'services/platform/**'
      - '.github/connector-native-compile-source-pins.json'
      - 'scripts/hosted-connector-authenticated-enqueue.mjs'
      - 'scripts/hosted-memory-observation.mjs'
      - 'scripts/hosted-memory-observation.test.mjs'
      - 'scripts/owned-command.mjs'
      - 'scripts/owned-fixed-fd-command.mjs'
      - 'scripts/official-held-tools.mjs'
      - '.github/workflows/connector-authenticated-enqueue.yml'
permissions:
  contents: read
jobs:
  authenticated-enqueue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.8
          cache: false
      - name: Portable memory metadata parser controls
        timeout-minutes: 1
        run: node --test scripts/hosted-memory-observation.test.mjs
      # Tool prerequisite only. The native test still uses the exact held PG image.
      - name: Official Ubuntu Docker prerequisite
        timeout-minutes: 6
        run: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=10s 120s sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin apt-get update -qq
            timeout --signal=TERM --kill-after=10s 180s sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends docker.io
          fi
          command -v docker
          timeout --signal=TERM --kill-after=10s 10s docker --version
          if ! timeout --signal=TERM --kill-after=10s 10s docker --host=unix:///var/run/docker.sock info --format '{{.ServerVersion}}'; then
            timeout --signal=TERM --kill-after=10s 20s sudo systemctl start docker
          fi
          timeout --signal=TERM --kill-after=10s 10s docker --host=unix:///var/run/docker.sock version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          timeout --signal=TERM --kill-after=10s 10s docker --host=unix:///var/run/docker.sock info --format 'server={{.ServerVersion}} driver={{.Driver}}'
          stat --format='socket mode=%a uid=%u gid=%g' /var/run/docker.sock
      - name: Existing authenticated OAuth enqueue application group
        timeout-minutes: 27
        run: node scripts/hosted-connector-authenticated-enqueue.mjs
