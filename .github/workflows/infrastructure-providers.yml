name: Infrastructure providers
on: [push, pull_request]

permissions:
  contents: read

jobs:
  provider-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.8
          cache-dependency-path: services/platform/go.sum
      - name: Exercise every provider selection branch
        working-directory: services/platform
        run: |
          go test -race -count=1 -coverprofile="$RUNNER_TEMP/selection.cover" ./infraprovider
          go tool cover -func="$RUNNER_TEMP/selection.cover" | tee -a "$GITHUB_STEP_SUMMARY"
          awk 'NR > 1 && $NF == 0 { missing = 1 } END { exit (NR < 2 || missing) }' "$RUNNER_TEMP/selection.cover"
      - name: Check API preflight and worker startup refusals
        working-directory: services/platform
        run: go test -p 2 -count=1 -run '^TestInfrastructureProvider' ./agentsec-api ./agentsec-worker
