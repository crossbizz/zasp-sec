name: Infrastructure providers
on: [push, pull_request]

permissions:
  contents: read

jobs:
  provider-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      wiring-failure: ${{ steps.wiring.outputs.failure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.8
          cache-dependency-path: services/platform/go.sum
      - name: Exercise every provider selection branch
        working-directory: services/platform
        run: |
          go test -race -count=1 -coverprofile="$RUNNER_TEMP/selection.cover" ./infraprovider
          go tool cover -func="$RUNNER_TEMP/selection.cover" | tee -a "$GITHUB_STEP_SUMMARY"
          awk 'NR > 1 && $NF == 0 { missing = 1 } END { exit (NR < 2 || missing) }' "$RUNNER_TEMP/selection.cover"
      - name: Test provider clients, crypto, configuration and storage contracts with coverage
        working-directory: services/platform
        run: |
          go test -race -count=1 -coverprofile="$RUNNER_TEMP/providers.cover" ./openbaoclient ./openbaokv ./runtimesecret ./recovery/... ./artifactstore/s3driver
          go tool cover -func="$RUNNER_TEMP/providers.cover" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Exercise provider wiring in the API and worker
        id: wiring
        working-directory: services/platform
        run: |
          set +e
          go test -json -p 2 -count=1 -coverprofile="$RUNNER_TEMP/wiring.cover" -run 'Test(InfrastructureProvider|RuntimeConnector|ConnectorAWSRollback|CheckConfigReadsExplicitStartupProjection|RuntimeNango|WorkerRuntimeConfigServesSaaSOnlyWithNango|Discovery.*OpenBao|OpenBao|AuditQueueEncryption|AuditExportQueueEncryption|EvidenceEncryption|SSES3|Recovery|ProductionDiscovery)' ./agentsec-api ./agentsec-worker 2>&1 | tee "$RUNNER_TEMP/wiring.jsonl"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            python3 ../../.github/scripts/go_failure.py < "$RUNNER_TEMP/wiring.jsonl" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
          go tool cover -func="$RUNNER_TEMP/wiring.cover" | tail -1 >> "$GITHUB_STEP_SUMMARY"

  wiring-diagnostics:
    needs: provider-contracts
    if: failure() && needs.provider-contracts.outputs.wiring-failure != ''
    name: "Failed Go tests · ${{ needs.provider-contracts.outputs.wiring-failure }}"
    runs-on: ubuntu-24.04
    steps:
      - run: echo "See the provider-contracts log for the full test output." >> "$GITHUB_STEP_SUMMARY"

  backup-and-recovery:
    outputs:
      drill-failure: ${{ steps.recovery.outputs.failure }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.8
          cache-dependency-path: services/platform/go.sum
      - name: Test Go failure reporting
        run: python3 -m unittest discover -s .github/scripts -v
      - name: Render and validate the private OpenBao deployment
        run: |
          helm version --short
          /usr/bin/python3 -c 'import yaml'
          /usr/bin/python3 -m unittest discover -s deploy/vps/openbao/tests -v
          /usr/bin/python3 -m unittest discover -s deploy/vps/nango/tests -v
          /usr/bin/python3 -m unittest discover -s deploy/vps/openfga-postgres -v
          /usr/bin/python3 -m unittest discover -s deploy/vps/aws-identity -v
      - name: Restore a real TLS-protected OpenBao Raft snapshot
        id: recovery
        env:
          ZASP_TEST_OPENBAO_TRANSIT: "1"
          ZASP_TEST_OPENBAO_KV: "1"
          ZASP_TEST_VPS_OPENBAO_CLI: "1"
        run: |
          if ! python3 deploy/vps/openbao/tests/restore_drill.py > "$RUNNER_TEMP/raft.log" 2>&1; then
            cat "$RUNNER_TEMP/raft.log"
            locations=$(sed -nE 's/.*File "[^"]*\/(restore_drill|vps_services_live|vps_services)\.py", line ([0-9]+),.*/\1:\2/p' "$RUNNER_TEMP/raft.log" | tail -3 | paste -sd,)
            errors=$(sed -nE 's/.*HTTP Error ([0-9]{3}):.*/HTTP-\1/p; s/.*\[SSL: ([A-Z0-9_]+)\].*/TLS-\1/p; s/^([a-z][a-z0-9_.]*\.)?([A-Za-z]+Error):.*/\2/p' "$RUNNER_TEMP/raft.log" | sort -u | paste -sd, | cut -c1-72)
            echo "failure=Raft ${locations:-drill} $errors" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          cat "$RUNNER_TEMP/raft.log"
      - name: Verify audit queue encryption and IAM contracts
        run: node --experimental-test-coverage --test deploy/staging/queue-contract.test.mjs deploy/production/evidence-encryption.test.mjs

  vps-operations:
    outputs:
      chart-failure: ${{ steps.charts.outputs.failure }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare disposable PostgreSQL and coverage tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 python3-coverage
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Test deployment scripts and recover a PostgreSQL dump on a fresh database
        env:
          ZASP_TEST_VPS_POSTGRES: "1"
        run: |
          export PATH="/usr/lib/postgresql/16/bin:/usr/bin:$PATH"
          for program in initdb pg_ctl pg_dump psql pg_restore; do
            test "$(command -v "$program")" = "/usr/lib/postgresql/16/bin/$program"
          done
          # Enable coverage in the CLI's child Python processes as well as the test runner.
          coverage_dir="$(mktemp -d "$RUNNER_TEMP/zasp-coverage.XXXXXX")"
          printf '%s\n' 'import coverage' 'coverage.process_startup()' > "$coverage_dir/sitecustomize.py"
          printf '%s\n' '[run]' 'branch = True' 'parallel = True' 'include = */deploy/zasp/lib/backup.py, */deploy/zasp/lib/vps*.py, */deploy/vps/dependencies/prepare_inputs.py' 'omit = *_test.py' > "$coverage_dir/coveragerc"
          export COVERAGE_FILE="$coverage_dir/.coverage"
          export COVERAGE_PROCESS_START="$coverage_dir/coveragerc"
          export PYTHONPATH="$coverage_dir"
          /usr/bin/python3 -m unittest discover -s deploy/zasp -p '*_test.py' -v
          /usr/bin/python3 -m unittest discover -s deploy/zasp/lib -p '*_test.py' -v
          /usr/bin/python3 -m unittest discover -s deploy/vps/dependencies -p 'test_*.py' -v
          unset COVERAGE_PROCESS_START PYTHONPATH
          /usr/bin/python3 -m coverage combine "$coverage_dir"
          /usr/bin/python3 -m coverage report --rcfile="$coverage_dir/coveragerc" | tee -a "$GITHUB_STEP_SUMMARY"
          /usr/bin/python3 -m coverage json --rcfile="$coverage_dir/coveragerc" -o "$coverage_dir/report.json"
          /usr/bin/python3 - "$coverage_dir/report.json" <<'PY'
          import json, pathlib, sys
          files = json.loads(pathlib.Path(sys.argv[1]).read_text())["files"]
          scripts = ("backup", "vps_backup", "vps_backup_retention", "vps_dependencies", "vps_doctor", "vps_services")
          paths = ["deploy/zasp/lib/" + script + ".py" for script in scripts]
          for path in paths + ["deploy/vps/dependencies/prepare_inputs.py"]:
              if not files.get(path, {}).get("executed_lines"):
                  raise SystemExit("Missing deployment coverage for " + path)
          PY
          systemd-analyze verify deploy/vps/backup/zasp-backup.service deploy/vps/backup/zasp-backup.timer
      - name: Render pinned Temporal and OpenFGA charts against the VPS contract
        id: charts
        env:
          ZASP_TEST_RUNTIME_HELM: "1"
        run: |
          if ! /usr/bin/python3 -m unittest discover -s deploy/vps/dependencies -p test_helm.py -v > "$RUNNER_TEMP/chart.log" 2>&1; then
            cat "$RUNNER_TEMP/chart.log"
            locations=$(sed -nE 's/.*File "[^"]*\/(test_helm|vps_dependencies)\.py", line ([0-9]+),.*/\1.py:\2/p' "$RUNNER_TEMP/chart.log" | paste -sd,)
            echo "failure=VPS chart ${locations:-render}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          cat "$RUNNER_TEMP/chart.log"

  release-rendering:
    outputs:
      cli-failure: ${{ steps.cli.outputs.failure }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install locked chart-test dependencies
        run: SHARP_IGNORE_GLOBAL_LIBVIPS=1 npm ci --no-audit --no-fund
      - name: Exercise the deployment CLI through every profile
        id: cli
        run: |
          if ! node --test --test-reporter=tap deploy/zasp/zasp.test.mjs deploy/zasp/vps-cli.test.mjs > "$RUNNER_TEMP/cli.tap" 2>&1; then
            cat "$RUNNER_TEMP/cli.tap"
            name=$(awk -F ' - ' '/^not ok [0-9]+ - / { gsub(/[^A-Za-z0-9 ._-]/,"",$2); print substr($2,1,120); exit }' "$RUNNER_TEMP/cli.tap")
            echo "failure=CLI ${name:-tests}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          tail -10 "$RUNNER_TEMP/cli.tap"
      - name: Render and validate provider selections
        run: |
          helm version --short
          node --test --test-name-pattern='release projects OpenBao|release selects SSE-S3|explicit queue encryption' deploy/production/release-contract.test.mjs deploy/production/audit-export-rollout.test.mjs

  deployment-diagnostics:
    needs: [vps-operations, release-rendering, backup-and-recovery]
    if: failure() && (needs.vps-operations.outputs.chart-failure != '' || needs.release-rendering.outputs.cli-failure != '' || needs.backup-and-recovery.outputs.drill-failure != '')
    name: "Deployment check · ${{ needs.vps-operations.outputs.chart-failure }} ${{ needs.release-rendering.outputs.cli-failure }} ${{ needs.backup-and-recovery.outputs.drill-failure }}"
    runs-on: ubuntu-24.04
    steps:
      - run: echo "See the named deployment step for its full test output." >> "$GITHUB_STEP_SUMMARY"
