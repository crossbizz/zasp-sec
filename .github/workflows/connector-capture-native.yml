name: Connector capture native integration
"on":
  pull_request:
    paths:
      - 'services/platform/**'
      - 'scripts/hosted-connector-nine.mjs'
      - 'scripts/owned-command.mjs'
      - 'scripts/owned-fixed-fd-command.mjs'
      - 'scripts/official-held-tools.mjs'
      - '.github/workflows/connector-capture-native.yml'
  push:
    paths:
      - 'services/platform/**'
      - 'scripts/hosted-connector-nine.mjs'
      - 'scripts/owned-command.mjs'
      - 'scripts/owned-fixed-fd-command.mjs'
      - 'scripts/official-held-tools.mjs'
      - '.github/workflows/connector-capture-native.yml'
permissions:
  contents: read
jobs:
  original-nine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.8
          cache: false
      - name: Original captured-inactive application integration
        timeout-minutes: 27
        run: node scripts/hosted-connector-nine.mjs
