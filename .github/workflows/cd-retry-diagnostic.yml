name: Check production deployment regressions
'on':
  push:
    branches:
    - fix/production-cd-retry
permissions:
  contents: read
jobs:
  compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    outputs:
      phase: ${{ steps.browser.outputs.phase || steps.prerequisites.outputs.phase }}
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.1
        cache: npm
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.26.8
        cache: true
        cache-dependency-path: services/platform/go.sum
    - name: Pin npm
      run: npm install --global npm@10.9.8
    - name: Install locked dependencies
      run: SHARP_IGNORE_GLOBAL_LIBVIPS=1 npm ci
    - name: Install PostgreSQL 18 reference fixture tools
      run: "fixture_pg_dir=$(mktemp -d \"${RUNNER_TEMP}/zasp-pgdg.XXXXXX\")\ncurl --fail --location --retry 3 --max-time 60 --output \"$fixture_pg_dir/pgdg.asc\" https://www.postgresql.org/media/keys/ACCC4CF8.asc\nprintf '%s  %s\\n' 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76 \"$fixture_pg_dir/pgdg.asc\" | sha256sum --check -\nsudo install -m 0644 \"$fixture_pg_dir/pgdg.asc\" /usr/share/keyrings/zasp-ci-pgdg.asc\nprintf '%s\\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/zasp-ci-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/zasp-ci-pgdg.list > /dev/null\nsudo apt-get update\nsudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends postgresql-18 postgresql-client-18\nfixture_pg_bin=/usr/lib/postgresql/18/bin\nfor fixture_tool in initdb postgres pg_isready pg_ctl pg_config; do\n  test -x \"$fixture_pg_bin/$fixture_tool\"\ndone\ncase \"$(\"$fixture_pg_bin/postgres\" --version)\" in\n  \"postgres (PostgreSQL) 18.\"*) ;;\n  *) exit 1 ;;\nesac\n\"$fixture_pg_bin/postgres\" --version\nprintf '%s\\n' \"$fixture_pg_bin\" >> \"$GITHUB_PATH\"\n"
    - name: Prime platform full-MVS metadata for offline release contracts
      timeout-minutes: 5
      run: GOENV=off GOWORK=off GOFLAGS= GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go list -C services/platform -mod=readonly -m all >/dev/null
    - name: Prime native migration compilation cache for compliance browser
      timeout-minutes: 5
      run: 'umask 077

        task_migration_dir=$(mktemp -d "${RUNNER_TEMP}/zasp-migration-cache.XXXXXX")

        trap ''rm -rf -- "$task_migration_dir"'' EXIT

        cd services/platform

        GOENV=off GOWORK=off GOFLAGS= GOPRIVATE= GONOPROXY= GONOSUMDB= GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go build -mod=readonly -o "$task_migration_dir/agentsec-migrate" ./agentsec-migrate

        '
    - name: Build the web client
      run: npm run build
    - name: Provision isolated compliance browser prerequisites
      id: prerequisites
      timeout-minutes: 10
      run: |
        set -euo pipefail
        # This populates the exact cache entry consumed with --pull=never.
        compliance_postgres_image=postgres@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
        phase=postgres-image-pull
        trap 'printf "phase=%s\n" "$phase" >> "$GITHUB_OUTPUT"' ERR
        pull_log="$RUNNER_TEMP/compliance-postgres-pull"
        for attempt in 1 2 3; do
          if docker pull "$compliance_postgres_image" > "$pull_log" 2>&1; then break; fi
          if grep -Eiq 'too many requests|toomanyrequests|429' "$pull_log"; then phase=postgres-registry-throttled
          elif grep -Eiq 'internal server error|bad gateway|service unavailable|gateway timeout| 50[0234]|retry later|unexpected EOF|TLS handshake timeout|connection reset|i/o timeout' "$pull_log"; then phase=postgres-registry-transient
          else printf 'phase=%s\n' "$phase" >> "$GITHUB_OUTPUT"; exit 1
          fi
          if [ "$attempt" = 3 ]; then printf 'phase=%s\n' "$phase" >> "$GITHUB_OUTPUT"; exit 1; fi
          sleep "$((attempt * 10))"
        done
        phase=postgres-image-digest
        docker image inspect "$compliance_postgres_image" --format '{{json .RepoDigests}}' | node --input-type=module -e 'import assert from "node:assert/strict"; import { readFileSync } from "node:fs"; assert.ok(JSON.parse(readFileSync(0,"utf8")).includes(process.argv[1]), "pinned browser PostgreSQL digest absent");' "$compliance_postgres_image"
        phase=chromium-discovery
        node --input-type=module <<'NODE'
        import { execFileSync } from "node:child_process";
        import { appendFileSync } from "node:fs";
        import { selectBrowserExecutable } from "./scripts/browser-prerequisites.mjs";
        const chrome = selectBrowserExecutable();
        console.log(`Hosted compliance browser: ${chrome}`);
        console.log(execFileSync(chrome, ["--version"], { encoding: "utf8", timeout: 5000, killSignal: "SIGKILL" }).trim());
        appendFileSync(process.env.GITHUB_ENV, `ZASP_COMBINED_E2E_CHROME=${chrome}\n`);
        NODE
    - name: Provision pinned owned authorization runtime tools
      timeout-minutes: 5
      run: 'node scripts/hosted-runtime-tool-intake.mjs

        '
    - name: Verify current compliance browser acceptance
      timeout-minutes: 15
      env:
        ZASP_COMBINED_E2E_COMPLIANCE: 'true'
      run: |
        set -euo pipefail
        unit_log="$RUNNER_TEMP/compliance-prerequisites.log"
        if ! node --test scripts/browser-prerequisites.test.mjs scripts/browser-e2e-helpers.test.mjs scripts/owned-browser-postgres.test.mjs scripts/compliance-browser-bytes.test.mjs | tee "$unit_log"; then
          python3 - "$unit_log" <<'LOCATIONS' >> "$GITHUB_OUTPUT"
        from pathlib import Path
        import re, subprocess, sys
        text=Path(sys.argv[1]).read_text(errors="replace")
        files=set(subprocess.check_output(["git","ls-files","-z","scripts/*test.mjs"]).decode().split("\0"))
        locations=re.findall(r"(?:^|[/\s(])((?:scripts)/[A-Za-z0-9_./-]+\.test\.mjs):(\d{1,6})",text,re.M)
        print("phase=prerequisite tests "+" ".join(dict.fromkeys(f"{Path(f).name}:{int(n)}" for f,n in locations if f in files))[:150])
        LOCATIONS
          exit 1
        fi
        log="$RUNNER_TEMP/compliance.log"
        if node scripts/production-combined-e2e.mjs > "$log" 2>&1; then exit 0; fi
        python3 - "$log" <<'DIAG' >> "$GITHUB_OUTPUT"
        from pathlib import Path
        import re, subprocess, sys
        data=Path(sys.argv[1]).read_text(errors="replace")
        sources=" ".join(Path(p).read_text() for p in ["scripts/browser-command-failure.mjs", "scripts/owned-runtime-startup-diagnostics.mjs"])
        known=set(re.findall(r"""["']([a-z][a-z0-9-]{1,65})["']""",sources)) | {"install","forward-readiness","deployment-admin"}
        codes=[x for x in re.findall(r"(?:Observed (?:phase|child stage|command class|dependency phase|readiness reason|branch|inner step): |Observed owned runtime startup: phase=|; (?:failure|stage)[:=] ?)([a-z][a-z0-9-]{1,65})",data) if x in known]
        readiness=Path("services/platform/agentsec-api/production_runtime.go").read_text()
        checks=set(re.findall(r'(?:named|readiness\.report)\("([a-z][a-z-]+)"',readiness))
        refused=["refused-"+x for x in re.findall(r'"event":"readiness_refused","service":"agentsec-api","check":"([a-z-]+)"',data) if x in checks]
        tracked=set(subprocess.check_output(["git","ls-files","-z"]).decode().split("\0"))
        locations=re.findall(r"(?:^|[\s(/])((?:scripts|app|apps|services|fern)/[A-Za-z0-9_./-]+\.(?:mjs|ts|tsx|go|java)):(\d{1,6})(?:[,:]\d+)?",data,re.M)
        frames=[f"{Path(f).name}:{int(line)}" for f,line in locations if f in tracked]
        stages=[x for x in ["approval maintenance refused","baseline refused","release migration configuration rejected","owned current authorization fixture unavailable","empty authorization projection","owned projection cleanup incomplete","permission denied","does not exist","duplicate key","violates foreign key","violates check constraint","request_forbidden","request_unauthenticated","request_invalid","not_found","browser text not found","ECONNREFUSED"] if x in data]
        status=[key+"-"+n for key,n in re.findall(r"\b(actual|expected): (\d{1,3})\b", data) if int(n)<=599]
        sqlstate=["SQLSTATE-"+x for x in re.findall(r"(?i)\bsqlstate[= ]([0-9A-Z]{5})\b",data)]
        paging=[]
        for line in re.findall(r"^ZASP_COMPLIANCE_PAGING=([^\r\n]{1,1100})$",data,re.M):
            for value in line.split():
                if re.fullmatch(r"ui-(?:loading|forbidden|unavailable|read-error|sign-in|evidence|other)-links-(?:0|1|other)|(?:controls|evidence)-(?:all|soc2|hipaa)-(?:selected|other)-(?:first|short|long)-[1-5][0-9]{2}",value):
                    paging.append(value)
        print("phase="+(" ".join(dict.fromkeys(paging+refused+stages+sqlstate+status+codes+frames))[:235] or "no classified evidence"))
        DIAG
        exit 1
      id: browser
  result:
    needs: compliance
    if: failure() && needs.compliance.outputs.phase != ''
    name: "Compliance \xB7 ${{ needs.compliance.outputs.phase }}"
    runs-on: ubuntu-24.04
    steps:
    - run: echo "See the compliance job."
  previous_failures:
    name: Read previous acceptance and SDK results
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      compliance: ${{ steps.summary.outputs.compliance }}
      java: ${{ steps.summary.outputs.java }}
      fixture: ${{ steps.summary.outputs.fixture }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Read the original jobs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        umask 077
        destination="$RUNNER_TEMP/previous-acceptance"
        mkdir -p "$destination"
        for pair in 46099850059/140839602924 46099849819/140839581826 46106367646/140859915800; do
          run_id=${pair%/*}
          job_id=${pair#*/}
          repo="repos/$GITHUB_REPOSITORY"
          test "$(gh api "$repo/actions/jobs/$job_id" --jq .run_id)" = "$run_id"
          gh api "$repo/check-runs/$job_id/annotations?per_page=100" > "$destination/$job_id.json" || echo '[]' > "$destination/$job_id.json"
          log="$destination/$job_id.log"
          archive="$destination/$run_id.zip"
          curl --silent --fail --location --max-time 45 --retry 1 --proto '=https' \
            -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/$repo/actions/jobs/$job_id/logs" > "$log" || : > "$log"
          if ! test -s "$log"; then
            curl --silent --fail --location --max-time 90 --retry 1 --proto '=https' \
              -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/$repo/actions/runs/$run_id/logs" > "$archive" || : > "$archive"
            python3 - "$job_id" "$archive" "$log" <<'PYTHON'
        from pathlib import Path
        import re, sys, zipfile
        job, archive, log = sys.argv[1:]
        if zipfile.is_zipfile(archive):
            with zipfile.ZipFile(archive) as run:
                needle = {"140839602924":"verify current compliance browser acceptance","140839581826":"compile and exercise all four generated sdks","140859915800":"provision isolated compliance browser prerequisites"}[job]
                for step in run.infolist():
                    name = re.sub(r"[ _-]+", " ", Path(step.filename).stem.lower())
                    if needle in name and step.file_size <= 64 * 1024 * 1024:
                        Path(log).write_bytes(run.read(step))
                        break
        PYTHON
          fi
        done
    - name: Classify the retained evidence
      id: summary
      run: |
        node --input-type=module <<'NODE'
        import {readFileSync, appendFileSync} from 'node:fs';
        import {execFileSync} from 'node:child_process';
        import path from 'node:path';
        import {javaFailure} from './fern/scripts/java-failure.mjs';
        const tracked = new Set(execFileSync('git',['ls-files','-z'],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean));
        const javaNames = new Set([...tracked].filter(p=>p.endsWith('.java')).map(p=>path.basename(p)));
        const knownLabels = new Set(['install','forward-readiness','deployment-admin', ...['scripts/browser-command-failure.mjs','scripts/owned-runtime-startup-diagnostics.mjs'].flatMap(p=>
          [...readFileSync(p,'utf8').matchAll(/["']([a-z][a-z0-9-]{1,65})["']/g)].map(m=>m[1]))]);
        const previous = path.join(process.env.RUNNER_TEMP,'previous-acceptance');
        function read(job) {
          const list = JSON.parse(readFileSync(path.join(previous,job+'.json'),'utf8'));
          const log = readFileSync(path.join(previous,job+'.log'),'utf8');
          return {log, list};
        }
        const {log,list}=read('140839602924');
        const text=[...list.map(v=>v.message||''),log].join('\n');
        const labels=[];
        for(const m of text.matchAll(/(?:Observed (?:phase|child stage|command class|dependency phase|readiness reason|branch|inner step): |Observed owned runtime startup: phase=|; (?:failure|stage)[:=] ?)([a-z][a-z0-9-]{1,65})/g)) {
          if(knownLabels.has(m[1])) labels.push(m[1]);
        }
        const readinessSource=readFileSync('services/platform/agentsec-api/production_runtime.go','utf8');
        const readinessChecks=new Set([...readinessSource.matchAll(/(?:named|readiness\.report)\("([a-z][a-z-]+)"/g)].map(m=>m[1]));
        for(const m of text.matchAll(/"event":"readiness_refused","service":"agentsec-api","check":"([a-z-]+)"/g)) {
          if(readinessChecks.has(m[1])) labels.push('refused-'+m[1]);
        }
        const firstApiCleanup=log.indexOf('combined E2E: cleanup api');
        const readinessDeadline=log.indexOf('Observed readiness reason: deadline.');
        if(firstApiCleanup!==-1 && readinessDeadline!==-1) {
          labels.unshift(firstApiCleanup<readinessDeadline?'cleanup-before-deadline':'deadline-before-cleanup');
        }
        const frames=[];
        for(const m of text.matchAll(/(?:^|[\s(/])((?:scripts|app|apps|services|fern)\/[A-Za-z0-9_./-]+\.(?:mjs|ts|tsx|go|java)):(\d{1,6})(?:[,:]\d+)?/gm)) {
          if(tracked.has(m[1])) frames.push(path.basename(m[1])+':'+Number(m[2]));
        }
        for (const a of list) {
          if(tracked.has(a.path) && Number.isSafeInteger(a.start_line) && a.start_line>0) frames.push(path.basename(a.path)+':'+a.start_line);
        }
        const fixture=read('140859915800');
        const joined=(fixture.log+'\n'+fixture.list.map(v=>v.message||'').join('\n')).replace(/.*?##\[group\]Run [\s\S]*?##\[endgroup\]/g,'');
        const fixtureCategories=[
          [/too many requests|toomanyrequests|HTTP 429/i,'registry throttled'],
          [/internal server error|bad gateway|service unavailable|gateway timeout|HTTP 50[0234]/i,'registry upstream error'],
          [/unexpected EOF|TLS handshake timeout|connection reset|i\/o timeout/i,'registry transport interrupted'],
          [/no space left on device/i,'runner disk full'],
          [/pinned browser PostgreSQL digest absent/i,'digest missing'],
          [/unable to find.*chrom|no supported browser|browser executable unavailable/i,'Chromium unavailable'],
          [/unauthorized|authentication required|denied: requested access/i,'registry denied'],
          [/manifest unknown|manifest not found/i,'pinned image unavailable']
        ];
        const fixtureReason=fixtureCategories.find(([match])=>match.test(joined))?.[1]??'unclassified';
        const java=read('140839581826');
        let category=javaFailure(java.log+'\n'+java.list.map(v=>v.message||'').join('\n'));
        const javaSource=/^(compiler|JUnit) (.+\.java):\d+$/.exec(category);
        if(javaSource && !javaNames.has(javaSource[2])) category=javaSource[1]+' failure';
        const summary=[...new Set([...labels,...frames])].join(' ').slice(0,185)||'no classified evidence';
        appendFileSync(process.env.GITHUB_OUTPUT,'compliance='+summary+(log.trim()?'':' [annotations only]')+'\njava='+category+(java.log.trim()?'':' [annotations only]')+'\nfixture='+fixtureReason+'\n');
        NODE
  previous_results:
    needs: previous_failures
    name: ${{ format('Previous compliance · {0} | Java · {1} | Setup · {2}', needs.previous_failures.outputs.compliance, needs.previous_failures.outputs.java, needs.previous_failures.outputs.fixture) }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
    - run: echo "The check name identifies the classified results."
