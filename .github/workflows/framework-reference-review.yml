name: Review upstream framework reference changes
on:
  schedule:
    - cron: '23 7 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Compare official metadata with reviewed edition locks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/framework-catalog/watch.py "$RUNNER_TEMP/framework-review"
      - name: Publish reviewer summary
        if: always()
        run: cat "$RUNNER_TEMP/framework-review/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-framework-review-${{ github.run_id }}
          path: ${{ runner.temp }}/framework-review/
          if-no-files-found: error
          retention-days: 60
