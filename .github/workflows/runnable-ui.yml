name: Runnable UI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify runnable UI
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: true
          cache-dependency-path: services/platform/go.sum
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Install locked dependencies
        run: SHARP_IGNORE_GLOBAL_LIBVIPS=1 npm ci
      # Reference validation only. Older-major compatibility remains an open
      # release gate in docs/internal/implementation_status_v1.5.md.
      - name: Install PostgreSQL 18 reference fixture tools
        run: |
          fixture_pg_dir=$(mktemp -d "${RUNNER_TEMP}/zasp-pgdg.XXXXXX")
          curl --fail --location --retry 3 --max-time 60 --output "$fixture_pg_dir/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s  %s\n' 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76 "$fixture_pg_dir/pgdg.asc" | sha256sum --check -
          sudo install -m 0644 "$fixture_pg_dir/pgdg.asc" /usr/share/keyrings/zasp-ci-pgdg.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/zasp-ci-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/zasp-ci-pgdg.list > /dev/null
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends postgresql-18 postgresql-client-18
          fixture_pg_bin=/usr/lib/postgresql/18/bin
          for fixture_tool in initdb postgres pg_isready pg_ctl pg_config; do
            test -x "$fixture_pg_bin/$fixture_tool"
          done
          case "$("$fixture_pg_bin/postgres" --version)" in
            "postgres (PostgreSQL) 18."*) ;;
            *) exit 1 ;;
          esac
          "$fixture_pg_bin/postgres" --version
          printf '%s\n' "$fixture_pg_bin" >> "$GITHUB_PATH"
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Verify implementation status ledger
        run: npm run implementation:status:check
      - name: Prime platform full-MVS metadata for offline release contracts
        timeout-minutes: 5
        run: GOENV=off GOWORK=off GOFLAGS= GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go list -C services/platform -mod=readonly -m all >/dev/null
      - name: Verify runnable UI
        run: |-
          task_verify_log=$(mktemp "${RUNNER_TEMP}/zasp-npm-verify.XXXXXX")
          set +e
          npm run verify 2>&1 | tee "$task_verify_log"
          task_verify_status=${PIPESTATUS[0]}
          set -e
          if [ "$task_verify_status" -ne 0 ]; then
            node scripts/annotate-verify-failure.mjs "$task_verify_log" || printf '%s\n' '::error title=npm verify failed::Verification failed; phase unavailable.'
          fi
          rm -f -- "$task_verify_log" || true
          exit "$task_verify_status"
      - name: Provision isolated compliance browser prerequisites
        timeout-minutes: 10
        run: |
          # This populates the exact cache entry consumed with --pull=never.
          compliance_postgres_image=postgres@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
          docker pull "$compliance_postgres_image"
          docker image inspect "$compliance_postgres_image" --format '{{json .RepoDigests}}' | node --input-type=module -e 'import assert from "node:assert/strict"; import { readFileSync } from "node:fs"; assert.ok(JSON.parse(readFileSync(0,"utf8")).includes(process.argv[1]), "pinned browser PostgreSQL digest absent");' "$compliance_postgres_image"
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync } from "node:fs";
          import { selectBrowserExecutable } from "./scripts/browser-prerequisites.mjs";
          const chrome = selectBrowserExecutable();
          console.log(`Hosted compliance browser: ${chrome}`);
          console.log(execFileSync(chrome, ["--version"], { encoding: "utf8", timeout: 5000, killSignal: "SIGKILL" }).trim());
          appendFileSync(process.env.GITHUB_ENV, `ZASP_COMBINED_E2E_CHROME=${chrome}\n`);
          NODE
      - name: Verify current compliance browser acceptance
        timeout-minutes: 15
        env:
          ZASP_COMBINED_E2E_COMPLIANCE: "true"
        run: |
          node --test scripts/browser-prerequisites.test.mjs scripts/browser-e2e-helpers.test.mjs scripts/owned-browser-postgres.test.mjs scripts/compliance-browser-bytes.test.mjs || { status=$?; printf '::error::Compliance browser unit prerequisites failed (exit %s)\n' "$status"; exit "$status"; }
          node scripts/production-combined-e2e.mjs || { status=$?; printf '::error::Compliance browser runtime acceptance failed (exit %s)\n' "$status"; exit "$status"; }
      - name: Verify Red Team runtime and ledger regressions
        run: |
          node --test scripts/red-team-runtime-proof.test.mjs scripts/production-combined-e2e.test.mjs scripts/audit-export-browser-proof.test.mjs scripts/audit-export-volume-proof.test.mjs scripts/runtime-precision-browser-proof.test.mjs scripts/owned-command.test.mjs scripts/implementation-status-check.test.mjs workers/redteam-node/runner.test.mjs workers/redteam-node/artifact.test.mjs
          go test -C services/platform -race -count=1 ./apiserver -run '^TestProductionRedTeamHandlerOperationAcceptance$'
      - name: Verify production release sources
        run: npm run production:release:gate
      - name: Verify session search IAM policies
        timeout-minutes: 10
        run: |
          task_tf_dir=$(mktemp -d "${RUNNER_TEMP}/zasp-terraform.XXXXXX")
          curl --fail --location --retry 3 --max-time 120 --output "$task_tf_dir/terraform.zip" https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
          printf '%s  %s\n' d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d "$task_tf_dir/terraform.zip" | sha256sum --check -
          unzip -q "$task_tf_dir/terraform.zip" -d "$task_tf_dir"
          export TF_DATA_DIR="$task_tf_dir/data"
          "$task_tf_dir/terraform" -chdir=deploy/staging init -backend=false -input=false -lockfile=readonly
          "$task_tf_dir/terraform" -chdir=deploy/staging test -filter=tests/session_search_iam.tftest.hcl -filter=tests/test_reconciler_iam.tftest.hcl -var-file=release.tfvars -no-color
      - name: Verify reconciliation maintenance alerts
        run: |
          task_prom_dir=$(mktemp -d "${RUNNER_TEMP}/zasp-promtool.XXXXXX")
          curl --fail --location --retry 3 --max-time 120 --output "$task_prom_dir/prometheus.tar.gz" https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz
          printf '%s  %s\n' f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d "$task_prom_dir/prometheus.tar.gz" | sha256sum --check -
          tar -xzf "$task_prom_dir/prometheus.tar.gz" -C "$task_prom_dir" prometheus-3.14.0.linux-amd64/promtool
          ZASP_PROMTOOL_BIN="$task_prom_dir/prometheus-3.14.0.linux-amd64/promtool" node --test deploy/production/reconciliation-maintenance-alerts.test.mjs deploy/production/audit-export-alerts.test.mjs deploy/production/test-reconciler-alerts.test.mjs
          ZASP_PROMTOOL_BIN="$task_prom_dir/prometheus-3.14.0.linux-amd64/promtool" go test -C services/platform -race -count=1 ./agentsec-api -run '^TestReconciliationMaintenancePrometheusExposition$'
      - name: Verify durable runtime sessions, enrollment pairing and candidate authority
        run: |
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 ./agentsec-migrate ./migrations ./runtimeevent ./internal/testprocess ./internal/sandboxcutover
          go test -C services/platform -race -count=1 ./agentsec-api ./agentsec-worker
          go test -C services/platform -race -count=1 ./runtimemetadata ./runtimelineage ./sensoradapter ./sessionsearch ./runtimeprojection ./runtimecorrelation ./runtimeindex/...
          task_reconciler_dir=$(mktemp -d "${RUNNER_TEMP}/zasp-reconciler.XXXXXX")
          go test -C services/platform -race -c -o "$task_reconciler_dir/worker-tests" ./agentsec-worker
          export ZASP_RECONCILE_CLIENT_BINARY="$task_reconciler_dir/worker-tests"
          go test -C services/platform -race -count=1 -timeout=30m ./apiserver -run '^(TestRuntime(Session|EnrollmentPairing|CandidateAuthority|CorrelationRouting|Sandbox|Precision)|TestSensor|TestReconciliationLanePlan|TestReconciliationMaintenance|TestConnectorAuthorizationPostgresReconciliationIndexes|Test.*SecurityAgent)'
      - name: Require audit fixture toolchains and pinned LocalStack image
        id: audit_prerequisites
        timeout-minutes: 35
        run: |
          test "$(node --version)" = v22.23.1
          test "$(go env GOVERSION)" = go1.26.8
          export PATH="$(pg_config --bindir):$PATH"
          for fixture_tool in initdb postgres pg_ctl pg_isready cc docker; do
            command -v "$fixture_tool"
          done
          test "$(id -u)" -ne 0
          cc --version
          docker info --format '{{.ServerVersion}}'
          docker pull localstack/localstack:4.7.0@sha256:12253acd9676770e9bd31cbfcf17c5ca6fd7fb5c0c62f3c46dd701f20304260c
      - name: Verify audit codec, configuration and artifact stores
        id: audit_packages
        timeout-minutes: 35
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -timeout=30m ./audit ./auditexportconfig ./artifactstore/...
      # Sequential bounds are failure deadlines, not hosted timing evidence.
      - name: Verify audit PostgreSQL authority A-M
        id: audit_a1
        timeout-minutes: 35
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=30m ./apiserver -run '^TestAuditExportPostgres[A-M]'
      - name: Verify audit PostgreSQL authority N-Z
        id: audit_a2
        timeout-minutes: 35
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=30m ./apiserver -run '^TestAuditExportPostgres[N-Z]'
      - name: Verify audit public, worker and compatibility acceptance
        id: audit_a3
        timeout-minutes: 35
        env:
          ZASP_AUDIT_EXPORT_LOCALSTACK_REQUIRED: "true"
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=30m ./apiserver -run '^TestAuditExport(Public|Identity|Worker|RunContext|s)'
      - name: Verify audit immutable retrieval and provider contracts
        id: audit_a4
        timeout-minutes: 35
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=30m ./apiserver -run '^TestAuditExport(Artifact|Composition|Contents|Cursor|Descriptor|HTTP(Create|Get|PostWorker|Rejects)|Localstack|LocalStack|Policy|Process|Production|Read|Recovery|Repository)'
      - name: Verify audit HTTP memory, provider and lifetime helpers
        id: audit_helpers
        timeout-minutes: 35
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=30m ./apiserver -run '^(TestAuditHTTP(Size(Expected|Memory|Oracle|PostgresStop|Process(Inputs|Protocol|TerminalTail|PrivateFiles|Environment|StartFailure|BackgroundOwnership)|Provider|Shutdown)|Fixture)|TestDisposablePostgresCleanup)'
      - name: Verify audit HTTP process composition and controlled zero source
        id: audit_composition
        timeout-minutes: 37
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=32m ./apiserver -run '^TestAuditHTTPSizeProcessCompositionPostgres$'
      - name: Verify audit full-size functional race children
        id: audit_race
        timeout-minutes: 37
        env:
          ZASP_AUDIT_HTTP_SIZE_BUILD: "race"
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=32m ./apiserver -run '^TestAuditExportHTTPSizeProcessPostgres$'
      - name: Verify both audit full-size memory sensitivity controls
        id: audit_controls
        timeout-minutes: 45
        env:
          ZASP_AUDIT_HTTP_SIZE_BUILD: ""
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=40m ./apiserver -run '^TestAuditExportHTTPSizeMemorySensitivityPostgres$'
      - name: Verify three serial audit full-size normal memory pairs
        id: audit_normal
        timeout-minutes: 45
        env:
          ZASP_AUDIT_HTTP_SIZE_BUILD: ""
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=40m ./apiserver -run '^TestAuditExportHTTPSizeProcessPostgres$'
      - name: Verify full-size orderly API restart with numeric children
        id: audit_orderly
        timeout-minutes: 25
        env:
          ZASP_AUDIT_HTTP_SIZE_BUILD: ""
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=20m ./apiserver -run '^TestAuditExportHTTPOrderlyRestartPostgres$'
      - name: Verify full-size orderly API restart with race children
        id: audit_orderly_race
        timeout-minutes: 25
        env:
          ZASP_AUDIT_HTTP_SIZE_BUILD: "race"
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/platform -race -count=1 -v -timeout=20m ./apiserver -run '^TestAuditExportHTTPOrderlyRestartPostgres$'
      - name: Verify sensor lineage and authenticated replay
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          test -x "$(pg_config --bindir)/initdb"
          go test -C services/sensor-agent -race -count=1 ./...
          go test -C services/platform -race -count=1 ./apiserver -run '^(TestRuntimeAcceptance|TestProductionRuntimeIngestHTTPPersistsTransactionalOutboxBeforeAcceptance)'
      - name: Verify actual daemon lost-success replay
        timeout-minutes: 15
        run: |
          node --test scripts/sensor-daemon-replay.test.mjs
          node scripts/sensor-daemon-replay.mjs
      - name: Verify bounded Attack Lab network enforcement
        run: |
          go test -C proofs/attack-lab-egress -race -count=1 ./...
          go test -C services/platform -race -count=1 ./attack-lab-runner ./attacklabrunner ./attack-lab-proxy ./attacklabproxy ./attacklab
          node --test proofs/attack-lab-egress/run.test.mjs
          node proofs/attack-lab-egress/run.mjs
          ZASP_ATTACK_LAB_EGRESS_DOCKER=true node --test proofs/attack-lab-egress/interruption.test.mjs
