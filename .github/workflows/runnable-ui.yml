name: Runnable UI

# Checks on every push and pull request. The long acceptance suite is in
# runnable-ui-acceptance.yml and is run by hand.
"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify runnable UI
    outputs:
      failure: ${{ steps.verify.outputs.failure }}
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: true
          cache-dependency-path: services/platform/go.sum
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Install locked dependencies
        run: SHARP_IGNORE_GLOBAL_LIBVIPS=1 npm ci
      # Reference validation only. Older-major compatibility remains an open
      # release gate in docs/internal/implementation_status_v1.5.md.
      - name: Install PostgreSQL 18 reference fixture tools
        run: |
          fixture_pg_dir=$(mktemp -d "${RUNNER_TEMP}/zasp-pgdg.XXXXXX")
          curl --fail --location --retry 3 --max-time 60 --output "$fixture_pg_dir/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s  %s\n' 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76 "$fixture_pg_dir/pgdg.asc" | sha256sum --check -
          sudo install -m 0644 "$fixture_pg_dir/pgdg.asc" /usr/share/keyrings/zasp-ci-pgdg.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/zasp-ci-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/zasp-ci-pgdg.list > /dev/null
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends postgresql-18 postgresql-client-18
          fixture_pg_bin=/usr/lib/postgresql/18/bin
          for fixture_tool in initdb postgres pg_isready pg_ctl pg_config; do
            test -x "$fixture_pg_bin/$fixture_tool"
          done
          case "$("$fixture_pg_bin/postgres" --version)" in
            "postgres (PostgreSQL) 18."*) ;;
            *) exit 1 ;;
          esac
          "$fixture_pg_bin/postgres" --version
          printf '%s\n' "$fixture_pg_bin" >> "$GITHUB_PATH"
      - name: Rehearse populated predecessor upgrades through V3 and compare the fresh catalog
        run: scripts/test-feature-v2-upgrade.sh
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Compile and exercise all four generated SDKs
        run: |
          sdk_venv="$RUNNER_TEMP/zasp-sdk-python"
          python3 -m venv "$sdk_venv"
          "$sdk_venv/bin/python" -m pip install 'httpx==0.28.1' 'pydantic==2.14.4' 'pytest==9.2.0'
          PATH="$sdk_venv/bin:$PATH" npm run sdk:test -- --python --java
      - name: Verify implementation status ledger
        run: npm run implementation:status:check
      - name: Prime platform full-MVS metadata for offline release contracts
        timeout-minutes: 5
        run: GOENV=off GOWORK=off GOFLAGS= GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go list -C services/platform -mod=readonly -m all >/dev/null
      - name: Verify approval maintenance signed notification delivery
        timeout-minutes: 10
        run: |
          go test -C services/platform -race -p 1 -count=1 -timeout=5m -json -run '^TestMaintenanceBoundary(DeliversOriginalSignedPayloadOverTLS|UnsafeDeliveryDoesNotReachHTTP|RetainsActualProviderFailure)$' ./apiserver
      - name: Verify runnable UI
        id: verify
        run: |-
          task_verify_log=$(mktemp "${RUNNER_TEMP}/zasp-npm-verify.XXXXXX")
          set +e
          npm run verify 2>&1 | tee "$task_verify_log"
          task_verify_status=${PIPESTATUS[0]}
          set -e
          if [ "$task_verify_status" -ne 0 ]; then
            annotation=$(node scripts/annotate-verify-failure.mjs "$task_verify_log" || printf '%s' '::error title=npm verify failed::Verification failed; phase unavailable.')
            printf '%s\n' "$annotation"
            # The repository's annotator emits only its fixed list of phase and test names.
            printf 'failure=%.220s\n' "${annotation#*failed::}" >> "$GITHUB_OUTPUT"
          fi
          rm -f -- "$task_verify_log" || true
          exit "$task_verify_status"
      - name: Verify current runtime profile inner diagnostic tests
        timeout-minutes: 5
        run: |
          node --test scripts/observe-current-profile-inner-diagnostics.test.mjs
          node scripts/observe-current-profile-inner-diagnostics.mjs
  verify-diagnostics:
    needs: verify
    if: failure() && needs.verify.outputs.failure != ''
    name: "${{ needs.verify.outputs.failure }}"
    runs-on: ubuntu-24.04
    steps:
      - run: echo "See the verification log for the full test results." >> "$GITHUB_STEP_SUMMARY"
  platform-go:
    name: Platform Go packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: true
          cache-dependency-path: services/platform/go.sum
      # Reference validation only, as in the verify job.
      - name: Install PostgreSQL 18 reference fixture tools
        run: |
          fixture_pg_dir=$(mktemp -d "${RUNNER_TEMP}/zasp-pgdg.XXXXXX")
          curl --fail --location --retry 3 --max-time 60 --output "$fixture_pg_dir/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s  %s\n' 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76 "$fixture_pg_dir/pgdg.asc" | sha256sum --check -
          sudo install -m 0644 "$fixture_pg_dir/pgdg.asc" /usr/share/keyrings/zasp-ci-pgdg.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/zasp-ci-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/zasp-ci-pgdg.list > /dev/null
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends postgresql-18 postgresql-client-18
          fixture_pg_bin=/usr/lib/postgresql/18/bin
          for fixture_tool in initdb postgres pg_isready pg_ctl pg_config; do
            test -x "$fixture_pg_bin/$fixture_tool"
          done
          case "$("$fixture_pg_bin/postgres" --version)" in
            "postgres (PostgreSQL) 18."*) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "$fixture_pg_bin" >> "$GITHUB_PATH"
      - name: Verify the platform package selection
        run: node --test scripts/platform-go-test-packages.test.mjs
      - name: Verify platform packages no other step runs
        timeout-minutes: 30
        run: |
          mapfile -t packages < <(node scripts/platform-go-test-packages.mjs)
          test "${#packages[@]}" -gt 0
          printf 'Testing %s\n' "${packages[@]}"
          go test -C services/platform -race -count=1 -timeout=25m "${packages[@]}"
          # Latency budgets are skipped under -race; measure them without it.
          go test -C services/platform -count=1 -run 'IsFast$' ./guardrail
      - name: Verify the apiserver feature tests
        timeout-minutes: 20
        run: |
          go test -C services/platform -race -count=1 -timeout=15m -run "$(node scripts/platform-go-test-packages.mjs --apiserver-features)" ./apiserver
