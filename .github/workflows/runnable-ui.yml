name: Runnable UI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify runnable UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.6
          cache: true
          cache-dependency-path: services/platform/go.sum
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - name: Install locked dependencies
        run: SHARP_IGNORE_GLOBAL_LIBVIPS=1 npm ci
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Verify implementation status ledger
        run: npm run implementation:status:check
      - name: Verify runnable UI
        run: npm run verify
      - name: Verify production release sources
        run: npm run production:release:gate
