name: Observe official public advisory revisions
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */8 * * *'
permissions: {contents: read}
jobs:
  refresh:
    if: vars.ZASP_PUBLIC_ADVISORY_SYNC_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Read public publisher metadata without an inventory or token
        run: node scripts/release-security/refresh.mjs "$RUNNER_TEMP/public-advisory-observations"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-advisory-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-advisory-observations/*.json
          if-no-files-found: error
          retention-days: 30
