name: Retention IAM acceptance

"on":
  push:
    paths:
      - '.github/workflows/retention-iam-acceptance.yml'
      - 'deploy/staging/*.tf'
      - 'deploy/staging/main.tf'
      - 'deploy/staging/versions.tf'
      - 'deploy/staging/.terraform.lock.hcl'
      - 'deploy/staging/release.tfvars'
      - 'deploy/staging/iam-policy-union-v1.mjs'
      - 'deploy/staging/iam-policy-union-v1.test.mjs'
      - 'deploy/staging/tests/*iam*.tftest.hcl'
  pull_request:
    paths:
      - '.github/workflows/retention-iam-acceptance.yml'
      - 'deploy/staging/*.tf'
      - 'deploy/staging/main.tf'
      - 'deploy/staging/versions.tf'
      - 'deploy/staging/.terraform.lock.hcl'
      - 'deploy/staging/release.tfvars'
      - 'deploy/staging/iam-policy-union-v1.mjs'
      - 'deploy/staging/iam-policy-union-v1.test.mjs'
      - 'deploy/staging/tests/*iam*.tftest.hcl'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-iam:
    name: Locked Terraform mock-plan and complete IAM unions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Verify source and workflow permission contracts
        run: |
          test "$(node --version)" = v22.23.1
          node --test deploy/staging/iam-policy-union-v1.test.mjs
      # Only provider-owned mocked plans are evaluated. This grants no cloud
      # identity and produces no infrastructure or deployed acceptance evidence.
      - name: Verify fixed IAM methods, predecessor gates and complete policy unions
        timeout-minutes: 10
        run: |
          task_tf_dir=$(mktemp -d "${RUNNER_TEMP}/zasp-terraform.XXXXXX")
          curl --fail --location --retry 3 --max-time 120 --output "$task_tf_dir/terraform.zip" https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
          printf '%s  %s\n' d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d "$task_tf_dir/terraform.zip" | sha256sum --check -
          unzip -q "$task_tf_dir/terraform.zip" -d "$task_tf_dir"
          export TF_DATA_DIR="$task_tf_dir/data"
          "$task_tf_dir/terraform" -chdir=deploy/staging init -backend=false -input=false -lockfile=readonly
          "$task_tf_dir/terraform" -chdir=deploy/staging test -filter=tests/session_search_iam.tftest.hcl -filter=tests/test_reconciler_iam.tftest.hcl -var-file=release.tfvars -no-color
          node --test deploy/staging/iam-policy-union-v1.test.mjs
          "$task_tf_dir/terraform" -chdir=deploy/staging test -filter=tests/iam_policy_union.tftest.hcl -json -verbose -no-color > "$task_tf_dir/iam-policy-union.jsonl"
          node --max-old-space-size=512 deploy/staging/iam-policy-union-v1.test.mjs --plan "$task_tf_dir/iam-policy-union.jsonl"
          node deploy/staging/iam-policy-union-v1.mjs --plan "$task_tf_dir/iam-policy-union.jsonl"
          git diff --exit-code -- deploy/staging/.terraform.lock.hcl
